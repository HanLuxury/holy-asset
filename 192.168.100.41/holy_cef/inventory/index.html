<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Holy CEF Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="inventory" class="inventory-shell" data-cef-area>
    <section class="player-panel">
      <div class="profile-card">
        <div class="avatar-ring"><div class="avatar"><img src="../icons/inventory.svg" alt=""></div></div>
        <div class="profile-info">
          <b>PLAYER INVENTORY</b>
          <span id="money">$0</span>
          <span id="level">Level 1</span>
        </div>
      </div>
      <div class="hint-box">
        <b><img class="small-icon" src="../icons/info.svg" alt="">Control</b>
        <span>Klik item sumber lalu klik slot tujuan untuk pindah / swap.</span>
        <span>Drop & Give pakai tombol bawah.</span>
      </div>
    </section>

    <main class="main-panel">
      <div class="topbar">
        <div>
          <h1><img class="title-icon" src="../icons/inventory.svg" alt="">BARANG SAYA</h1>
          <p>FiveM style CEF inventory</p>
        </div>
        <div class="top-actions">
          <div id="weight" class="weight"><img class="small-icon" src="../icons/weight.svg" alt=""><span>0/30 KG</span></div>
          <button class="close-btn" data-cef-area onclick="sendButton('close')"><img class="small-icon" src="../icons/close.svg" alt="">HIDE</button>
        </div>
      </div>

      <div id="grid" class="slot-grid" data-cef-area></div>

      <div class="actionbar" data-cef-area>
        <button onclick="sendButton('use')"><img class="small-icon" src="../icons/use.svg" alt="">GUNAKAN</button>
        <button onclick="sendButton('info')"><img class="small-icon" src="../icons/info.svg" alt="">INFO</button>
        <button onclick="openAmountModal('give')"><img class="small-icon" src="../icons/give.svg" alt="">BERI</button>
        <button onclick="openAmountModal('drop')"><img class="small-icon" src="../icons/drop.svg" alt="">BUANG</button>
      </div>
    </main>
  </div>

  <div id="modal" class="modal hidden" data-cef-area>
    <div class="modal-card">
      <h2 id="modalTitle">Action</h2>
      <label id="targetWrap" class="field hidden">Target ID
        <input id="targetInput" type="number" min="0" value="0">
      </label>
      <label class="field">Jumlah
        <input id="amountInput" type="number" min="1" value="1">
      </label>
      <div class="modal-actions">
        <button onclick="submitModal()">OK</button>
        <button onclick="closeModal()">BATAL</button>
      </div>
    </div>
  </div>

  <div id="infoBox" class="info-box hidden" data-cef-area>
    <button onclick="hideInfo()">×</button>
    <div id="infoContent"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
