<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holy Phone</title><style>html,body{margin:0;background:transparent;color:white;font-family:Arial;height:100%;overflow:hidden}.box{position:absolute;right:40px;bottom:40px;width:260px;height:420px;border-radius:34px;background:linear-gradient(180deg,#172033,#090d17);border:2px solid rgba(255,255,255,.15);box-shadow:0 20px 50px #000;padding:24px}.title{font-weight:900}.app{margin-top:18px;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)}</style></head><body><div class="box"><div class="title">HOLY PHONE CEF</div><div class="app">Placeholder link khusus phone.</div><div class="app">Nanti semua app phone bisa dipisah di sini.</div></div><script>window.Cef={_handlers:{},on(e,f){this._handlers[e]=f},_trigger(e,j){if(this._handlers[e])this._handlers[e](j)}};setTimeout(()=>{try{CefBridge.cefReady();const r=document.querySelector('.box').getBoundingClientRect();CefBridge.updateInteractiveAreas(JSON.stringify([[r.left,r.top,r.width,r.height]]))}catch(e){}},80)</script></body></html>
