<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Eagle • New Player</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;pointer-events:none;font-family:Inter,Arial,sans-serif;color:#f7fbff;min-height:100vh;overflow:hidden}.wrap{min-height:100vh;display:flex;pointer-events:none;align-items:center;justify-content:center;padding:24px}.panel{pointer-events:auto;width:min(900px,88vw);max-height:84vh;max-height:92vh;overflow:auto;background:linear-gradient(145deg,rgba(20,29,43,.96),rgba(8,13,22,.97));border:1px solid rgba(255,255,255,.10);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.06);padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7fa8c9}.title{font-size:30px;font-weight:850;margin-top:8px}.sub{color:#9eacbc;margin-top:7px;line-height:1.45}.steps{display:flex;gap:8px;margin:22px 0}.step{flex:1;height:7px;border-radius:999px;background:#253142}.step.on{background:linear-gradient(90deg,#2cc8ff,#72e0ff)}.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{background:rgba(0,0,0,.16);border-radius:14px;padding:13px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8292a5}.value{font-size:17px;font-weight:750;margin-top:5px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;color:white;background:linear-gradient(135deg,#12a9db,#246cff);box-shadow:0 10px 30px rgba(25,155,225,.22)}.btn.alt{background:#202b39}.btn:active{transform:scale(.985)}.route{display:flex;gap:14px;align-items:center}.pin{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(38,189,255,.12);font-size:22px}.mini{font-size:12px;color:#8e9dad}.question{font-size:21px;font-weight:800;line-height:1.35}.opt{width:100%;text-align:left;margin-top:9px;background:#182433;border:1px solid #2a3b50;color:#fff;padding:14px;border-radius:13px}.opt:hover{border-color:#39cfff}.result{font-size:28px;font-weight:900}.ok{color:#6de6ab}.bad{color:#ff7784}.progress{height:8px;background:#182435;border-radius:99px;overflow:hidden;margin-top:13px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#25c8ff,#57e5bc);width:0}.center{text-align:center;padding:22px}.muted{color:#9ba9b8}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0e1825;border:1px solid rgba(255,255,255,.1);padding:12px 18px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:650px){.panel{padding:20px;border-radius:20px}.title{font-size:24px}.grid{grid-template-columns:1fr}.wrap{padding:12px}}

/* ============================================================
   Infinix GT 30 Pro fit — 1080x2436 (~20.3:9) AMOLED punch-hole.
   GTA SA renders LANDSCAPE, jadi surface CEF pendek & lebar.
   Lapisan universal: hormati safe-area, jamin UI muat di layar,
   target sentuh nyaman. Ditaruh paling akhir agar menang cascade.
   ============================================================ */
:root{
  --gt-safe-t:env(safe-area-inset-top,0px);
  --gt-safe-b:env(safe-area-inset-bottom,0px);
  --gt-safe-l:env(safe-area-inset-left,0px);
  --gt-safe-r:env(safe-area-inset-right,0px);
  --gt-vw:calc(100vw - var(--gt-safe-l) - var(--gt-safe-r));
  --gt-vh:calc(100vh - var(--gt-safe-t) - var(--gt-safe-b));
}
html,body{
  margin:0 !important; padding:0 !important;
  width:100% !important; height:100% !important;
  max-width:100vw !important; overflow:hidden !important;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
button,.btn,.app,.slot,.card,.close,.tab,.nav,.chip,a,input,select,textarea{ touch-action:manipulation; }

/* Padding aman utk punch-hole / sudut membulat; body tetap flex-center */
body{
  padding:var(--gt-safe-t) var(--gt-safe-r) var(--gt-safe-b) var(--gt-safe-l) !important;
}

/* Root panel: jangan pernah melebihi area aman; konten scroll di dalam */
.phone,.shell,.window,.panel,.container,.wrap>.panel,.frame,.modal-card{
  max-width:var(--gt-vw) !important;
  max-height:var(--gt-vh) !important;
}
.shell,.window,.panel,.container{ overflow:auto !important; -webkit-overflow-scrolling:touch; }

/* Phone mock: pakai tinggi layar maksimal namun proporsional & tetap terbaca */
.phone{
  width:min(400px,var(--gt-vw)) !important;
  height:min(96vh,820px) !important;
  max-height:var(--gt-vh) !important;
}

/* Layar sangat pendek (landscape HP tinggi): rapatkan sedikit */
@media (max-height:460px){
  .phone{ height:var(--gt-vh) !important; border-radius:22px !important; }
  .shell,.window,.panel{ height:var(--gt-vh) !important; }
}

</style></head><body><div class="wrap"><main class="panel"><div class="top"><div><div class="eyebrow">EAGLE ROLEPLAY • NEW PLAYER</div><div id="title" class="title">Selamat datang</div><div id="sub" class="sub">Selesaikan onboarding sebelum mulai beraktivitas.</div></div><div class="mini" id="loc">SAN FIERRO</div></div><div class="steps"><i class="step" id="s1"></i><i class="step" id="s2"></i><i class="step" id="s3"></i><i class="step" id="s4"></i></div><section id="content"></section></main></div><div id="toast" class="toast"></div><script>
const $=id=>document.getElementById(id);let STATE={step:1};
function emit(e,p={}){const raw=JSON.stringify(p);try{if(window.nativeSendEvent){window.nativeSendEvent(e,raw);return true}if(window.Cef&&window.Cef.sendEvent){window.Cef.sendEvent(e,raw);return true}if(window.Android&&Android.sendEvent){Android.sendEvent(e,raw);return true}}catch(_){ }return false}
function syncCefPanelBounds(){const panel=document.querySelector('.panel');if(!panel)return;const r=panel.getBoundingClientRect();const vw=Math.max(1,innerWidth||1),vh=Math.max(1,innerHeight||1);emit('cef.panel.bounds',{left:r.left/vw,top:r.top/vh,right:r.right/vw,bottom:r.bottom/vh});}
function trigger(e,d){let p={};try{p=JSON.parse(d||'{}')}catch(_){ }if(e==='tutorial.state'){STATE={...STATE,...p};renderBase();}else if(e==='tutorial.route'){renderRoute(p)}else if(e==='tutorial.identity'){renderIdentity(p)}else if(e==='tutorial.dmv.ready'){renderDMV(p)}else if(e==='tutorial.dmv.arrived'){renderDMV(p)}else if(e==='tutorial.theory.question'){renderQuestion(p)}else if(e==='tutorial.theory.result'){renderResult(p)}else if(e==='tutorial.practical'){renderPractical(p)}else if(e==='tutorial.practical.start'){renderPracticalProgress(p)}else if(e==='tutorial.practical.progress'){renderPracticalProgress(p)}else if(e==='tutorial.practical.fail'){toast(p.reason||'Ujian gagal');renderPractical(p)}else if(e==='tutorial.practical.warning'){toast(p.text||'')}else if(e==='tutorial.toast'){toast(p.text||'')}else if(e==='tutorial.complete'){renderComplete(p)}}
window.Cef=window.Cef||{};window.Cef._trigger=window.Cef._trigger||trigger;
function renderBase(){for(let i=1;i<=4;i++)$('s'+i).classList.toggle('on',i<=STATE.step);}
function renderRoute(p){$('title').textContent=p.title||'Tujuan berikutnya';$('sub').textContent=p.description||'';$('content').innerHTML=`<div class="card route"><div class="pin">📍</div><div><b>${esc(p.title)}</b><div class="mini">Checkpoint merah sudah ditandai di dunia.</div></div></div><div class="card"><b>Ikuti petunjuk</b><p class="muted">Pergi ke checkpoint merah di map. Setelah tiba, tahap berikutnya akan terbuka otomatis.</p></div>`;}
function renderIdentity(p){renderBase();$('title').textContent='Langkah 1 • KTP';$('sub').textContent='Datangi Balai Kota. Data legal dari registrasi karakter akan diterbitkan sebagai KTP.';$('content').innerHTML=`<div class="card"><div class="grid"><div class="field"><div class="label">Nama Depan</div><div class="value">${esc(p.first)}</div></div><div class="field"><div class="label">Nama Belakang</div><div class="value">${esc(p.last||'-')}</div></div><div class="field"><div class="label">Tanggal Lahir</div><div class="value">${esc(p.dob)}</div></div><div class="field"><div class="label">Status</div><div class="value">${p.canIssue?'Siap diterbitkan':'Belum siap'}</div></div></div></div><div class="actions"><button class="btn" onclick="emit('tutorial.ktp.issue')">Terbitkan KTP</button></div>`;}
function renderDMV(p){STATE.step=2;renderBase();$('title').textContent='Langkah 2 • SIM';$('sub').textContent=p.description||'Ikuti ujian teori sebelum tes praktik.';$('content').innerHTML=`<div class="card center"><div style="font-size:46px">🚗</div><h2>Driving School / DMV</h2><div class="muted">5 pertanyaan • minimal 4 jawaban benar</div><div class="actions" style="justify-content:center"><button class="btn" onclick="emit('tutorial.theory.start')">Mulai Ujian Teori</button></div></div>`;}
function renderQuestion(p){$('title').textContent=`Ujian Teori • ${p.index}/${p.total}`;$('sub').textContent='Pilih jawaban yang paling sesuai aturan berkendara.';$('content').innerHTML=`<div class="card"><div class="question">${esc(p.question)}</div>${(p.options||[]).map((x,i)=>`<button class="opt" onclick="emit('tutorial.theory.answer',{answer:${i}})">${esc(x)}</button>`).join('')}<div class="progress"><i style="width:${Math.round(((p.index-1)/p.total)*100)}%"></i></div></div>`;}
function renderResult(p){$('title').textContent='Hasil Ujian Teori';$('sub').textContent='';$('content').innerHTML=`<div class="card center"><div class="result ${p.pass?'ok':'bad'}">${p.score}/${p.total}</div><p>${p.pass?'Teori lulus. Bersiap menuju ujian praktik.':'Teori belum lulus. Ulangi ujian dari awal.'}</p></div>`;if(p.pass)setTimeout(()=>emit('tutorial.practical.start'),900);else setTimeout(()=>renderDMV({description:'Ulangi ujian teori. Minimal 4 dari 5 jawaban benar.'}),1600)}
function renderPractical(p){STATE.step=3;renderBase();$('title').textContent='Langkah 3 • Praktik';$('sub').textContent=p.rule||'Ikuti seluruh checkpoint merah.';$('content').innerHTML=`<div class="card"><div class="grid"><div class="field"><div class="label">Kendaraan</div><div class="value">${esc(p.vehicle||'Kendaraan ujian')}</div></div><div class="field"><div class="label">Checkpoint</div><div class="value">${p.total||6} titik</div></div></div><div class="actions"><button class="btn" onclick="emit('tutorial.practical.start')">Mulai Tes Praktik</button></div></div>`;}
function renderPracticalProgress(p){STATE.step=3;renderBase();$('title').textContent=`Tes Praktik • ${p.index||1}/${p.total||6}`;$('sub').textContent='Pertahankan kendaraan dan ikuti checkpoint merah berikutnya.';$('content').innerHTML=`<div class="card center"><div style="font-size:42px">🏁</div><div class="progress"><i style="width:${Math.round(((p.index||1)/(p.total||6))*100)}%"></i></div><p class="muted">Checkpoint berikutnya sudah ditandai di dunia.</p></div>`;}
function renderComplete(p){STATE.step=4;renderBase();$('title').textContent=p.title||'Tutorial selesai';$('sub').textContent=p.message||'Identitas legal dan SIM sudah lengkap.';$('content').innerHTML=`<div class="card center"><div style="font-size:58px">✅</div><h2>Kamu siap bermain</h2><p class="muted">Sekarang kamu dapat bekerja, memiliki kendaraan, memakai layanan kota, dan menjelajahi San Fierro.</p></div>`;setTimeout(()=>toast('Onboarding selesai'),300);}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
renderBase();emit('tutorial.ready');setTimeout(syncCefPanelBounds,0);
window.addEventListener('resize',()=>setTimeout(syncCefPanelBounds,0));
</script></body></html>
