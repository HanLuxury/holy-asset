<style>
:root{--cyan:#19d7ff;--cyan2:#5ef5ff;--bg:#071018;--panel:rgba(13,22,31,.82);--panel2:rgba(17,29,40,.94);--line:rgba(255,255,255,.09);--muted:#91a3b5;--good:#55e6a5;--warn:#ffc857;--bad:#ff6178;--shadow:0 20px 60px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}.app{position:fixed;inset:0;padding:30px;display:flex;align-items:center;justify-content:center;pointer-events:none}.window{pointer-events:auto;width:min(1280px,95vw);height:min(820px,92vh);border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(7,16,24,.95),rgba(10,19,27,.86));box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(18px);animation:in .24s ease}.top{height:76px;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(25,215,255,.22),rgba(25,215,255,.05));border:1px solid rgba(25,215,255,.3);font-size:21px}.title{font-size:20px;font-weight:800;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.spacer{flex:1}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:#c7d4de;background:rgba(255,255,255,.03)}.close{border:0;color:#c8d3dd;background:rgba(255,255,255,.05);width:40px;height:40px;border-radius:12px;cursor:pointer}.close:hover{background:rgba(255,97,120,.12);color:#fff}.body{height:calc(100% - 76px);display:grid;grid-template-columns:350px 1fr}.sidebar{border-right:1px solid var(--line);padding:16px;overflow:auto}.search{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);outline:0;color:#fff;padding:12px 14px;border-radius:13px}.list{margin-top:12px;display:flex;flex-direction:column;gap:8px}.job{padding:13px;border:1px solid transparent;border-radius:16px;background:rgba(255,255,255,.025);cursor:pointer;transition:.16s}.job:hover,.job.on{border-color:rgba(25,215,255,.32);background:rgba(25,215,255,.08);transform:translateX(2px)}.jobrow{display:flex;align-items:center;gap:11px}.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:22px}.jn{font-weight:700;font-size:14px}.jc{font-size:11px;color:var(--muted);margin-top:2px}.jobmeta{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:10px;color:#b7c4cf;border:1px solid var(--line);padding:4px 7px;border-radius:999px}.main{padding:22px;overflow:auto}.hero{padding:20px;border-radius:20px;background:linear-gradient(140deg,rgba(25,215,255,.10),rgba(255,255,255,.025));border:1px solid rgba(25,215,255,.18)}.hero h1{font-size:26px;margin:0}.hero p{color:#9db0bf;line-height:1.5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}.metric:last-child{border-bottom:0}.label{color:var(--muted);font-size:12px}.value{font-weight:700;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:#fff;background:rgba(255,255,255,.04);cursor:pointer}.btn:hover{background:rgba(255,255,255,.08)}.btn.primary{background:linear-gradient(135deg,rgba(25,215,255,.22),rgba(25,215,255,.08));border-color:rgba(25,215,255,.4)}.btn.good{border-color:rgba(85,230,165,.3);background:rgba(85,230,165,.09)}.btn.bad{border-color:rgba(255,97,120,.3);background:rgba(255,97,120,.08)}.hint{font-size:11px;color:var(--muted);margin-top:12px}.hidden{display:none!important}.admin{display:grid;grid-template-columns:1fr 1.15fr;gap:14px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.04);color:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;outline:0}.field textarea{min-height:70px;resize:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.step{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:rgba(255,255,255,.025)}.empty{padding:36px;text-align:center;color:var(--muted)}.mini{position:absolute;inset:0;background:rgba(2,8,13,.72);display:grid;place-items:center;backdrop-filter:blur(7px)}.miniBox{width:min(760px,88vw);border:1px solid rgba(25,215,255,.28);background:var(--panel2);border-radius:24px;box-shadow:var(--shadow);padding:22px;animation:in .2s ease}.miniHead{display:flex;justify-content:space-between;align-items:flex-start}.miniTitle{font-size:19px;font-weight:800}.miniDesc{color:var(--muted);font-size:12px;margin-top:4px}.timer{font-weight:800;color:var(--cyan)}.game{margin-top:18px;min-height:300px;display:grid;place-items:center}.gameInner{width:100%}.tapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tap{height:66px;border:1px solid var(--line);border-radius:14px;color:#fff;background:rgba(255,255,255,.04);cursor:pointer}.tap.good{border-color:rgba(85,230,165,.5);background:rgba(85,230,165,.12)}.sequence{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.seq{width:58px;height:58px;display:grid;place-items:center;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;cursor:pointer}.bar{height:52px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:15px;position:relative;overflow:hidden}.zone{position:absolute;top:0;bottom:0;left:44%;width:16%;background:rgba(85,230,165,.18);border-left:1px solid rgba(85,230,165,.4);border-right:1px solid rgba(85,230,165,.4)}.cursor{position:absolute;top:5px;bottom:5px;width:6px;background:var(--cyan);border-radius:99px;left:0}.miniFoot{display:flex;justify-content:space-between;margin-top:15px;color:var(--muted);font-size:11px}.bigPrompt{font-size:34px;font-weight:900;text-align:center}.workRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.workBtn{min-width:100px;height:56px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;cursor:pointer}.workBtn:hover{border-color:rgba(25,215,255,.35)}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:900px){.body{grid-template-columns:1fr}.sidebar{display:none}.admin{grid-template-columns:1fr}.window{height:96vh}}

/* ============================================================
   Infinix GT 30 Pro fit — 1080x2436 (~20.3:9) AMOLED punch-hole.
   GTA SA renders LANDSCAPE, jadi surface CEF pendek & lebar.
   Lapisan universal: hormati safe-area, jamin UI muat di layar,
   target sentuh nyaman. Ditaruh paling akhir agar menang cascade.
   ============================================================ */
:root{
  --gt-safe-t:env(safe-area-inset-top,0px);
  --gt-safe-b:env(safe-area-inset-bottom,0px);
  --gt-safe-l:env(safe-area-inset-left,0px);
  --gt-safe-r:env(safe-area-inset-right,0px);
  --gt-vw:calc(100vw - var(--gt-safe-l) - var(--gt-safe-r));
  --gt-vh:calc(100vh - var(--gt-safe-t) - var(--gt-safe-b));
}
html,body{
  margin:0 !important; padding:0 !important;
  width:100% !important; height:100% !important;
  max-width:100vw !important; overflow:hidden !important;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
button,.btn,.app,.slot,.card,.close,.tab,.nav,.chip,a,input,select,textarea{ touch-action:manipulation; }

/* Padding aman utk punch-hole / sudut membulat; body tetap flex-center */
body{
  padding:var(--gt-safe-t) var(--gt-safe-r) var(--gt-safe-b) var(--gt-safe-l) !important;
}

/* Root panel: jangan pernah melebihi area aman; konten scroll di dalam */
.phone,.shell,.window,.panel,.container,.wrap>.panel,.frame,.modal-card{
  max-width:var(--gt-vw) !important;
  max-height:var(--gt-vh) !important;
}
.shell,.window,.panel,.container{ overflow:auto !important; -webkit-overflow-scrolling:touch; }

/* Phone mock: pakai tinggi layar maksimal namun proporsional & tetap terbaca */
.phone{
  width:min(400px,var(--gt-vw)) !important;
  height:min(96vh,820px) !important;
  max-height:var(--gt-vh) !important;
}

/* Layar sangat pendek (landscape HP tinggi): rapatkan sedikit */
@media (max-height:460px){
  .phone{ height:var(--gt-vh) !important; border-radius:22px !important; }
  .shell,.window,.panel{ height:var(--gt-vh) !important; }
}

<body>
<div class="app">
 <div class="window">
  <div class="top"><div class="logo">E</div><div><div class="title">Eagle Jobs</div><div class="sub" id="topSub">Dynamic career center</div></div><div class="spacer"></div><div class="pill" id="modePill">PLAYER</div><button class="close" id="closeBtn">×</button></div>
  <div class="body">
   <aside class="sidebar"><input id="search" class="search" placeholder="Cari pekerjaan..."><div id="jobList" class="list"></div></aside>
   <main class="main">
    <section id="playerView"><div id="hero"></div><div id="detailGrid" class="grid2"></div><div id="actions" class="actions"></div><div class="hint">Datangi titik pekerjaan untuk mengambil job. Setelah mulai, setiap checkpoint memerlukan mini-game CEF.</div></section>
    <section id="adminView" class="hidden"><div class="admin"><div class="card"><div class="toolbar"><button class="btn primary" onclick="newJob()">+ Job Baru</button><button class="btn" onclick="refreshAdmin()">Refresh</button></div><div id="adminCards"></div></div><div><div class="card" id="editor"></div><div class="card" style="margin-top:14px" id="stepsEditor"></div><div class="card" style="margin-top:14px" id="assignEditor"></div></div></div></section>
   </main>
  </div>
 </div>
 <div id="mini" class="mini hidden"><div class="miniBox"><div class="miniHead"><div><div id="miniTitle" class="miniTitle">Mini Game</div><div id="miniDesc" class="miniDesc"></div></div><div id="miniTimer" class="timer">--</div></div><div id="game" class="game"></div><div class="miniFoot"><span id="miniStep">Step 1</span><span>Target skor ≥ 40</span></div></div></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id); const state={admin:false,jobs:[],selected:1,current:{id:0,name:'Pengangguran',working:0,step:0,earned:0,payMin:0,payMax:0,level:1},steps:[],mini:null,filtered:[]};
const icons=['','🚌','🚕','🚚','🧹','🍕','🔧','🔫','⛏️','🪓','🍗','🧵','🛢️','🎣','🥛','🌾','📦','♻️','🥤','🌿','🗑️','⚡','🚜','📬','🌴'];
const miniNames={1:'Bus Stop Timing',2:'Taxi Reaction',3:'Cargo Scan',4:'Street Sweep',5:'Pizza Memory',6:'Mechanic Wiring',7:'Weapon Assembly',8:'Mining Strike',9:'Lumber Rhythm',10:'Butcher Cut',11:'Tailor Stitch',12:'Oil Pressure',13:'Fishing Catch',14:'Milking Rush',15:'Farm Watering',16:'Cargo Lock',17:'Recycle Sort',18:'Mixer Recipe',19:'Mowing Targets',20:'Trash Pickup',21:'Electric Match',22:'Forklift Align',23:'Package Scan',24:'Palm Rhythm'};
function emit(ev,p={}){const s=JSON.stringify(p);try{if(window.nativeSendEvent){const r=window.nativeSendEvent(ev,s);if(r!==undefined)return r;}}catch(e){} try{if(window.Cef&&window.Cef.sendEvent)return window.Cef.sendEvent(ev,s);}catch(e){} return 0;}

function syncCefPanelBounds(){const panel=document.querySelector('.window');if(!panel)return;const r=panel.getBoundingClientRect();const vw=Math.max(1,window.innerWidth||1),vh=Math.max(1,window.innerHeight||1);emit('cef.panel.bounds',{left:r.left/vw,top:r.top/vh,right:r.right/vw,bottom:r.bottom/vh});}
window.Cef=window.Cef||{};
window.Cef._trigger=function(ev,data){let p={};try{p=JSON.parse(data||'{}')}catch(e){p={}}; if(ev==='jobs.mode'){state.admin=!!p.admin;renderMode();if(state.admin)emit('jobs.admin.ready');return} if(ev==='jobs.list'||ev==='jobs.admin.list'){if(p.reset===1)state.jobs=[];(p.items||[]).forEach(x=>state.jobs.push(x)); if(ev==='jobs.list')renderPlayer();else renderAdmin();return} if(ev==='jobs.state'){state.current=p;renderPlayer();return} if(ev==='jobs.admin.steps'){state.steps=p.items||[];renderSteps();return} if(ev==='jobs.minigame.start'){openMini(p);return} if(ev==='jobs.admin.pos'){state.pos=p;return}};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderMode(){$('modePill').textContent=state.admin?'ADMIN':'PLAYER';$('topSub').textContent=state.admin?'Dynamic job editor • saved to MySQL':'Dynamic career center';$('playerView').classList.toggle('hidden',state.admin);$('adminView').classList.toggle('hidden',!state.admin); if(state.admin)renderAdmin();else renderPlayer();}
function filteredJobs(){const q=$('search').value.toLowerCase();return state.jobs.filter(j=>(j.name+' '+j.category+' '+j.description).toLowerCase().includes(q))}
function renderList(){const arr=filteredJobs();$('jobList').innerHTML=arr.map(j=>`<div class="job ${j.id===state.selected?'on':''}" onclick="selectJob(${j.id})"><div class="jobrow"><div class="icon">${icons[j.id]||'💼'}</div><div><div class="jn">${esc(j.name)}</div><div class="jc">${esc(j.category)} • mini #${j.mini}</div></div></div><div class="jobmeta"><span class="tag">$${j.paymin}-${j.paymax}</span><span class="tag">LV ${j.minlevel}</span><span class="tag">${j.workers||0} worker</span></div></div>`).join('')||'<div class="empty">Tidak ada pekerjaan.</div>'}
function selectJob(id){state.selected=id;renderList();const j=state.jobs.find(x=>x.id===id);if(!j)return;if(state.admin){fillEditor(j);emit('jobs.admin.steps',{id});}else renderPlayer()}
window.selectJob=selectJob;
function renderPlayer(){renderList();const j=state.jobs.find(x=>x.id===state.selected)||state.jobs[0];if(j)state.selected=j.id; if(!j){$('hero').innerHTML='<div class="empty">Belum ada pekerjaan.</div>';return}const c=state.current;const working=c.working&&c.id===j.id;$('hero').innerHTML=`<div class="hero"><h1>${icons[j.id]||'💼'} ${esc(j.name)}</h1><p>${esc(j.description)}</p><div class="jobmeta"><span class="tag">${esc(j.category)}</span><span class="tag">Mini: ${esc(miniNames[j.mini]||('#'+j.mini))}</span><span class="tag">${j.vehicle?'Vehicle '+j.vehicle:'On foot'}</span></div></div>`;$('detailGrid').innerHTML=`<div class="card"><div class="metric"><span class="label">Gaji per titik</span><span class="value">$${j.paymin} - $${j.paymax}</span></div><div class="metric"><span class="label">Minimum level</span><span class="value">${j.minlevel}</span></div><div class="metric"><span class="label">Pekerja aktif</span><span class="value">${j.workers||0}${j.maxworkers?' / '+j.maxworkers:''}</span></div></div><div class="card"><div class="metric"><span class="label">Job sekarang</span><span class="value">${c.id?esc(c.name):'Pengangguran'}</span></div><div class="metric"><span class="label">Status</span><span class="value">${working?'Sedang bekerja':(c.id===j.id?'Tersedia':'Belum diambil')}</span></div><div class="metric"><span class="label">Pendapatan sesi</span><span class="value">$${c.earned||0}</span></div></div>`;let b=[];b.push(`<button class="btn" onclick="gpsJob()">GPS</button>`);if(c.id!==j.id)b.push(`<button class="btn primary" onclick="takeJob()">Ambil Job</button>`);if(c.id===j.id&&!c.working)b.push(`<button class="btn good" onclick="startJob()">Mulai Shift</button>`);if(c.working)b.push(`<button class="btn bad" onclick="stopJob()">Stop Shift</button>`);$('actions').innerHTML=b.join('')}
window.gpsJob=()=>{emit('jobs.gps',{id:state.selected})};window.takeJob=()=>emit('jobs.take',{id:state.selected});window.startJob=()=>emit('jobs.start');window.stopJob=()=>emit('jobs.stop');
function renderAdmin(){renderList();const j=state.jobs.find(x=>x.id===state.selected);if(!j){$('adminCards').innerHTML='<div class="empty">Pilih atau buat job.</div>';return}fillEditor(j);renderSteps();$('adminCards').innerHTML=state.jobs.map(x=>`<div class="job ${x.id===state.selected?'on':''}" onclick="selectJob(${x.id})"><div class="jobrow"><div class="icon">${icons[x.id]||'💼'}</div><div><div class="jn">#${x.id} ${esc(x.name)}</div><div class="jc">${esc(x.category)} • ${x.active?'Aktif':'Nonaktif'}</div></div></div></div>`).join('')}
function fillEditor(j){$('editor').innerHTML=`<div style="font-weight:800;margin-bottom:12px">Editor Job #${j.id}</div><div class="field"><label>Nama</label><input id="fName" value="${esc(j.name)}"></div><div class="field"><label>Deskripsi</label><textarea id="fDesc">${esc(j.description)}</textarea></div><div class="field"><label>Kategori</label><input id="fCat" value="${esc(j.category)}"></div><div class="grid2"><div class="field"><label>Mini game</label><select id="fMini">${Object.keys(miniNames).map(k=>`<option value="${k}" ${j.mini==k?'selected':''}>${k} • ${miniNames[k]}</option>`).join('')}</select></div><div class="field"><label>Minimum level</label><input id="fLevel" type="number" min="1" value="${j.minlevel}"></div><div class="field"><label>Pay min</label><input id="fPayMin" type="number" value="${j.paymin}"></div><div class="field"><label>Pay max</label><input id="fPayMax" type="number" value="${j.paymax}"></div><div class="field"><label>Vehicle model (0 = jalan kaki)</label><input id="fVeh" type="number" value="${j.vehicle}"></div><div class="field"><label>Vehicle color</label><input id="fColor" type="number" min="0" max="255" value="1"></div><div class="field"><label>Max worker (0 = unlimited)</label><input id="fMax" type="number" min="0" value="${j.maxworkers||0}"></div><div class="field"><label>Aktif</label><select id="fActive"><option value="1" ${j.active?'selected':''}>Aktif</option><option value="0" ${!j.active?'selected':''}>Nonaktif</option></select></div></div><div class="actions"><button class="btn primary" onclick="saveJob()">Simpan</button><button class="btn" onclick="moveStart()">Set Start di Posisi Saya</button><button class="btn bad" onclick="deleteJob()">Hapus / Nonaktifkan</button></div><div class="hint">Start position dan step dapat disimpan langsung dari posisi admin di dalam game.</div>`;}
function saveJob(){const p={id:state.selected,name:$('fName').value,description:$('fDesc').value,category:$('fCat').value,mini:+$('fMini').value,minlevel:+$('fLevel').value,paymin:+$('fPayMin').value,paymax:+$('fPayMax').value,vehicle:+$('fVeh').value,color:+$('fColor').value,active:+$('fActive').value,maxworkers:+$('fMax').value};emit('jobs.admin.update',p)}
function newJob(){emit('jobs.admin.create',{name:'Job Baru',description:'Dynamic job baru',category:'Dynamic',mini:1,minlevel:1,paymin:100,paymax:500,vehicle:0,color:1,active:1,maxworkers:0})}
function deleteJob(){emit('jobs.admin.delete',{id:state.selected})}function moveStart(){emit('jobs.admin.move',{id:state.selected})}
function refreshAdmin(){state.jobs=[];emit('jobs.admin.refresh')}
function renderSteps(){const j=state.jobs.find(x=>x.id===state.selected);if(!j)return;$('stepsEditor').innerHTML=`<div style="font-weight:800">Steps • ${esc(j.name)}</div><div class="hint">Add step mengambil posisi pemain admin saat ini.</div><div class="actions"><button class="btn primary" onclick="addStep()">+ Add Step Here</button></div>${state.steps.map(s=>`<div class="step"><div><strong>#${s.index+1}</strong> ${esc(s.action)}<div class="hint">${s.x.toFixed(2)}, ${s.y.toFixed(2)}, ${s.z.toFixed(2)} • bonus $${s.paybonus}</div></div><button class="btn bad" onclick="delStep(${s.index})">×</button></div>`).join('')||'<div class="empty">Belum ada step.</div>'}`; $('assignEditor').innerHTML=`<div style="font-weight:800">Set Job Player</div><div class="field" style="margin-top:10px"><label>Player ID</label><input id="targetPlayer" type="number" min="0" value="0"></div><button class="btn good" onclick="assignPlayer()">Set #${j.id} ${esc(j.name)}</button><div class="hint">Assignment langsung disimpan ke accounts.job.</div>`}
function addStep(){emit('jobs.admin.step.add',{id:state.selected,action:'Step '+(state.steps.length+1),paybonus:0})}function delStep(i){emit('jobs.admin.step.delete',{id:state.selected,index:i})}function assignPlayer(){emit('jobs.admin.setplayer',{playerid:+$('targetPlayer').value,job:state.selected})}
window.newJob=newJob;window.refreshAdmin=refreshAdmin;window.saveJob=saveJob;window.deleteJob=deleteJob;window.moveStart=moveStart;window.addStep=addStep;window.delStep=delStep;window.assignPlayer=assignPlayer;
let raf=0;function openMini(d){state.mini=d;$('mini').classList.remove('hidden');$('miniTitle').textContent=d.title||miniNames[d.type]||'Mini Game';$('miniDesc').textContent=d.action||'';$('miniStep').textContent='Step '+(d.step||1)+' / '+(d.steps||1);startGame(+d.type,+d.duration||14,+d.scoreMin||40,d.token)}
function finishMini(ok,score){if(!state.mini)return;const t=state.mini.token;emit('jobs.minigame.result',{token:t,success:ok?1:0,score:Math.round(score)});$('mini').classList.add('hidden');cancelAnimationFrame(raf);state.mini=null}
function countdown(seconds,onEnd){let end=Date.now()+seconds*1000;function tick(){if(!state.mini)return;let left=Math.max(0,end-Date.now());$('miniTimer').textContent=(left/1000).toFixed(1)+'s';if(left<=0){finishMini(false,0);return}requestAnimationFrame(tick)}tick();}
function startGame(type,duration,scoreMin,token){countdown(duration);const g=$('game');let score=55;const click=fn=>fn;
 if([1,12,16,22].includes(type)){g.innerHTML=`<div class="gameInner"><div class="bigPrompt">Sejajkan timing ke zona hijau</div><div class="bar" style="margin-top:25px"><div class="zone"></div><div id="cursor" class="cursor"></div></div><div class="workRow"><button id="hit" class="workBtn">LOCK</button></div></div>`;let x=0,dir=1;const loop=()=>{if(!state.mini)return;x+=dir*0.9;if(x>=94||x<=0)dir*=-1;$('cursor').style.left=x+'%';raf=requestAnimationFrame(loop)};loop();$('hit').onclick=()=>{let xx=parseFloat($('cursor').style.left)||0;score=Math.max(40,100-Math.abs(xx-50)*1.8);finishMini(true,score)};return}
 if([2,14].includes(type)){g.innerHTML=`<div class="gameInner"><div class="bigPrompt" id="rx">SIAP...</div><div class="workRow"><button class="workBtn" id="react">TUNGGU</button></div></div>`;let delay=500+Math.random()*2200;setTimeout(()=>{if(!state.mini)return;$('rx').textContent='SEKARANG!';$('react').textContent='TEKAN';let st=Date.now();$('react').onclick=()=>{score=Math.max(40,100-Math.min(60,(Date.now()-st)/10));finishMini(true,score)}},delay);return}
 if([3,17,23].includes(type)){let labels=['A1','B4','C7','D2','E9','F3'];let target=labels[Math.floor(Math.random()*labels.length)];g.innerHTML=`<div class="gameInner"><div class="bigPrompt">${type===17?'Pilih bahan untuk daur ulang':'Scan paket'} <b>${target}</b></div><div class="tapgrid">${labels.slice(0,4).map(v=>`<button class="tap" data-v="${v}">${v}</button>`).join('')}</div></div>`;g.querySelectorAll('.tap').forEach(b=>b.onclick=()=>finishMini(b.dataset.v===target,b.dataset.v===target?92:35));return}
 if([4,19,20].includes(type)){let need=type===20?8:5;g.innerHTML=`<div class="gameInner"><div class="bigPrompt">Klik semua target (${need})</div><div id="tg" class="tapgrid"></div></div>`;let box=$('tg');for(let i=0;i<need;i++){let b=document.createElement('button');b.className='tap';b.textContent=['●','▲','■','◆'][i%4];box.appendChild(b);b.onclick=()=>{b.remove();score+=7;if(!box.children.length)finishMini(true,Math.min(100,score))}};return}
 if([5,18].includes(type)){
  const seq=Array.from({length:5},()=>Math.floor(Math.random()*4)); let pos=0;
  g.innerHTML=`<div class="gameInner"><div class="bigPrompt">${type===5?'Ingat urutan':'Ikuti resep'} <span id="seqTxt">•••••</span></div><div class="sequence">${[0,1,2,3].map(i=>`<button class="seq" data-v="${i}">${['A','B','C','D'][i]}</button>`).join('')}</div></div>`;
  setTimeout(()=>{if($('seqTxt'))$('seqTxt').textContent=seq.join(' '); setTimeout(()=>{if($('seqTxt'))$('seqTxt').textContent='? ? ? ? ?'},1400)},50);
  g.querySelectorAll('.seq').forEach(function(b){ b.onclick=function(){ const ok=(+b.dataset.v===seq[pos]); if(!ok){ finishMini(false,30); return; } pos++; if(pos>=seq.length) finishMini(true,96); }; }); return;
 }
 if([6,21].includes(type)){
  const order=['MERAH','BIRU','HIJAU','KUNING']; let pos=0;
  g.innerHTML=`<div class="gameInner"><div class="bigPrompt">${type===21?'Hubungkan kabel sesuai warna':'Rakit sambungan'}</div><div id="w" class="tapgrid"></div></div>`;
  const shuffled=order.slice().sort(()=>Math.random()-.5); shuffled.forEach(function(c){ const b=document.createElement('button'); b.className='tap'; b.textContent=c; b.onclick=function(){ if(c!==order[pos]){finishMini(false,30);return;} b.disabled=true; pos++; if(pos===order.length) finishMini(true,96); }; $('w').appendChild(b); });
  return;
 }
 if([7,10,11,24].includes(type)){let n=5,pos=0;g.innerHTML=`<div class="gameInner"><div class="bigPrompt">${miniNames[type]}</div><div class="sequence" id="parts"></div></div>`;let items=Array.from({length:n},(_,i)=>i+1).sort(()=>Math.random()-.5);items.forEach(v=>{let b=document.createElement('button');b.className='seq';b.textContent=v;b.onclick=()=>{if(v!==pos+1)return finishMini(false,30);pos++;b.disabled=true;if(pos===n)finishMini(true,95)}});$('parts').append(...Array.from(g.querySelectorAll('.seq')));return}
 if([8,9,15].includes(type)){let need=type===8?4:6,pos=0;g.innerHTML=`<div class="gameInner"><div class="bigPrompt">${type===8?'Pukul titik ore':'Ikuti ritme kerja'}</div><div class="workRow" id="rh"></div></div>`;for(let i=0;i<need;i++){let b=document.createElement('button');b.className='workBtn';b.textContent=type===8?'HIT':'CLICK '+(i+1);b.onclick=()=>{b.disabled=true;pos++;if(pos===need)finishMini(true,94)};$('rh').appendChild(b)};return}
 if([13].includes(type)){g.innerHTML=`<div class="gameInner"><div class="bigPrompt">Tarik ikan saat bar masuk hijau</div><div class="bar"><div class="zone"></div><div id="cursor" class="cursor"></div></div><div class="workRow"><button class="workBtn" id="fish">TARIK</button></div></div>`;let x=10,dir=1;const loop=()=>{if(!state.mini)return;x+=dir*1.2;if(x>=94||x<=0)dir*=-1;$('cursor').style.left=x+'%';raf=requestAnimationFrame(loop)};loop();$('fish').onclick=()=>{score=Math.max(40,100-Math.abs((parseFloat($('cursor').style.left)||0)-52)*1.5);finishMini(true,score)};return}
 g.innerHTML=`<div class="gameInner"><div class="bigPrompt">${miniNames[type]||'Pekerjaan'}</div><div class="workRow"><button class="workBtn" onclick="finishMini(true,88)">SELESAIKAN</button><button class="workBtn" onclick="finishMini(false,20)">BATAL</button></div></div>`;
}
$('search').addEventListener('input',renderList);$('closeBtn').onclick=()=>emit(state.admin?'jobs.admin.close':'jobs.close');
window.addEventListener('resize',()=>setTimeout(syncCefPanelBounds,0));
document.addEventListener('keydown',e=>{if(e.key==='Escape')emit(state.admin?'jobs.admin.close':'jobs.close')});
// Initial handshake; server decides whether this browser is player/admin and replies with jobs.mode.
emit('jobs.ready');syncCefPanelBounds();setTimeout(()=>{emit('jobs.ready');syncCefPanelBounds();},250);
})();
</script>
</body></html>
