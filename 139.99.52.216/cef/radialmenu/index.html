<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Eagle • Radial</title><link rel="stylesheet" href="../shared/eagle-ui.css"><link rel="stylesheet" href="../shared/eagle-theme.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="../shared/eagle-cef-bridge.js"></script><style>body{margin:0;height:100vh;background:transparent;overflow:hidden;pointer-events:none}.wrap{position:fixed;inset:0;display:grid;place-items:center;pointer-events:auto}.radial{width:min(70vw,420px);aspect-ratio:1;position:relative;filter:drop-shadow(0 20px 50px rgba(0,0,0,.35))}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(12,17,26,.9);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 0 0 8px rgba(255,255,255,.025)}.center i{font-size:clamp(18px,3vw,30px);color:#fff}.action{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:rgba(12,17,26,.78);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(16px);color:#fff;font-weight:700;font-size:clamp(9px,1.4vw,13px);}.action i{font-size:clamp(18px,3vw,28px)}.action:active{background:rgba(255,255,255,.16);transform:scale(.94)}.a1{left:37%;top:0}.a2{right:4%;top:18%}.a3{right:0;top:51%;}.a4{right:19%;bottom:2%}.a5{left:37%;bottom:0}.a6{left:18%;bottom:7%}.a7{left:0;top:51%}.a8{left:5%;top:18%}.hint{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap}</style></head><body data-feature="radialmenu"><div class="wrap"><div class="radial"><button class="action a1" onclick="act('vehicle_engine')"><i class="fa-solid fa-car"></i><span>Kendaraan</span></button><button class="action a2" onclick="act('inventory')"><i class="fa-solid fa-box-open"></i><span>Inventory</span></button><button class="action a3" onclick="act('documents')"><i class="fa-solid fa-id-card"></i><span>Dokumen</span></button><button class="action a4" onclick="act('phone')"><i class="fa-solid fa-phone"></i><span>Phone</span></button><button class="action a5" onclick="act('fashion')"><i class="fa-solid fa-shirt"></i><span>Fashion</span></button><button class="action a6" onclick="act('invoice')"><i class="fa-solid fa-file-invoice-dollar"></i><span>Invoice</span></button><button class="action a7" onclick="act('gps')"><i class="fa-solid fa-location-dot"></i><span>GPS</span></button><button class="action a8" onclick="act('close')"><i class="fa-solid fa-xmark"></i><span>Tutup</span></button><div class="center"><i class="fa-solid fa-compass"></i></div></div><div class="hint">Pilih tindakan</div></div><script>function send(e,d){return window.EagleCEF?EagleCEF.emit(e,d):nativeSendEvent(e,d)}function act(action){send('radial.action',{action:action})}window.Cef=window.Cef||{};window.Cef._trigger=function(ev,p){let d={};try{d=typeof p==='string'?JSON.parse(p||'{}'):p||{}}catch(e){};if(ev==='input_mode')document.body.classList.toggle('input-mode',!!d.enabled)};window.addEventListener('DOMContentLoaded',()=>setTimeout(()=>send('radial.ready',{feature:'radialmenu'}),30));</script></body></html>
