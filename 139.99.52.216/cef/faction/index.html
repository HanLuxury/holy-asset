<!doctype html>
<html lang="id">
<head><script>(function(){window.__eagleFeature=document.body&&document.body.dataset.feature||"common";window.nativeSendEvent=function(e,d){return parent.__eagleSend?parent.__eagleSend(e,d):false};window.EagleLegacyForward=function(e,d){return parent.__eagleSend?parent.__eagleSend(e,d):false};})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eagle — Faction</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,Arial;color:#f4f7fb}
body{pointer-events:none}
.panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(86vw,820px);height:min(76vh,620px);max-width:820px;max-height:620px;
 border:1px solid rgba(255,255,255,.14);border-radius:26px;
 background:rgba(11,15,22,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 box-shadow:0 22px 80px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
header{padding:20px 22px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.title{font-size:22px;font-weight:800;letter-spacing:.2px}.sub{font-size:12px;color:#9da8b8;margin-top:3px}
.close{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:20px}
.grid{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:auto}
.card{min-height:112px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(255,255,255,.045);padding:16px;display:flex;flex-direction:column;gap:8px}
.card:active{transform:scale(.985);background:rgba(255,255,255,.09)}
.card b{font-size:14px}.card span{font-size:11px;line-height:1.35;color:#99a5b5}
.icon{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:800}
.footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8792a3}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.panel{width:90vw;height:78vh;border-radius:22px}}

/* ============================================================
   Infinix GT 30 Pro fit — 1080x2436 (~20.3:9) AMOLED punch-hole.
   GTA SA renders LANDSCAPE, jadi surface CEF pendek & lebar.
   Lapisan universal: hormati safe-area, jamin UI muat di layar,
   target sentuh nyaman. Ditaruh paling akhir agar menang cascade.
   ============================================================ */
:root{
  --gt-safe-t:env(safe-area-inset-top,0px);
  --gt-safe-b:env(safe-area-inset-bottom,0px);
  --gt-safe-l:env(safe-area-inset-left,0px);
  --gt-safe-r:env(safe-area-inset-right,0px);
  --gt-vw:calc(100vw - var(--gt-safe-l) - var(--gt-safe-r));
  --gt-vh:calc(100vh - var(--gt-safe-t) - var(--gt-safe-b));
}
html,body{
  margin:0 !important; padding:0 !important;
  width:100% !important; height:100% !important;
  max-width:100vw !important; overflow:hidden !important;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
button,.btn,.app,.slot,.card,.close,.tab,.nav,.chip,a,input,select,textarea{ touch-action:manipulation; }

/* Padding aman utk punch-hole / sudut membulat; body tetap flex-center */
body{
  padding:var(--gt-safe-t) var(--gt-safe-r) var(--gt-safe-b) var(--gt-safe-l) !important;
}

/* Root panel: jangan pernah melebihi area aman; konten scroll di dalam */
.phone,.shell,.window,.panel,.container,.wrap>.panel,.frame,.modal-card{
  max-width:var(--gt-vw) !important;
  max-height:var(--gt-vh) !important;
}
.shell,.window,.panel,.container{ overflow:auto !important; -webkit-overflow-scrolling:touch; }

/* Phone mock: pakai tinggi layar maksimal namun proporsional & tetap terbaca */
.phone{
  width:min(400px,var(--gt-vw)) !important;
  height:min(96vh,820px) !important;
  max-height:var(--gt-vh) !important;
}

/* Layar sangat pendek (landscape HP tinggi): rapatkan sedikit */
@media (max-height:460px){
  .phone{ height:var(--gt-vh) !important; border-radius:22px !important; }
  .shell,.window,.panel{ height:var(--gt-vh) !important; }
}

</style>
<link rel="stylesheet" href="../shared/legacy.css"><link rel="stylesheet" href="../shared/fivem-ui.css"><script src="../shared/legacy-ui.js"></script></head>
<body>
<div class="panel" id="panel">
<header>
<div><div class="title" id="title">Eagle Faction</div><div class="sub" id="subtitle">Memuat fitur...</div></div>
<button class="close" onclick="closePanel()">×</button>
</header>
<div class="grid" id="grid"></div>
<div class="footer">Area luar panel tetap diteruskan ke GTA. Tekan × atau tombol back untuk menutup.</div>
</div>
<script>
const apps = [
 ['duty','Duty','Aktif/nonaktifkan status bertugas.'],
 ['locker','Locker','Akses locker sesuai fraksi.'],
 ['callsign','Callsign','Kelola callsign kendaraan polisi.'],
 ['tandu','EMS Stretcher','Gunakan sistem tandu medis.'],
 ['modif','Workshop','Buka sistem modifikasi kendaraan.'],
 ['ag','Gojek','Terima/kelola order Gojek.'],
 ['cg','Gojek Chat','Chat/order Gojek.'],
 ['eg','Gojek End','Selesaikan order Gojek.'],
 ['cgopay','Gopay','Pembayaran Gopay.'],
 ['bank','Bank','Buka bank Eagle.'],
 ['vehicle','Vehicles','Akses fitur kendaraan.'],
 ['toys','Toys','Kelola accessory/toys.'],
 ['weapons','Weapons','Kelola weapon system.'],
 ['family','Families','Akses fitur family.'],
 ['animations','Animations','Buka animasi pemain.']
];
function send(name,data){try{
 if(window.cef && typeof window.cef.emit==='function') window.cef.emit(name, data||{});
 else if(window.cef && typeof window.cef.onEvent==='function') window.cef.onEvent(name, data||{});
 else console.log(name,data);
}catch(e){}}
function build(){
 const g=document.getElementById('grid'); g.innerHTML='';
 apps.forEach(a=>{
   const d=document.createElement('div'); d.className='card';
   d.innerHTML='<div class="icon">'+a[1][0]+'</div><b>'+a[1]+'</b><span>'+a[2]+'</span>';
   d.onclick=()=>send('faction.action',{action:a[0]});
   g.appendChild(d);
 });
}
function openState(s){
 document.getElementById('title').textContent=s.faction || 'Eagle Faction';
 document.getElementById('subtitle').textContent=(s.name||'Player')+' • Rank '+(s.rank||0)+' • App '+(s.app||'civilian');
}
function closePanel(){send('faction.close',{});}
build();
</script>
</body>
</html>
