/* ============================================================
   Infinix GT 30 Pro fit — 1080x2436 (~20.3:9) AMOLED punch-hole.
   GTA SA renders LANDSCAPE, jadi surface CEF pendek & lebar.
   Lapisan universal: hormati safe-area, jamin UI muat di layar,
   target sentuh nyaman. Ditaruh paling akhir agar menang cascade.
   ============================================================ */
:root{
  --gt-safe-t:env(safe-area-inset-top,0px);
  --gt-safe-b:env(safe-area-inset-bottom,0px);
  --gt-safe-l:env(safe-area-inset-left,0px);
  --gt-safe-r:env(safe-area-inset-right,0px);
  --gt-vw:calc(100vw - var(--gt-safe-l) - var(--gt-safe-r));
  --gt-vh:calc(100vh - var(--gt-safe-t) - var(--gt-safe-b));
}
html,body{
  margin:0 !important; padding:0 !important;
  width:100% !important; height:100% !important;
  max-width:100vw !important; overflow:hidden !important;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
button,.btn,.app,.slot,.card,.close,.tab,.nav,.chip,a,input,select,textarea{ touch-action:manipulation; }

/* Padding aman utk punch-hole / sudut membulat; body tetap flex-center */
body{
  padding:var(--gt-safe-t) var(--gt-safe-r) var(--gt-safe-b) var(--gt-safe-l) !important;
}

/* Root panel: jangan pernah melebihi area aman; konten scroll di dalam */
.phone,.shell,.window,.panel,.container,.wrap>.panel,.frame,.modal-card{
  max-width:var(--gt-vw) !important;
  max-height:var(--gt-vh) !important;
}
.shell,.window,.panel,.container{ overflow:auto !important; -webkit-overflow-scrolling:touch; }

/* Phone mock: pakai tinggi layar maksimal namun proporsional & tetap terbaca */
.phone{
  width:min(400px,var(--gt-vw)) !important;
  height:min(96vh,820px) !important;
  max-height:var(--gt-vh) !important;
}

/* Layar sangat pendek (landscape HP tinggi): rapatkan sedikit */
@media (max-height:460px){
  .phone{ height:var(--gt-vh) !important; border-radius:22px !important; }
  .shell,.window,.panel{ height:var(--gt-vh) !important; }
}

<script>
const S={name:'Player',number:'',cash:0,bank:0,bankAccount:0,phoneOff:0,airplane:0,tab:0,callState:0,callPartner:-1,callName:'',callNumber:'',twitter:'',twitterLogged:0,contacts:0,ringtone:'',contactsList:[],tweets:[],ads:[],vehicles:[],transportOnline:0,locations:[],airdrop:[],waTarget:-1,waTargetName:'',waTargetNumber:'',messages:[],twitterPage:0,yellowPage:0,playing:false,airdropPermission:0,bankHistory:[]};
const pages=['homePage','callPage','contactsPage','whatsappPage','twitterPage','yellowPage','bankPage','vehiclesPage','transportPage','spotifyPage','gpsPage','airdropPage','gamesPage','settingsPage','payPage'];
const titles=['Phone','Telepon','Kontak','WhatsApp','Twitter','Yellow Pages','mBanking','Kendaraan','Transport','Spotify','GPS','Airdrop','Games','Pengaturan','Pay'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function emit(event,data={}){const raw=JSON.stringify(data);try{if(window.nativeSendEvent){window.nativeSendEvent(event,raw);return true}if(window.Android&&typeof Android.sendEvent==='function'){Android.sendEvent(event,raw);return true}if(window.Cef&&typeof window.Cef.sendEvent==='function'){window.Cef.sendEvent(event,raw);return true}if(window.CEF&&typeof window.CEF.sendEvent==='function'){window.CEF.sendEvent(event,raw);return true}if(window.cef&&typeof window.cef.sendEvent==='function'){window.cef.sendEvent(event,raw);return true}}catch(e){console.log('[PHONE][CEF] emit error',e)}return false}

function syncCefPanelBounds(){
 const panel=document.getElementById('phone')||document.querySelector('.phone');
 if(!panel)return;
 const r=panel.getBoundingClientRect();
 const vw=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);
 const vh=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
 emit('cef.panel.bounds',{left:r.left/vw,top:r.top/vh,right:r.right/vw,bottom:r.bottom/vh});
}
function bridgeTrigger(event,payload){let data=payload;try{if(typeof payload==='string')data=JSON.parse(payload)}catch(e){};
 if(event==='phone.state')Object.assign(S,data||{}),renderCommon();
 else if(event==='phone.home'){}
 else if(event==='phone.contacts'){S.contactsList=(data&&data.items)||[];renderContacts()}
 else if(event==='phone.twitter'){Object.assign(S,{tweets:(data&&data.tweets)||[],twitterPage:(data&&data.page)||0,twitter:(data&&data.username)||'',twitterLogged:(data&&data.logged)||0});renderTwitter()}
 else if(event==='phone.yellow'){Object.assign(S,{ads:(data&&data.ads)||[],yellowPage:(data&&data.page)||0});renderYellow()}
 else if(event==='phone.vehicles'){S.vehicles=(data&&data.vehicles)||[];renderVehicles()}
 else if(event==='phone.bank.history'){S.bankHistory=(data&&data.items)||[];if(S.tab===6)renderBank()}
 else if(event==='phone.transport'){S.transportOnline=Number((data&&data.online)||0);renderTransport()}
 else if(event==='phone.gps'){S.locations=(data&&data.locations)||[];renderGPS()}
 else if(event==='phone.airdrop'){Object.assign(S,{airdropPermission:(data&&data.permission)||0,airdrop:(data&&data.nearby)||[]});renderAirdrop()}
 else if(event==='phone.settings'){Object.assign(S,data||{});renderSettings();renderCommon()}
 else if(event==='phone.whatsapp.chat'){S.waTarget=(data&&data.target)||-1;S.waTargetName=(data&&data.targetName)||'';S.waTargetNumber=(data&&data.targetNumber)||'';S.messages=(data&&data.messages)||[];renderWhatsappChat()}
 else if(event==='phone.call.ended'){closeCall()}
 else if(event==='phone.service.911'){openService911((data&&data.choices)||[])}
 else if(event==='phone.service.prompt'){openServicePrompt(data||{})}
 else if(event==='phone.airdrop.request'){openAirdropRequest(data||{})}
 else if(event==='phone.spotify'){S.playing=!!(data&&data.playing);renderSpotify()}
 else if(event==='phone.gps.set'){toast(data&&data.name?('GPS: '+data.name):'GPS aktif')}
 else if(event==='phone.sms.sent'||event==='phone.sms.received'||event==='phone.whatsapp.message'||event==='phone.whatsapp.sent'){toast('Pesan terkirim');}
 else if(event==='phone.notify'){toast('Notifikasi server diterima')}
 else if(event==='phone.airdrop.result'){toast(data&&data.accepted?'Kontak diterima':'Permintaan ditolak');refreshAll()}
 else if(event==='phone.service.accepted'){toast('Layanan menerima permintaan')}
 else if(event==='phone.service.sent'){toast('Permintaan layanan terkirim')}
 else if(event==='phone.twitter' && data)renderTwitter();
}
(function installTrigger(){window.Cef=window.Cef||{};const nativeTrigger=window.Cef._trigger;window.Cef._trigger=function(event,payload){bridgeTrigger(event,payload);if(typeof nativeTrigger==='function'){try{return nativeTrigger.call(window.Cef,event,payload)}catch(e){}}}})();
function renderCommon(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});document.getElementById('airIcon').style.opacity=S.airplane?'1':'.35';document.getElementById('backBtn').style.visibility=S.tab===0?'hidden':'visible'}
function setPage(tab){S.tab=tab;pages.forEach((id,i)=>document.getElementById(id).classList.toggle('active',i===tab));document.getElementById('title').textContent=titles[tab]||'Phone';document.getElementById('sub').textContent=tab===0?'San Fierro Mobile':(tab===1?'Nomor '+S.number:(tab===4?(S.twitterLogged?'@'+S.twitter:'Twitter'):'PlayerSmartphoneNew'));const iconMap=['phone','phone','contacts','whatsapp','twitter','yellow','bank','vehicles','transport','spotify','gps','airdrop','games','settings','phone'];document.getElementById('titleIcon').src='assets/icons/'+(iconMap[tab]||'phone')+'.png';document.querySelectorAll('.navBtn').forEach(x=>x.classList.toggle('active',+x.dataset.tab===tab));renderCommon()}
function openTab(tab){setPage(tab);emit('phone.tab',{tab});switch(tab){case 0:renderHome();break;case 1:renderDial();break;case 2:renderContacts();break;case 3:renderWhatsapp();break;case 4:renderTwitter();break;case 5:renderYellow();break;case 6:renderBank();break;case 7:renderVehicles();break;case 8:renderTransport();break;case 9:renderSpotify();break;case 10:renderGPS();break;case 11:renderAirdrop();break;case 12:renderGames();break;case 13:renderSettings();break;case 14:renderPay();break}}
function goHome(){openTab(0)}
function refreshAll(){emit('phone.refresh',{});renderHome()}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2300)}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalWrap').classList.add('show')}
function closeModal(){document.getElementById('modalWrap').classList.remove('show');document.getElementById('modal').innerHTML=''}
function money(v){return '$'+Number(v||0).toLocaleString('en-US')}
function initials(v){return esc(String(v||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}
function renderHome(){const e=document.getElementById('homePage');const apps=[['phone','Phone',1],['contacts','Contacts',2],['whatsapp','WhatsApp',3],['twitter','Twitter',4],['yellow','Yellow Pages',5],['bank','mBanking',6],['vehicles','Vehicles',7],['transport','Transport',8],['spotify','Spotify',9],['gps','Maps / GPS',10],['airdrop','AirDrop',11],['games','Games',12],['settings','Settings',13],['phone','Pay',14]];e.innerHTML=`<div class="wallpaperHero"><div class="hello">San Fierro • ${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</div><div class="heroName">${esc(S.name)}</div><div class="balance"><div class="chip"><div class="label">Cash</div><div class="money">${money(S.cash)}</div></div><div class="chip"><div class="label">Bank</div><div class="money">${money(S.bank)}</div></div></div><div class="row" style="margin-top:13px"><span class="pill">${esc(S.number||'No Number')}</span><span class="pill">Akun ${esc(S.bankAccount||'—')}</span></div></div><div class="appSectionHead"><h3>Aplikasi</h3><span>${apps.length} apps</span></div><div class="launcherGrid">${apps.map(a=>`<button class="appLauncher" onclick="openTab(${a[2]})"><img class="appIcon" src="assets/icons/${a[0]}.png" alt="${a[1]}"><span class="label">${a[1]}</span></button>`).join('')}</div>`}
let dial='';function renderDial(){document.getElementById('callPage').innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/phone.png"><div><div class="appTopTitle">Phone</div><div class="appTopSub">Keypad • Services • Calls</div></div></div><div class="realToolbar"><input class="realSearch" value="${esc(dial||'')}" placeholder="Enter phone number" readonly><button class="realIconBtn" onclick="dial=dial.slice(0,-1);renderDial()">⌫</button></div><div class="card" style="background:rgba(255,255,255,.025)"><div class="dialGrid">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].map(k=>`<button class="dialKey" onclick="dialKey('${k[0]}')">${k[0]}<span class="dialSub">${k[1]}</span></button>`).join('')}</div><div class="dialControls"><button class="round green" onclick="dialCall()">☎</button></div></div><div class="appSectionHead"><h3>Services</h3><span>Emergency & RP</span></div><div class="iosList">${[['110','Polisi'],['118','EMS'],['117','Pemerintah'],['555','Taxi'],['777','Mekanik'],['911','Darurat']].map(x=>`<button class="iosRow" style="width:100%;background:none;color:#fff;border:0" onclick="service(${x[0]})"><div class="iosAvatar"><img src="assets/icons/phone.png" style="width:23px;height:23px"></div><div class="iosMain"><div class="iosName">${x[1]}</div><div class="iosMeta">${x[0]}</div></div><div class="iosAction">›</div></button>`).join('')}</div>`}
function dialKey(k){if(dial.length<15)dial+=k;document.getElementById('dialNum').textContent=dial}function dialCall(){const n=parseInt(dial);if(!n)return toast('Masukkan nomor');emit('phone.call',{number:n})}function service(n){emit('phone.call',{number:n})}
function renderContacts(){const e=document.getElementById('contactsPage');let list=S.contactsList||[];e.innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/contacts.png"><div><div class="appTopTitle">Contacts</div><div class="appTopSub">${list.length}/100 contacts</div></div><button class="realIconBtn" onclick="contactAdd()">＋</button></div><div class="realToolbar"><input class="realSearch" placeholder="Search contacts" oninput="filterContacts(this.value)"></div><div id="contactList" class="iosList">${contactCards(list).replaceAll('<div class="card">','<div class="iosRow">').replaceAll('</div></div>','</div>')}</div>`}
function contactCards(list){if(!list.length)return'<div class="empty">Belum ada kontak.</div>';return list.map(c=>`<div class="iosRow"><div class="iosAvatar">${initials(c.name)}</div><div class="iosMain"><div class="iosName">${esc(c.name)} ${c.online?'<span class="online"></span>':''}</div><div class="iosMeta">${esc(c.number)}${c.unread?` · <b style="color:#ff7d88">${c.unread} baru</b>`:''}</div></div><button class="realIconBtn" onclick="emit('phone.contacts.call',{index:${c.index}})">☎</button><button class="realIconBtn" onclick="emit('phone.contacts.whatsapp',{index:${c.index}})"><img src="assets/icons/whatsapp.png" style="width:20px;height:20px"></button><button class="realIconBtn" onclick="contactMore(${c.index})">•••</button></div>`).join('')}
function filterContacts(q){q=q.toLowerCase();const l=S.contactsList.filter(c=>String(c.name).toLowerCase().includes(q)||String(c.number).includes(q));document.getElementById('contactList').innerHTML=contactCards(l)}
function contactAdd(){modal(`<h3>Tambah Kontak</h3><input class="input" id="cName" placeholder="Nama kontak"><div style="height:7px"></div><input class="input" id="cNumber" inputmode="numeric" placeholder="Nomor telepon"><div class="modalBtns"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="emit('phone.contacts.add',{name:document.getElementById('cName').value,number:document.getElementById('cNumber').value});closeModal()">Simpan</button></div>`)}
function contactMore(i){const c=S.contactsList.find(x=>x.index===i);if(!c)return;modal(`<h3>${esc(c.name)}</h3><div class="card"><div class="muted tiny">Nomor</div><div class="title">${esc(c.number)}</div></div><div class="modalBtns"><button class="btn" onclick="emit('phone.contacts.block',{index:${i}});closeModal()">${c.blocked?'Buka Blokir':'Blokir'}</button><button class="btn" onclick="emit('phone.contacts.shareloc',{index:${i}});closeModal()">Bagikan Lokasi</button></div><div class="modalBtns"><button class="btn" onclick="contactEdit(${i});">Edit</button><button class="btn red" onclick="emit('phone.contacts.delete',{index:${i}});closeModal()">Hapus</button></div>`) }
function contactEdit(i){const c=S.contactsList.find(x=>x.index===i);if(!c)return;modal(`<h3>Edit Kontak</h3><input class="input" id="cName" value="${esc(c.name)}"><div style="height:7px"></div><input class="input" id="cNumber" value="${esc(c.number)}"><div class="modalBtns"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="emit('phone.contacts.edit',{index:${i},name:document.getElementById('cName').value,number:document.getElementById('cNumber').value});closeModal()">Simpan</button></div>`)}
function renderWhatsapp(){const list=(S.contactsList||[]);document.getElementById('whatsappPage').innerHTML=`<div class="whatsappShell"><div class="waTop"><div class="waBrand"><img src="assets/icons/whatsapp.png"><div><div class="appTopTitle">WhatsApp</div><div class="appTopSub">Chats • Calls • Contacts</div></div></div><button class="realIconBtn" onclick="contactAdd()">＋</button></div><div class="realToolbar"><input class="realSearch" placeholder="Search" oninput="filterContacts(this.value)"></div><div class="iosList" style="background:rgba(255,255,255,.025)">${list.length?list.map(c=>`<button class="waChatRow" style="width:100%;background:none;color:#fff;border:0;text-align:left" onclick="emit('phone.contacts.whatsapp',{index:${c.index}})"><div class="iosAvatar">${initials(c.name)}</div><div class="iosMain"><div class="iosName">${esc(c.name)}</div><div class="iosMeta">${c.online?'online':'last seen recently'}</div></div>${c.unread?`<span class="waUnread">${c.unread}</span>`:''}</button>`).join(''):'<div class="empty">No chats yet.</div>'}</div></div>`}
function renderWhatsappChat(){setPage(3);const e=document.getElementById('whatsappPage');e.innerHTML=`<div class="waChatRoom"><div class="waRoomHeader"><button class="back" onclick="renderWhatsapp()">‹</button><img src="assets/icons/whatsapp.png"><div style="flex:1"><div class="title">${esc(S.waTargetName)}</div><div class="muted tiny">${esc(S.waTargetNumber)} • online</div></div><button class="realIconBtn" onclick="emit('phone.call',{number:${Number(S.waTargetNumber)||0}})">☎</button></div><div class="waMessages" id="chatBox">${S.messages.length?S.messages.slice().reverse().map(m=>`<div class="bubble ${m.me?'me waBubble':'them waBubble'}"><div>${esc(m.text)}</div><div class="bubbleTime">${esc(m.time)}</div></div>`).join(''):'<div class="empty">Belum ada pesan.</div>'}</div><div class="waComposer"><input class="input" id="waText" maxlength="128" placeholder="Message"><button class="btn green" onclick="sendWA()">➤</button></div></div>`;setTimeout(()=>{const x=document.getElementById('chatBox');if(x)x.scrollTop=x.scrollHeight},50)}
function sendWA(){const x=document.getElementById('waText');if(!x.value.trim())return;emit('phone.whatsapp.send',{target:S.waTarget,text:x.value.slice(0,128)});x.value=''}
function renderTwitter(){const e=document.getElementById('twitterPage');e.innerHTML=`<div class="twitterShell"><div class="xTop"><img class="xLogo" src="assets/icons/twitter.png"></div>${!S.twitterLogged?`<div class="card" style="background:#080808;border-color:#252525"><div class="title">Welcome to X</div><div class="muted small" style="margin-top:4px">Login to post and manage your RP social account.</div><div style="display:flex;gap:7px;margin-top:12px"><button class="btn primary wide" onclick="twitterAuth(0)">Log in</button><button class="btn wide" onclick="twitterAuth(1)">Create account</button></div></div>`:`<div class="xPost"><div class="xPostHead"><div class="xAvatar">${initials(S.name)}</div><div class="xPostBody"><div><span class="xName">${esc(S.name)}</span><span class="xHandle">@${esc(S.twitter)}</span></div><textarea class="xTweetInput" id="tweetText" maxlength="128" placeholder="What is happening?!"></textarea><div class="row"><span class="muted tiny">${String(document.getElementById('tweetText')?.value?.length||0)}/128</span><button class="btn primary" onclick="postTweet()">Post</button></div></div></div></div>`}${tweetCards()}<div class="xPager"><button class="btn" onclick="tweetPage(-1)">‹</button><span class="pill">Page ${Number(S.twitterPage)+1}</span><button class="btn" onclick="tweetPage(1)">›</button></div><button class="btn ghost wide" onclick="emit('phone.twitter.logout',{})">Log out</button></div>`}
function tweetCards(){return (S.tweets||[]).length?(S.tweets||[]).map(t=>`<div class="xPost"><div class="xPostHead"><div class="xAvatar">${initials(t.from)}</div><div class="xPostBody"><div><span class="xName">${esc(t.from)}</span><span class="xHandle">@${esc(t.from)}</span><span class="tweetDate">${esc(t.date)}</span></div><div class="xText">${esc(t.text)}</div><div class="xActions"><span class="xAction">♡</span><span class="xAction">◌</span><span class="xAction">↗</span><span class="xAction">⋯</span></div></div></div></div>`).join(''):'<div class="empty" style="background:#080808">No posts yet.</div>'}
function twitterAuth(sign){modal(`<h3>${sign?'Daftar Twitter':'Login Twitter'}</h3><input class="input" id="twUser" maxlength="24" placeholder="Username 7-24 karakter"><div style="height:7px"></div><input class="input" id="twPass" maxlength="64" type="password" placeholder="Password"><div class="modalBtns"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="${sign?'twitterSignup()':'twitterLogin()'}">${sign?'Daftar':'Login'}</button></div>`)}
function twitterSignup(){emit('phone.twitter.signup',{username:document.getElementById('twUser').value,password:document.getElementById('twPass').value});closeModal()}function twitterLogin(){emit('phone.twitter.login',{username:document.getElementById('twUser').value,password:document.getElementById('twPass').value});closeModal()}function postTweet(){const t=document.getElementById('tweetText');if(t.value.trim()){emit('phone.twitter.post',{text:t.value.slice(0,128)});t.value=''}}function tweetPage(d){emit('phone.twitter.page',{page:Math.max(0,Number(S.twitterPage)+d)})}
function renderYellow(){const e=document.getElementById('yellowPage');e.innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/yellow.png"><div><div class="appTopTitle">Yellow Pages</div><div class="appTopSub">Marketplace & local listings</div></div><button class="realIconBtn" onclick="yellowPost()">＋</button></div><div class="realToolbar"><input class="realSearch" placeholder="Search ads"></div>${(S.ads||[]).length?(S.ads||[]).map(a=>`<div class="iosList" style="margin-bottom:9px"><div class="iosRow"><div class="iosAvatar">AD</div><div class="iosMain"><div class="iosName">${esc(a.from)}</div><div class="iosMeta">${esc(a.phone)} · ${esc(a.date)}</div></div><span class="adPrice">$300</span></div><div style="padding:12px;font-size:12px;line-height:1.45">${esc(a.text)}</div><button class="btn wide" style="margin:0 12px 12px;width:calc(100% - 24px)" onclick="emit('phone.yellow.call',{number:'${esc(a.phone)}'})">☎ Contact</button></div>`).join(''):'<div class="empty">No listings yet.</div>'}<div class="pager"><button class="btn" onclick="yellowPage(-1)">‹</button><span class="pill">Page ${Number(S.yellowPage)+1}</span><button class="btn" onclick="yellowPage(1)">›</button></div>`}
function yellowPost(){modal(`<h3>Pasang Iklan</h3><textarea class="input" id="yellowText" maxlength="128" placeholder="Tulis iklan 1-128 karakter"></textarea><div class="modalBtns"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="emit('phone.yellow.post',{text:document.getElementById('yellowText').value});closeModal()">Pasang $300</button></div>`)}function yellowPage(d){emit('phone.yellow.page',{page:Math.max(0,Number(S.yellowPage)+d)})}
function renderBank(){const history=S.bankHistory||[];document.getElementById('bankPage').innerHTML=`<div class="bankShell"><div class="bankCard"><div class="bankBrand"><img src="assets/icons/bank.png"><div><div class="title">San Fierro Bank</div><div class="muted tiny">Secure mobile banking</div></div></div><div class="bankBalance">${money(S.bank)}</div><div class="bankNumber">Account ${esc(S.bankAccount)}</div><div class="bankQuick"><button onclick="document.getElementById('bankAcc').focus()"><img src="assets/icons/bank.png">Transfer</button><button onclick="openTab(14)"><img src="assets/icons/phone.png">Pay</button><button onclick="emit('phone.bank.history',{})"><img src="assets/icons/settings.png">History</button></div></div><div class="appSectionHead"><h3>Transfer</h3><span>Rekening Eagle</span></div><div class="iosList"><div style="padding:13px"><input class="input" id="bankAcc" inputmode="numeric" placeholder="Recipient account"><div style="height:7px"></div><input class="input" id="bankAmount" inputmode="numeric" placeholder="Amount"><button class="btn primary wide" style="margin-top:9px" onclick="bankTransfer()">Send money</button></div></div><div class="appSectionHead"><h3>Riwayat</h3><span>${history.length} transaksi</span></div><div class="iosList">${history.length?history.map(t=>`<div class="iosRow"><div class="iosAvatar"><img src="assets/icons/bank.png" style="width:22px;height:22px"></div><div class="iosMain"><div class="iosName">${esc(t.type==='receive'?'Uang masuk':t.type==='cash_pay'?'Pembayaran tunai':'Transfer')}</div><div class="iosMeta">${esc(t.time||'')} · Rek ${esc(t.account||'—')}</div></div><div class="iosAction" style="color:${t.type==='receive'?'#35d48a':'#ff7a86'}">${t.type==='receive'?'+':'-'}${money(t.amount)}</div></div>`).join(''):'<div class="empty">Belum ada transaksi.</div>'}</div></div>`}function renderPay(){document.getElementById('payPage').innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/phone.png"><div><div class="appTopTitle">Pay</div><div class="appTopSub">Cash payment • nearby players</div></div></div><div class="card"><div class="label">CASH</div><div class="big">${money(S.cash)}</div><div class="muted tiny" style="margin-top:5px">Server validates distance and balance.</div></div><div class="appSectionHead"><h3>Bayar pemain</h3><span>maks. 5 meter</span></div><div class="card"><input class="input" id="payTarget" type="number" placeholder="Player ID"><div style="height:7px"></div><input class="input" id="payAmount" type="number" min="1" placeholder="Amount"><button class="btn primary wide" style="margin-top:9px" onclick="payPlayer()">Bayar</button></div></div>`}function payPlayer(){const target=parseInt(document.getElementById('payTarget').value),amount=parseInt(document.getElementById('payAmount').value);if(!Number.isInteger(target)||!Number.isInteger(amount)||amount<=0)return toast('Data pembayaran belum lengkap');emit('phone.pay',{target,amount})}
function bankTransfer(){const a=parseInt(document.getElementById('bankAcc').value),n=parseInt(document.getElementById('bankAmount').value);if(!a||!n)return toast('Data transfer belum lengkap');emit('phone.bank.transfer',{account:a,amount:n})}
function renderVehicles(){document.getElementById('vehiclesPage').innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/vehicles.png"><div><div class="appTopTitle">My Vehicles</div><div class="appTopSub">Garage • engine • lock • GPS</div></div><button class="realIconBtn" onclick="emit('phone.refresh',{})">⟳</button></div>${(S.vehicles||[]).length?(S.vehicles||[]).map(v=>`<div class="carCard"><div class="carImg"><img src="assets/icons/vehicles.png"></div><div style="flex:1"><div class="title">${esc(v.name)}</div><div class="muted tiny">${esc(v.plate)} · Model ${v.model}</div><div class="fuelBar"><i style="width:${Math.max(0,Math.min(100,Number(v.fuel)||0))}%"></i></div><div class="realToolbar" style="margin-top:8px"><button class="btn ${Number(v.locked)?'red':'ghost'}" onclick="emit('phone.vehicle.lock',{vehicleid:${v.vehicleid}})">${Number(v.locked)?'Unlock':'Lock'}</button><button class="btn primary" onclick="emit('phone.vehicle.engine',{vehicleid:${v.vehicleid}})">Engine</button><button class="btn" onclick="emit('phone.vehicle.gps',{vehicleid:${v.vehicleid}})">GPS</button></div></div><div class="pill">${Number(v.fuel)||0}%</div></div>`).join(''):'<div class="empty">No personal vehicles.</div>'}`}function renderTransport(){document.getElementById('transportPage').innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/transport.png"><div><div class="appTopTitle">Transport</div><div class="appTopSub">Taxi / ride service</div></div></div><div class="card" style="background:linear-gradient(145deg,rgba(255,198,95,.08),rgba(255,255,255,.025))"><div class="row"><div><div class="label">Drivers online</div><div class="big">${Number(S.transportOnline)}</div></div><div class="tag">AVAILABLE</div></div><div class="muted small" style="margin-top:13px">Request a ride and the server will assign an on-duty driver.</div><button class="btn primary wide" style="margin-top:13px" onclick="emit('phone.transport.order',{})">Request a ride</button></div><div class="appSectionHead"><h3>Trip</h3><span>Live server dispatch</span></div><div class="iosList"><div class="iosRow"><div class="iosAvatar"><img src="assets/icons/gps.png" style="width:24px;height:24px"></div><div class="iosMain"><div class="iosName">Pickup</div><div class="iosMeta">Current player location</div></div></div><div class="iosRow"><div class="iosAvatar"><img src="assets/icons/gps.png" style="width:24px;height:24px"></div><div class="iosMain"><div class="iosName">Destination</div><div class="iosMeta">Choose through GPS</div></div></div></div>`}
function renderSpotify(){document.getElementById('spotifyPage').innerHTML=`<div style="margin:-2px -15px -30px;padding:0 15px 35px;min-height:100%;background:linear-gradient(160deg,#061b15,#06110e 48%,#050b09)"><div class="appTop"><img class="appTopIcon" src="assets/icons/spotify.png"><div><div class="appTopTitle">Spotify</div><div class="appTopSub">Music player</div></div></div><div style="padding:18px 8px 10px;text-align:center"><div style="width:190px;height:190px;margin:auto;border-radius:22px;background:linear-gradient(145deg,#173d31,#0b1712);display:flex;align-items:center;justify-content:center;box-shadow:0 22px 50px rgba(0,0,0,.35)"><img src="assets/icons/spotify.png" style="width:82px;height:82px"></div><div class="heroName" style="margin-top:17px">San Fierro Radio</div><div class="muted tiny">${S.playing?'Playing now':'Ready to play'}</div></div><input class="input" id="streamUrl" placeholder="Direct MP3 / stream URL"><div class="realToolbar" style="justify-content:center"><button class="btn green" onclick="playMusic()">▶ Play</button><button class="btn red" onclick="emit('phone.spotify.stop',{})">■ Stop</button></div><div class="fuelBar" style="height:4px"><i style="width:${S.playing?55:0}%"></i></div></div>`}function playMusic(){const u=document.getElementById('streamUrl').value.trim();if(u)emit('phone.spotify.play',{url:u})}
function renderGPS(){document.getElementById('gpsPage').innerHTML=`<div class="gpsShell"><div class="appTop"><img class="appTopIcon" src="assets/icons/gps.png"><div><div class="appTopTitle">Maps</div><div class="appTopSub">GPS navigation</div></div><button class="realIconBtn" onclick="emit('phone.gps.set',{index:-1})">×</button></div><div class="mapMock"><div class="mapPin"></div></div><div class="appSectionHead"><h3>Saved places</h3><span>${(S.locations||[]).length} locations</span></div>${(S.locations||[]).map(l=>`<button class="iosRow" style="width:100%;background:rgba(255,255,255,.03);color:#fff;border:1px solid var(--line);border-radius:16px;margin:7px 0;text-align:left" onclick="emit('phone.gps.set',{index:${l.index}})"><div class="iosAvatar"><img src="assets/icons/gps.png" style="width:22px;height:22px"></div><div class="iosMain"><div class="iosName">${esc(l.name)}</div><div class="iosMeta">${Number(l.x).toFixed(0)}, ${Number(l.y).toFixed(0)}</div></div><span class="iosAction">›</span></button>`).join('')||'<div class="empty">No saved locations.</div>'}</div>`}
function renderAirdrop(){document.getElementById('airdropPage').innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/airdrop.png"><div><div class="appTopTitle">AirDrop</div><div class="appTopSub">Share contacts with nearby players</div></div></div><div class="card"><div class="row"><div><div class="title">Discoverable</div><div class="muted tiny">Allow nearby players to send a contact card.</div></div><button class="switch ${S.airdropPermission?'on':''}" onclick="emit('phone.airdrop.permission',{})"></button></div></div><div class="appSectionHead"><h3>Nearby</h3><span>${(S.airdrop||[]).length} people</span></div>${(S.airdrop||[]).length?(S.airdrop||[]).map(p=>`<div class="iosRow" style="background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;margin:7px 0"><div class="iosAvatar">${initials(p.name)}</div><div class="iosMain"><div class="iosName">${esc(p.name)}</div><div class="iosMeta">${esc(p.number)}</div></div><button class="btn primary" onclick="emit('phone.airdrop.send',{target:${p.playerid}})">Share</button></div>`).join(''):'<div class="empty">No nearby contacts.</div>'}`}
function renderGames(){document.getElementById('gamesPage').innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/games.png"><div><div class="appTopTitle">Games</div><div class="appTopSub">Mini games on your phone</div></div></div><div class="card"><div class="title">Tic Tac Toe</div><div class="muted tiny" style="margin-top:3px">Quick offline match.</div></div><div class="xo" id="xo"></div><div class="xoStatus" id="xoStatus">Giliran X</div><div style="display:flex;justify-content:center;margin-top:12px"><button class="btn" onclick="xoReset()">New game</button></div>`;xoReset()}
let xb=[];function xoReset(){xb=['','','','','','','','',''];drawXO();document.getElementById('xoStatus').textContent='Giliran X'}function drawXO(){const w=document.getElementById('xo');if(!w)return;w.innerHTML=xb.map((v,i)=>`<button onclick="xoMove(${i})">${v||''}</button>`).join('')}function xoMove(i){if(xb[i]||winner(xb))return;xb[i]='X';if(!winner(xb)&&xb.some(x=>!x)){const empty=xb.map((v,n)=>v?null:n).filter(x=>x!==null);xb[empty[Math.floor(Math.random()*empty.length)]]='O'}drawXO();const w=winner(xb);document.getElementById('xoStatus').textContent=w?(w==='draw'?'Seri':w+' menang!'):(xb.some(x=>!x)?'Giliran X':'Seri')}function winner(a){for(const r of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(a[r[0]]&&a[r[0]]===a[r[1]]&&a[r[1]]===a[r[2]])return a[r[0]];return a.every(Boolean)?'draw':null}
function renderSettings(){document.getElementById('settingsPage').innerHTML=`<div class="appTop"><img class="appTopIcon" src="assets/icons/settings.png"><div><div class="appTopTitle">Settings</div><div class="appTopSub">Phone & connectivity</div></div></div><div class="settingsGroup"><div class="settingsRow"><div class="settingsGlyph"><img src="assets/icons/airdrop.png" style="width:17px;height:17px"></div><div class="settingsMain"><div class="settingsTitle">Airplane Mode</div><div class="settingsSub">Turn calls/SMS/services off.</div></div><button class="switch ${S.airplane?'on':''}" onclick="setAir(!S.airplane)"></button></div><div class="settingsRow"><div class="settingsGlyph"><img src="assets/icons/phone.png" style="width:17px;height:17px"></div><div class="settingsMain"><div class="settingsTitle">Phone</div><div class="settingsSub">Device status.</div></div><button class="switch ${S.phoneOff?'on':''}" onclick="emit('phone.settings.phone',{off:${S.phoneOff?0:1}})"></button></div></div><div class="settingsGroup"><div class="settingsRow"><div class="settingsGlyph"><img src="assets/icons/phone.png" style="width:17px;height:17px"></div><div class="settingsMain"><div class="settingsTitle">Ringtone</div><div class="settingsSub">URL used for incoming calls.</div></div></div><div style="padding:12px"><input class="input" id="ringtone" value="${esc(S.ringtone)}" placeholder="https://.../ring.mp3"><button class="btn primary wide" style="margin-top:8px" onclick="emit('phone.settings.ringtone',{url:document.getElementById('ringtone').value})">Save ringtone</button></div></div><div class="settingsGroup"><div class="settingsRow"><div class="settingsGlyph"><img src="assets/icons/contacts.png" style="width:17px;height:17px"></div><div class="settingsMain"><div class="settingsTitle">Phone number</div><div class="settingsSub">${esc(S.number)}</div></div><span class="pill">Active</span></div><div class="settingsRow"><div class="settingsGlyph"><img src="assets/icons/bank.png" style="width:17px;height:17px"></div><div class="settingsMain"><div class="settingsTitle">Bank account</div><div class="settingsSub">${esc(S.bankAccount)}</div></div></div></div>`}
function setAir(v){emit('phone.settings.airplane',{enabled:v?1:0})}
function handleCall(d){const state=d.state||'dialing';S.callState=state==='talking'?3:(state==='incoming'?2:1);S.callPartner=d.partner??-1;S.callName=d.partnerName||'';S.callNumber=d.partnerNumber||d.number||'';const dur=Number(d.duration||0);const mm=Math.floor(dur/60).toString().padStart(2,'0');const ss=(dur%60).toString().padStart(2,'0');document.getElementById('callOverlay').classList.add('show');document.getElementById('callName').textContent=S.callName||'Unknown';document.getElementById('callNum').textContent=S.callNumber||'';document.getElementById('callState').textContent=state==='talking'?('Tersambung • '+mm+':'+ss):(d.reason||(state==='incoming'?'Panggilan masuk':'Memanggil...'));document.getElementById('pickupBtn').style.display=state==='incoming'?'block':'none'}
function pickup(){emit('phone.call.pickup',{})}function hangup(){emit('phone.call.hangup',{})}function closeCall(){document.getElementById('callOverlay').classList.remove('show');S.callState=0}function toggleSpeaker(){}
function openService911(choices){modal(`<h3>Darurat 911</h3><div class="muted small" style="margin-bottom:8px">Pilih layanan yang kamu perlukan.</div>${choices.map(c=>`<button class="btn wide" style="margin:4px 0" onclick="servicePrompt(${c.type},'${esc(c.name)}')">${esc(c.name)}</button>`).join('')}`)}
function servicePrompt(type,title){closeModal();openServicePrompt({type,title})}
function openServicePrompt(d){modal(`<h3>${esc(d.title||'Layanan')}</h3><textarea class="input" id="serviceText" maxlength="128" placeholder="Jelaskan keadaan/lokasi kamu..."></textarea><div class="modalBtns"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="emit('phone.service.send',{type:${Number(d.type||0)},text:document.getElementById('serviceText').value});closeModal()">Kirim</button></div>`)}
function openAirdropRequest(d){modal(`<h3>Kontak Airdrop</h3><div class="card"><div class="title">${esc(d.name)}</div><div class="muted tiny">${esc(d.number)}</div><div class="small" style="margin-top:8px">Izinkan kontak ini disimpan?</div></div><div class="modalBtns"><button class="btn red" onclick="emit('phone.airdrop.respond',{accept:0});closeModal()">Tolak</button><button class="btn green" onclick="emit('phone.airdrop.respond',{accept:1});closeModal()">Terima</button></div>`)}
window.addEventListener('resize',()=>{setTimeout(syncCefPanelBounds,0);});
function boot(){
 document.getElementById('phone').classList.add('ready');
 renderCommon();
 renderHome();
 // Tell Pawn that this browser instance finished loading, then request the
 // first bootstrap. Retry the handshake because the native bridge can become
 // available a little later than the document itself.
 let sent=false;
 const sendReady=()=>{if(sent)return;sent=emit('phone.ready',{}); syncCefPanelBounds();if(sent)emit('phone.refresh',{});};
 sendReady();
 setTimeout(sendReady,150);
 setTimeout(sendReady,500);
 setTimeout(sendReady,1000);
}
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})},1000);boot();
</script>
