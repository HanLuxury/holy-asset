<!doctype html><html><head><link rel="stylesheet" href="../shared/eagle-theme.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script>(function(){window.__eagleFeature=document.body&&document.body.dataset.feature||"common";window.nativeSendEvent=function(e,d){return parent.__eagleSend?parent.__eagleSend(e,d):false};window.EagleLegacyForward=function(e,d){return parent.__eagleSend?parent.__eagleSend(e,d):false};})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ladang CEF</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../shared/legacy.css"><link rel="stylesheet" href="../shared/fivem-ui.css"><script src="../shared/legacy-ui.js"></script></head><body><div class="panel"><div class="head"><div><div class="accent" style="font-size:12px">EAGLE DYNAMIC CEF</div><h1 style="margin:5px 0 4px">Ladang</h1><div class="muted feature">Farm / field</div></div><span class="pill">ID <b id="id">-</b></span></div><div class="row" style="margin-bottom:14px"><span class="pill" id="type">Ladang</span><span class="pill" id="coords">Waiting for server...</span></div><div class="grid"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Model / Skin / Object</label><input id="model" type="number"></div><div class="field"><label>Price / Fee</label><input id="price" type="number"></div><div class="field"><label>Value 1</label><input id="v1" type="number"></div><div class="field"><label>Value 2</label><input id="v2" type="number"></div><div class="field"><label>Value 3</label><input id="v3" type="number"></div><div class="field"><label>Locked (0/1)</label><input id="locked" type="number" min="0" max="1"></div><div class="field"><label>Enabled (0/1)</label><input id="enabled" type="number" min="0" max="1"></div></div><div class="section"><div class="sectionTitle">T
