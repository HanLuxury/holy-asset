<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Eagle • HUD</title><link rel="stylesheet" href="../shared/eagle-ui.css"><link rel="stylesheet" href="../shared/eagle-theme.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="../shared/eagle-cef-bridge.js"></script><style>body{margin:0;height:100vh;background:transparent;overflow:hidden;pointer-events:none}.hud{position:fixed;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:flex-end;gap:10px}.pill,.money{padding:8px 11px;border-radius:10px;background:rgba(10,14,22,.62);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);font-size:12px}.money{font-weight:800}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.status{width:min(410px,60vw);display:grid;gap:7px}.bar{display:grid;grid-template-columns:22px 1fr 38px;gap:8px;align-items:center}.icon{height:22px;width:22px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:11px}.track{height:7px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}.fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#62d7ff,#71ffb3)}.value{text-align:right;font-size:10px;opacity:.72}.info{text-align:right;font-size:12px}.job{font-weight:700}.sub{opacity:.62;font-size:10px;margin-top:3px}@media(max-width:680px){.hud{padding:12px}.status{width:min(320px,88vw)}.bottom{align-items:flex-end}.info{display:none}}</style></head><body data-feature="hud"><div class="hud"><div class="top"><div class="pill"><i class="fa-solid fa-user"></i> ID <span id="id">0</span></div><div class="pill"><i class="fa-solid fa-clock"></i> <span id="time">00:00</span></div><div class="money"><i class="fa-solid fa-wallet"></i> $<span id="money">0</span></div></div><div class="bottom"><div class="status"><div class="bar"><span class="icon"><i class="fa-solid fa-heart"></i></span><div class="track"><div class="fill" id="health"></div></div><span class="value" id="healthV">100</span></div><div class="bar"><span class="icon"><i class="fa-solid fa-shield"></i></span><div class="track"><div class="fill" id="armor"></div></div><span class="value" id="armorV">0</span></div><div class="bar"><span class="icon"><i class="fa-solid fa-drumstick-bite"></i></span><div class="track"><div class="fill" id="hunger"></div></div><span class="value" id="hungerV">0</span></div><div class="bar"><span class="icon"><i class="fa-solid fa-droplet"></i></span><div class="track"><div class="fill" id="thirst"></div></div><span class="value" id="thirstV">0</span></div><div class="bar"><span class="icon"><i class="fa-solid fa-brain"></i></span><div class="track"><div class="fill" id="stress"></div></div><span class="value" id="stressV">0</span></div></div><div class="info"><div class="job" id="job">Warga</div><div id="faction">Civilian</div><div class="sub">Eagle Roleplay</div></div></div></div><script>function send(e,d){return window.EagleCEF?EagleCEF.emit(e,d):nativeSendEvent(e,d)}function pct(v){return Math.max(0,Math.min(100,Number(v)||0))}function setBar(id,val){document.getElementById(id).style.width=pct(val)+'%';document.getElementById(id+'V').textContent=Math.round(Number(val)||0)}function apply(d){if(d.health!=null)setBar('health',d.health);if(d.armor!=null)setBar('armor',d.armor);if(d.hunger!=null)setBar('hunger',d.hunger);if(d.thirst!=null)setBar('thirst',d.thirst);if(d.stress!=null)setBar('stress',d.stress);if(d.money!=null)document.getElementById('money').textContent=Number(d.money).toLocaleString('id-ID');if(d.id!=null)document.getElementById('id').textContent=d.id;if(d.job!=null)document.getElementById('job').textContent=d.job;if(d.faction!=null)document.getElementById('faction').textContent=d.faction;if(d.time)document.getElementById('time').textContent=d.time}window.Cef=window.Cef||{};window.Cef._trigger=function(ev,p){let d={};try{d=typeof p==='string'?JSON.parse(p||'{}'):p||{}}catch(e){};if(ev==='hud.state')apply(d);if(ev==='feature.ui'&&d.op==='text'){} };window.addEventListener('DOMContentLoaded',()=>setTimeout(()=>send('hud.ready',{feature:'hud'}),30));</script></body></html>
