<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CEF3D YouTube</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#player {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
#fallback {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
}
</style>
</head>
<body>
<iframe id="player"
        title="CEF3D YouTube Player"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="fallback">CEF3D YouTube video is not available.</div>

<script>
(function () {
    "use strict";

    const q = new URLSearchParams(location.search);
    const video = (q.get("video") || "").trim();

    const autoplay = q.get("autoplay") === "1" ? 1 : 0;
    const controls = q.get("controls") === "0" ? 0 : 1;
    const loop = q.get("loop") === "1" ? 1 : 0;
    const mute = q.get("mute") === "0" ? 0 : 1;
    const playsinline = q.get("playsinline") === "0" ? 0 : 1;
    const start = Math.max(0, parseInt(q.get("start") || "0", 10) || 0);
    const end = Math.max(0, parseInt(q.get("end") || "0", 10) || 0);

    // Accept only normal YouTube video IDs here. The server validates the same
    // character set before creating the URL.
    if (!/^[A-Za-z0-9_-]{6,32}$/.test(video)) {
        document.getElementById("fallback").style.display = "grid";
        return;
    }

    const params = new URLSearchParams();
    params.set("autoplay", String(autoplay));
    params.set("controls", String(controls));
    params.set("playsinline", String(playsinline));
    params.set("mute", String(mute));
    params.set("rel", "0");
    params.set("enablejsapi", "1");
    params.set("iv_load_policy", "3");

    if (loop) {
        params.set("loop", "1");
        params.set("playlist", video);
    }
    if (start > 0) {
        params.set("start", String(start));
    }
    if (end > 0 && end > start) {
        params.set("end", String(end));
    }

    const iframe = document.getElementById("player");
    iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(video) + "?" + params.toString();
})();
</script>
</body>
</html>
