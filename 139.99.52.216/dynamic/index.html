<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Dynamic Center</title><link rel="stylesheet" href="style.css"></head><body><div class="panel"><div class="head"><div><div class="accent" style="font-size:12px">EAGLE DYNAMIC CEF</div><h1 style="margin:5px 0">Dynamic World Center</h1><div class="muted">Pilih fitur dynamic. Admin dapat masuk ke editor dan membuat definition baru dari posisi saat ini.</div></div><button class="btn" onclick="send('close')">Close</button></div><div class="grid"><button class="btn" onclick="send('open_type', 'actor')">Actor</button><button class="btn" onclick="send('open_type', 'atm')">ATM</button><button class="btn" onclick="send('open_type', 'basement')">Basement</button><button class="btn" onclick="send('open_type', 'business')">Business</button><button class="btn" onclick="send('open_type', 'button')">Button</button><button class="btn" onclick="send('open_type', 'door')">Door</button><button class="btn" onclick="send('open_type', 'factiongarage')">Faction Garage</button><button class="btn" onclick="send('open_type', 'publicgarage')">Public Garage</button><button class="btn" onclick="send('open_type', 'privategarage')">Private Garage</button><button class="btn" onclick="send('open_type', 'garbage')">Garbage</button><button class="btn" onclick="send('open_type', 'gate')">Gate</button><button class="btn" onclick="send('open_type', 'gudang')">Gudang</button><button class="btn" onclick="send('open_type', 'house')">House</button><button class="btn" onclick="send('open_type', 'hunting')">Hunting</button><button class="btn" onclick="send('open_type', 'iconmap')">Map Icon</button><button class="btn" onclick="send('open_type', 'label')">Label</button><button class="btn" onclick="send('open_type', 'ladang')">Ladang</button><button class="btn" onclick="send('open_type', 'machine')">Slot Machine</button><button class="btn" onclick="send('open_type', 'object')">Object</button><button class="btn" onclick="send('open_type', 'objecttext')">Object Text</button><button class="btn" onclick="send('open_type', 'pasar')">Pasar</button><button class="btn" onclick="send('open_type', 'rental')">Rental</button><button class="btn" onclick="send('open_type', 'robbery')">Robbery</button><button class="btn" onclick="send('open_type', 'rusun')">Rusun</button><button class="btn" onclick="send('open_type', 'speedcam')">Speed Camera</button><button class="btn" onclick="send('open_type', 'uranium')">Uranium</button><button class="btn" onclick="send('open_type', 'warung')">Warung</button><button class="btn" onclick="send('open_type', 'workshop')">Workshop</button><button class="btn" onclick="send('open_type', 'gym')">Gym</button><button class="btn" onclick="send('open_type', 'sports_shop')">Sports Shop</button></div></div><script src="app.js"></script><script>
function syncCefPanelBounds(){const panel=document.querySelector('.panel');if(!panel)return;const r=panel.getBoundingClientRect();const vw=Math.max(1,innerWidth||1),vh=Math.max(1,innerHeight||1);send('cef.panel.bounds',JSON.stringify({left:r.left/vw,top:r.top/vh,right:r.right/vw,bottom:r.bottom/vh}));}
window.addEventListener('resize',()=>setTimeout(syncCefPanelBounds,0));setTimeout(syncCefPanelBounds,0);
</script></body></html>
