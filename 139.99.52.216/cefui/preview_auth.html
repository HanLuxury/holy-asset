<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EAGLE / Arrival — Pratinjau</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/auth_fivem.css">
  <link rel="stylesheet" href="css/lobby.css">
  <style>
    body{background:#273027}
    .erp-preview-scene{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 58% 26%,#59624a80,transparent 48%),linear-gradient(166deg,#242d24 0 46%,#171e16 46.2% 66%,#263021 66.3%);opacity:.8}
    .erp-preview-scene::after{content:"PREVIEW KARAKTER 3D TERLIHAT SAAT DI DALAM GAME";position:absolute;left:41%;right:31%;bottom:20%;text-align:center;line-height:1.8;font:8px Arial,sans-serif;letter-spacing:.12em;color:#78856b}
    .erp-preview-tools{position:fixed;bottom:7px;right:3.6vw;z-index:1000000;display:flex;align-items:center;gap:8px;font:9px Arial,sans-serif;color:#b8c3ab;letter-spacing:.08em;pointer-events:auto}
    .erp-preview-tools select{font:inherit;border:1px solid #56614d;color:#dfbd83;background:#15200f;padding:3px}
    @media(orientation:portrait){.erp-preview-tools{bottom:10px;right:22px}.erp-preview-tools span{display:none}.erp-preview-scene::after{display:none}}
    body.erp-preview-clean .erp-preview-tools{display:none}
  </style>
  <script>window.__eagleBoot={build:"v118-arrival",q:"",fail:[],t0:Date.now()};window.__eagleJs=["bridge","ui","auth"];</script>
  <script src="js/auth_preview.js"></script>
</head>
<body>
  <div class="erp-preview-scene" aria-hidden="true"></div>
  <div id="app">
    <div id="hudlayer" class="layer"></div><div id="bannerlayer" class="layer"></div><div id="overlaylayer" class="layer"></div>
    <div id="screenlayer" class="layer"></div><div id="viewlayer" class="layer"></div><div id="panels" class="layer"></div>
    <div id="toastlayer" class="layer"></div><div id="phonelayer" class="layer"></div><div id="fadelayer" class="layer"></div>
  </div>
  <div class="erp-preview-tools"><span>PRATINJAU / DATA CONTOH</span><select aria-label="Halaman pratinjau">
    <option value="login">Login</option><option value="register">Register</option><option value="chars">Multi Character</option>
    <option value="create">Buat Karakter</option><option value="lobby">Lobby</option><option value="spawn">Spawn Select</option>
  </select></div>
  <script src="js/bridge.js"></script><script src="js/ui.js"></script><script src="js/auth.js"></script>
</body>
</html>
