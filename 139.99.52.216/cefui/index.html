<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EAGLE ROLEPLAY - CEF Mobile UI</title>
  <script>
  /* EAGLE UI build v48 - pemuat file anti-cache
     GitHub Pages mengirim semua file dengan "Cache-Control: max-age=600", sehingga WebView
     Android bisa memakai salinan lama (atau 404 saat upload belum selesai) selama 10 menit.
     Server menambahkan token unik ?t=... di URL halaman setiap koneksi; token itu ikut
     dipasang di setiap file CSS/JS, jadi file selalu diambil baru dari hosting.
     File yang gagal dimuat dicatat; bridge.js memuat ulang halaman (maks. 2x) dan
     melaporkannya ke server_log.txt (baris [CEF]). */
  (function () {
    var BUILD = "v48";
    var s = location.search || "";
    function qp(k) { var m = new RegExp("[?&]" + k + "=([0-9A-Za-z_.-]{1,40})").exec(s); return m ? m[1] : ""; }
    var t = qp("t"), r = qp("r");
    var q = "?v=" + BUILD + (t ? "&t=" + t : "") + (r ? "&r=" + r : "");
    var B = window.__eagleBoot = { build: BUILD, q: q, fail: [], capture: true, t0: Date.now() };
    window.addEventListener("error", function (e) {
      var el = e && e.target;
      if (!el || el === window || !el.tagName) return;
      var tag = String(el.tagName).toUpperCase();
      if (tag !== "SCRIPT" && tag !== "LINK") return;
      var u = String(el.src || el.href || "");
      if (u.indexOf("fonts.g") >= 0) return;            // font Google opsional
      B.fail.push(u.replace(/[?#].*$/, "").replace(/^.*\/(css|js)\//, "$1/"));
    }, true);
    window.__eagleJs = ["bridge", "ui", "hud", "auth", "inv", "quickbar", "hud_settings", "widgets",
      "phone_core", "phone_apps_comm", "phone_apps_online", "phone_apps_social", "phone_apps_world", "phone_apps_tools", "views"];
    var css = ["app", "views", "eagle_hud_v10", "hud", "hud_editor", "phone"];
    for (var i = 0; i < css.length; i++) document.write('<link rel="stylesheet" href="css/' + css[i] + '.css' + q + '">');
  })();
  </script>
  <!-- Font: Barlow/Barlow Condensed (HUD), Poppins (panel), Inter (HP gaya iOS). Dimuat tanpa menahan
       halaman; bila lambat/offline otomatis memakai Roboto bawaan Android. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Grand+Hotel&display=swap">
</head>
<body>
  <div id="app">
    <div id="hudlayer" class="layer"></div>
    <div id="bannerlayer" class="layer"></div>
    <div id="overlaylayer" class="layer"></div>
    <div id="screenlayer" class="layer"></div>
    <div id="viewlayer" class="layer"></div>
    <div id="panels" class="layer"></div>
    <div id="toastlayer" class="layer"></div>
    <div id="phonelayer" class="layer"></div>
    <div id="fadelayer" class="layer"></div>
  </div>
  <script>
  (function () {
    var q = (window.__eagleBoot && window.__eagleBoot.q) || "?v=v48", j = window.__eagleJs || [];
    for (var i = 0; i < j.length; i++) document.write('<script src="js/' + j[i] + '.js' + q + '"><\/script>');
  })();
  </script>
</body>
</html>
