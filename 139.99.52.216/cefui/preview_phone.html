<html lang="id">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Grand+Hotel&display=swap" rel="stylesheet">

    html, body { background: linear-gradient(180deg, #5a7fa6 0%, #a4bdd3 40%, #c9a57c 55%, #5d5a54 56%, #3a3835 100%) !important; }
    #pv { position: fixed; left: 8px; top: 8px; z-index: 50; display: flex; flex-wrap: wrap; gap: 4px; max-width: 46vw; }
    #pv button { font: 12px monospace; padding: 5px 8px; border-radius: 6px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; }

<body>
  <div id="app">
    <div id="hudlayer" class="layer"></div><div id="bannerlayer" class="layer"></div><div id="overlaylayer" class="layer"></div>
    <div id="screenlayer" class="layer"></div><div id="viewlayer" class="layer"></div><div id="panels" class="layer"></div>
    <div id="toastlayer" class="layer"></div><div id="phonelayer" class="layer"></div><div id="fadelayer" class="layer"></div>

  <div id="pv">

    <button onclick="PhoneMock.T({t:'hide'})">Tutup HP</button>
