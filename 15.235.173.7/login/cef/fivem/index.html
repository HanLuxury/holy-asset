<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PARADISE MULTIPLAYER - LOGIN</title>
    <style>
        /* Menggunakan font modern */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            /* Background transparan agar game tetap terlihat */
            background-color: transparent; 
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: flex-end; /* Posisi di kanan layar ala FiveM */
            align-items: center;
            overflow: hidden;
        }

        /* Container Glassmorphism */
        .login-container {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 4px solid #ff3b3b;
            width: 350px;
            padding: 40px 30px;
            margin-right: 10%; /* Jarak dari kanan layar */
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: white;
            text-align: left;
        }

        /* Class krusial agar bisa disentuh di Android */
        .interactive {
            pointer-events: auto;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .logo-text span { color: #ff3b3b; }

        .sub-text {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #ddd;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 15px;
            border-radius: 4px;
            color: white;
            font-family: 'Poppins', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ff3b3b;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ff3b3b;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { background: #e03131; }
        .btn-register { background: transparent; border: 1px solid #ff3b3b; margin-top: 10px; }
        .btn-register:hover { background: rgba(255, 59, 59, 0.1); }

        .error-msg {
            color: #ff5252;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="login-container interactive" id="authPanel">
        <div class="logo-text">PARADISE<span>ROLEPLAY</span></div>
        <div class="sub-text" id="statusText">Welcome back to Los Santos</div>

        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="passInput" class="interactive" placeholder="••••••••">
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button id="btnLogin" class="btn interactive">CONNECT</button>
        <button id="btnRegister" class="btn btn-register interactive">CREATE ACCOUNT</button>
    </div>

    <script>
        let isRegistering = false;

        // 1. Sinkronisasi Hitbox (Touch Area) untuk Android
        function updateTouchAreas() {
            if (window.CefBridge) {
                let rects = [];
                document.querySelectorAll('.interactive').forEach(el => {
                    if(el.offsetParent !== null) { // Jika elemen terlihat
                        let rect = el.getBoundingClientRect();
                        rects.push([rect.left, rect.top, rect.width, rect.height]);
                    }
                });
                CefBridge.updateInteractiveAreas(JSON.stringify(rects));
            }
        }

        // 2. Beri tahu Kotlin bahwa web sudah siap
        window.onload = () => {
            if (window.CefBridge) CefBridge.cefReady();
            updateTouchAreas();
        };
        window.addEventListener('resize', updateTouchAreas);

        // 3. Toggle Mode (Login / Register)
        document.getElementById('btnRegister').addEventListener('click', () => {
            isRegistering = !isRegistering;
            document.getElementById('btnLogin').innerText = isRegistering ? "REGISTER" : "CONNECT";
            document.getElementById('btnRegister').innerText = isRegistering ? "BACK TO LOGIN" : "CREATE ACCOUNT";
            document.getElementById('statusText').innerText = isRegistering ? "Create a new identity" : "Welcome back to Los Santos";
            document.getElementById('errorMsg').innerText = "";
        });

        // 4. Kirim Data ke Server SA-MP
        document.getElementById('btnLogin').addEventListener('click', () => {
            let password = document.getElementById('passInput').value;
            
            if (password.length < 4) {
                document.getElementById('errorMsg').innerText = "Password terlalu pendek!";
                return;
            }

            let eventName = isRegistering ? "auth:register" : "auth:login";
            let payload = JSON.stringify({ password: password });

            // Kirim ke CefManager.kt -> netgame.cpp -> main.pwn
            if (window.CefBridge) {
                CefBridge.sendClientEvent(eventName, payload);
                document.getElementById('btnLogin').innerText = "LOADING...";
            }
        });

        // 5. Tangkap Respon dari Server (Cef_EmitEvent)
        window.onCefEvent = function(event, json) {
            try {
                let data = JSON.parse(json);
                if (event === "auth:error") {
                    document.getElementById('errorMsg').innerText = data.msg;
                    document.getElementById('btnLogin').innerText = isRegistering ? "REGISTER" : "CONNECT";
                }
                else if (event === "auth:success") {
                    document.getElementById('authPanel').style.display = "none";
                    updateTouchAreas(); // Reset touch area agar layar full screen bisa disentuh
                }
            } catch(e) {
                if(window.CefBridge) CefBridge.error("JSON Error: " + e);
            }
        };
    </script>
</body>
</html>
