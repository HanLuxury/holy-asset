<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paradise Roleplay - FiveM Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            /* Gradasi gelap khas server FiveM dari kanan ke kiri */
            background: linear-gradient(to left, rgba(10, 10, 15, 0.95) 0%, rgba(10, 10, 15, 0.6) 40%, transparent 100%);
        }

        /* Container utama di kanan layar */
        .auth-wrapper {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header Logo */
        .header {
            text-align: right;
            border-right: 4px solid #ff3b3b;
            padding-right: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: #ff3b3b;
        }

        .header p {
            margin: 5px 0 0 0;
            color: #aaaaaa;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Box Form Glassmorphism Minimalis */
        .form-box {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 15px;
            border-radius: 4px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff3b3b;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.2);
        }

        /* Tombol ala UI FiveM */
        .btn-action {
            width: 100%;
            padding: 15px;
            background: #ff3b3b;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover {
            background: #e03131;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(224, 49, 49, 0.4);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.3s;
        }

        .switch-link:hover {
            color: #fff;
        }

        .switch-link span {
            color: #ff3b3b;
            font-weight: 700;
        }

        .error-message {
            color: #ff5252;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            min-height: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error-message.show {
            opacity: 1;
        }

        /* Loader Animasi */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .btn-text {
            transition: opacity 0.2s;
        }

        .loading .btn-text {
            opacity: 0;
        }

        .loading .loader {
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper" id="authPanel">
        
        <div class="header">
            <h1>PARADISE<span>RP</span></h1>
            <p id="statusText">AUTHENTICATION REQUIRED</p>
        </div>

        <div class="form-box">
            <div class="input-group">
                <label>Security Key / Password</label>
                <input type="password" id="passInput" placeholder="Enter your credentials...">
            </div>

            <div class="error-message" id="errorMsg">Invalid credentials.</div>

            <button id="btnAction" class="btn-action">
                <span class="btn-text" id="btnLabel">CONNECT TO SERVER</span>
                <div class="loader"></div>
            </button>

            <div class="switch-link" id="btnToggle">
                New to the city? <span>Create Identity</span>
            </div>
        </div>

    </div>

    <script>
        let isRegistering = false;
        let isLoading = false;

        // Panggil Android Kotlin Bridge dengan aman
        function sendToAndroid(event, payload) {
            if (window.CefBridge) {
                if (typeof window.CefBridge.sendClientEvent === 'function') {
                    window.CefBridge.sendClientEvent(event, payload);
                } else if (typeof window.CefBridge.onClientEvent === 'function') {
                    window.CefBridge.onClientEvent(event, payload);
                }
            }
        }

        // Event: Ganti Mode Login / Register
        document.getElementById('btnToggle').addEventListener('click', () => {
            if(isLoading) return;
            
            isRegistering = !isRegistering;
            document.getElementById('btnLabel').innerText = isRegistering ? "REGISTER IDENTITY" : "CONNECT TO SERVER";
            document.getElementById('btnToggle').innerHTML = isRegistering ? "Already have an identity? <span>Connect</span>" : "New to the city? <span>Create Identity</span>";
            document.getElementById('statusText').innerText = isRegistering ? "CITIZEN REGISTRATION" : "AUTHENTICATION REQUIRED";
            document.getElementById('errorMsg').classList.remove('show');
        });

        // Event: Tombol Utama Ditekan
        document.getElementById('btnAction').addEventListener('click', () => {
            if(isLoading) return;

            let password = document.getElementById('passInput').value;
            let errorEl = document.getElementById('errorMsg');
            
            if (password.length < 3) {
                errorEl.innerText = "Password must be at least 3 characters.";
                errorEl.classList.add('show');
                return;
            }

            errorEl.classList.remove('show');
            isLoading = true;
            document.getElementById('btnAction').classList.add('loading');

            let eventName = isRegistering ? "auth:register" : "auth:login";
            let payload = JSON.stringify({ password: password });

            // Kirim event JS ke CefManager.kt -> C++ -> Server PAWN
            sendToAndroid(eventName, payload);
        });

        // Event: Menerima Balasan dari Server (Cef_EmitEvent)
        window.onCefEvent = function(event, json) {
            try {
                let data = JSON.parse(json);
                
                if (event === "auth:error") {
                    // Jika gagal, matikan loading dan tampilkan error
                    isLoading = false;
                    document.getElementById('btnAction').classList.remove('loading');
                    
                    let errorEl = document.getElementById('errorMsg');
                    errorEl.innerText = data.msg;
                    errorEl.classList.add('show');
                }
                else if (event === "auth:success") {
                    // JANGAN MENYEMBUNYIKAN PANEL DISINI (style.display = none).
                    // Biarkan panel tetap terlihat dengan efek loading sampai 
                    // Server SA-MP mengeksekusi Cef_Hide() yang akan menghancurkan WebView.
                    document.getElementById('btnLabel').innerText = "ENTERING CITY...";
                }
            } catch(e) {
                console.error("JSON Error:", e);
            }
        };

        // Kirim sinyal bahwa HTML sudah dirender sempurna
        window.onload = () => {
            if (window.CefBridge && typeof window.CefBridge.cefReady === 'function') {
                window.CefBridge.cefReady();
            }
        };
    </script>
</body>
</html>
