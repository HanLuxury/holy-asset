<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paradise Roleplay - FiveM Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to left, rgba(10, 10, 15, 0.95) 0%, rgba(10, 10, 15, 0.6) 40%, transparent 100%);
        }

        /* Container utama di kanan layar */
        .auth-wrapper {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Class krusial agar area ini bisa disentuh di Android */
        .interactive {
            pointer-events: auto;
        }

        .header {
            text-align: right;
            border-right: 4px solid #ff3b3b;
            padding-right: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 span { color: #ff3b3b; }

        .header p {
            margin: 5px 0 0 0;
            color: #aaaaaa;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .form-box {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 15px;
            border-radius: 4px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff3b3b;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.2);
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            background: #ff3b3b;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-action:hover {
            background: #e03131;
            transform: translateY(-2px);
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            font-weight: 500;
            cursor: pointer;
        }

        .switch-link span { color: #ff3b3b; font-weight: 700; }

        .error-message {
            color: #ff5252;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            min-height: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error-message.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="auth-wrapper interactive" id="authPanel">
        <div class="header">
            <h1>PARADISE<span>RP</span></h1>
            <p id="statusText">AUTHENTICATION REQUIRED</p>
        </div>

        <div class="form-box">
            <div class="input-group">
                <label>Security Key / Password</label>
                <input type="password" id="passInput" class="interactive" placeholder="Enter your credentials...">
            </div>

            <div class="error-message" id="errorMsg">Invalid credentials.</div>

            <button id="btnAction" class="btn-action interactive">CONNECT TO SERVER</button>

            <div class="switch-link interactive" id="btnToggle">
                New to the city? <span>Create Identity</span>
            </div>
        </div>
    </div>

    <script>
        let isRegistering = false;

        // 1. Fungsi Kalkulasi Area Sentuh untuk Android CefFrameLayout
        function updateTouchAreas() {
            if (window.CefBridge && typeof window.CefBridge.updateInteractiveAreas === 'function') {
                let rects = [];
                document.querySelectorAll('.interactive').forEach(el => {
                    // Hanya masukkan elemen yang sedang tidak di-hide
                    if(el.offsetParent !== null && window.getComputedStyle(el).display !== 'none') {
                        let rect = el.getBoundingClientRect();
                        rects.push([rect.left, rect.top, rect.width, rect.height]);
                    }
                });
                CefBridge.updateInteractiveAreas(JSON.stringify(rects));
            }
        }

        // Panggil saat window siap atau berubah ukuran
        window.onload = () => {
            if (window.CefBridge && typeof window.CefBridge.cefReady === 'function') {
                window.CefBridge.cefReady();
            }
            updateTouchAreas();
        };
        window.addEventListener('resize', updateTouchAreas);

        // 2. Ganti Mode Login / Register
        document.getElementById('btnToggle').addEventListener('click', () => {
            isRegistering = !isRegistering;
            document.getElementById('btnAction').innerText = isRegistering ? "REGISTER IDENTITY" : "CONNECT TO SERVER";
            document.getElementById('btnToggle').innerHTML = isRegistering ? "Already have an identity? <span>Connect</span>" : "New to the city? <span>Create Identity</span>";
            document.getElementById('statusText').innerText = isRegistering ? "CITIZEN REGISTRATION" : "AUTHENTICATION REQUIRED";
            document.getElementById('errorMsg').classList.remove('show');
            updateTouchAreas();
        });

        // 3. Tombol Submit (Login/Register)
        document.getElementById('btnAction').addEventListener('click', () => {
            let password = document.getElementById('passInput').value;
            let errorEl = document.getElementById('errorMsg');
            
            if (password.length < 3) {
                errorEl.innerText = "Password must be at least 3 characters.";
                errorEl.classList.add('show');
                return;
            }

            errorEl.classList.remove('show');
            document.getElementById('btnAction').innerText = "LOADING...";

            let eventName = isRegistering ? "auth:register" : "auth:login";
            let payload = JSON.stringify({ password: password });

            // Kirim ke server
            if (window.CefBridge) {
                if (typeof window.CefBridge.sendClientEvent === 'function') {
                    window.CefBridge.sendClientEvent(eventName, payload);
                } else if (typeof window.CefBridge.onClientEvent === 'function') {
                    window.CefBridge.onClientEvent(eventName, payload);
                }
            }
        });

        // 4. Menerima Respon Server
        window.onCefEvent = function(event, json) {
            try {
                let data = JSON.parse(json);
                
                if (event === "auth:error") {
                    document.getElementById('btnAction').innerText = isRegistering ? "REGISTER IDENTITY" : "CONNECT TO SERVER";
                    let errorEl = document.getElementById('errorMsg');
                    errorEl.innerText = data.msg;
                    errorEl.classList.add('show');
                }
                else if (event === "auth:success") {
                    // Sembunyikan panel Login
                    document.getElementById('authPanel').style.display = "none";
                    
                    // FIX PALING PENTING: Panggil updateTouchAreas() lagi!
                    // Karena elemen sudah "display: none", script akan mengirimkan array kosong [] ke Kotlin
                    // Sehingga seluruh hambatan sentuhan di Android otomatis terhapus seketika!
                    updateTouchAreas();
                }
            } catch(e) {
                console.error("JSON Error:", e);
            }
        };
    </script>
</body>
</html>
