<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body {
    color: #ffffff;
}

.bg-glow {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 20%, rgba(245, 176, 64, 0.28), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.64), transparent 56%);
    pointer-events: none;
}

.window {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    max-width: calc(100vw - 34px);
    padding: 18px;
    border-radius: 22px;
    background: rgba(18, 19, 22, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.68);
    overflow: hidden;
}

.window:before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 30%, rgba(245,176,64,0.08));
    pointer-events: none;
}

.brand-row,
.hero-copy,
.tabs,
.panel,
.status-box {
    position: relative;
    z-index: 2;
}

.brand-row {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 18px;
}

.brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f7b955, #ff7a1a);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #181818;
    font-size: 24px;
    font-weight: 900;
    box-shadow: 0 8px 24px rgba(255, 137, 24, 0.32);
}

.brand-title {
    font-size: 14px;
    letter-spacing: 1.8px;
    font-weight: 900;
}

.brand-subtitle {
    margin-top: 3px;
    color: #a9abb2;
    font-size: 11px;
}

.hero-copy {
    padding: 14px;
    border-radius: 18px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 14px;
}

.eyebrow {
    color: #f7b955;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}

h1 {
    margin: 7px 0 5px;
    font-size: 26px;
    line-height: 1;
}

p {
    margin: 0;
    color: #c7c9d1;
    font-size: 12px;
    line-height: 1.45;
}

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}

.tab,
.choice,
.primary-btn {
    border: 0;
    border-radius: 13px;
    font-weight: 900;
    cursor: pointer;
    color: #d9dce4;
    background: rgba(255,255,255,0.08);
}

.tab {
    height: 40px;
    font-size: 12px;
}

.tab.active {
    color: #171717;
    background: linear-gradient(135deg, #ffd06a, #ff8d2c);
}

.panel {
    display: none;
}

.panel.active {
    display: block;
}

label {
    display: block;
    margin: 10px 0 6px;
    color: #eceef5;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

label span {
    color: #878b96;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 600;
}

input {
    width: 100%;
    height: 43px;
    padding: 0 13px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.34);
    color: #fff;
    font-size: 14px;
    user-select: text;
}

input:focus {
    border-color: rgba(255, 188, 83, 0.74);
}

.gender-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.choice {
    height: 39px;
    font-size: 12px;
}

.choice.active {
    background: rgba(255, 188, 83, 0.22);
    color: #ffd06a;
    border: 1px solid rgba(255, 188, 83, 0.42);
}

.primary-btn {
    width: 100%;
    height: 46px;
    margin-top: 14px;
    color: #161616;
    background: linear-gradient(135deg, #ffd06a, #ff8d2c);
    box-shadow: 0 10px 28px rgba(255, 141, 44, 0.25);
}

.primary-btn:active,
.tab:active,
.choice:active {
    transform: scale(0.985);
}

.primary-btn.disabled {
    opacity: 0.55;
}

.status-box {
    min-height: 31px;
    margin-top: 12px;
    padding: 9px 10px;
    border-radius: 12px;
    color: #cdd0d8;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.07);
    font-size: 12px;
    text-align: center;
}

.status-box.error {
    color: #ffb3b3;
    border-color: rgba(255, 80, 80, 0.35);
}

.status-box.ok {
    color: #b7ffd2;
    border-color: rgba(40, 220, 120, 0.30);
}

@media (max-height: 520px) {
    .window {
        width: 340px;
        padding: 14px;
    }
    .hero-copy {
        padding: 10px;
        margin-bottom: 10px;
    }
    h1 {
        font-size: 22px;
    }
    input {
        height: 39px;
    }
    .primary-btn {
        height: 41px;
    }
}

    </style>
    <title>Holy Roleplay Auth</title>
</head>
<body>
<div class="bg-glow"></div>

<div class="window" id="main-window">
    <div class="brand-row">
        <div class="brand-mark">H</div>
        <div>
            <div class="brand-title">HOLY ROLEPLAY</div>
            <div class="brand-subtitle" id="mode-label">Mobile CEF Login</div>
        </div>
    </div>

    <div class="hero-copy">
        <div class="eyebrow">GTA SA:MP Mobile 2.1 x64</div>
        <h1 id="title-text">Masuk Akun</h1>
        <p id="desc-text">Gunakan password akun server kamu untuk melanjutkan.</p>
    </div>

    <div class="tabs">
        <button type="button" id="tab-login" class="tab active">Login</button>
        <button type="button" id="tab-register" class="tab">Register</button>
    </div>

    <div class="panel active" id="login-panel">
        <label>Password</label>
        <input id="login-password" type="password" maxlength="16" placeholder="Masukkan password" autocomplete="off">
        <button id="login-btn" class="primary-btn">LOGIN</button>
    </div>

    <div class="panel" id="register-panel">
        <label>Password</label>
        <input id="reg-password" type="password" maxlength="15" placeholder="6 - 15 karakter" autocomplete="off">

        <label>Email</label>
        <input id="reg-email" type="text" maxlength="60" placeholder="email@example.com" autocomplete="off">

        <label>Referral <span>opsional</span></label>
        <input id="reg-refer" type="text" maxlength="20" placeholder="Nickname teman" autocomplete="off">

        <label>Gender</label>
        <div class="gender-row">
            <button type="button" id="sex-male" class="choice active" data-sex="0">Laki-laki</button>
            <button type="button" id="sex-female" class="choice" data-sex="1">Perempuan</button>
        </div>

        <button id="register-btn" class="primary-btn">BUAT AKUN</button>
    </div>

    <div class="status-box" id="status-box">Siap.</div>
</div>

<script>
function log(m) {
    try {
        console.log("[HOLY_AUTH] " + m);
        if (window.CefBridge && window.CefBridge.sendClientEvent) {
            window.CefBridge.sendClientEvent("log", JSON.stringify("[AUTH_JS] " + m));
        }
    } catch (e) {}
}

window.CefReady = false;
window.Cef = {
    _events: {},

    _trigger: function(ev, data) {
        log("Trigger: " + ev + " RawData: " + data);
        var p = data;
        if (typeof data === "string") {
            try { p = JSON.parse(data); } catch(e) { log("Parse Error"); }
        }
        if (this._events[ev]) {
            for (var i = 0; i < this._events[ev].length; i++) {
                this._events[ev][i](p);
            }
        }
    },

    on: function(ev, cb) {
        if (!this._events[ev]) this._events[ev] = [];
        this._events[ev].push(cb);
        log("Subscribed to: " + ev);
    }
};

function cefSend(eventName, payload) {
    var json = "{}";
    try { json = JSON.stringify(payload || {}); } catch (e) {}

    if (window.CefBridge && window.CefBridge.sendClientEvent) {
        window.CefBridge.sendClientEvent(eventName, json);
        return true;
    }

    log("CefBridge not found: " + eventName + " " + json);
    return false;
}

function sendInteractiveAreas() {
    try {
        if (window.CefBridge && window.CefBridge.updateInteractiveAreas) {
            var rects = [];
            var el = document.getElementById("main-window");

            if (el && window.getComputedStyle(el).display !== "none") {
                var r = el.getBoundingClientRect();
                rects.push([Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)]);
            }

            window.CefBridge.updateInteractiveAreas(JSON.stringify(rects));
        }
    } catch (e) {}
}

window.addEventListener("DOMContentLoaded", function() {
    window.CefReady = true;
    log("CEF Ready");

    if (window.CefBridge && window.CefBridge.cefReady) {
        window.CefBridge.cefReady();
    }

    cefSend("auth:ready", { page: "auth", mode: getModeFromUrl() });
    setTimeout(sendInteractiveAreas, 80);
    setTimeout(sendInteractiveAreas, 350);
});

window.onresize = sendInteractiveAreas;

</script>
<script>
var currentMode = "login";
var selectedSex = 0;
var lockTimer = null;

function $(id) {
    return document.getElementById(id);
}

function getModeFromUrl() {
    var query = window.location.search || "";
    if (query.indexOf("mode=register") !== -1) return "register";
    return "login";
}

function setStatus(text, type) {
    var box = $("status-box");
    if (!box) return;
    box.className = "status-box" + (type ? " " + type : "");
    box.innerText = text || "Siap.";
}

function setBusy(active, text) {
    var buttons = [$("login-btn"), $("register-btn"), $("tab-login"), $("tab-register")];
    for (var i = 0; i < buttons.length; i++) {
        if (buttons[i]) {
            buttons[i].disabled = !!active;
            if (active) buttons[i].classList.add("disabled");
            else buttons[i].classList.remove("disabled");
        }
    }
    if (text) setStatus(text, active ? "ok" : "");

    if (lockTimer) clearTimeout(lockTimer);
    if (active) {
        lockTimer = setTimeout(function() {
            setBusy(false, "Jika belum masuk, cek pesan merah di chat server lalu coba lagi.");
        }, 1700);
    }
}

function setMode(mode) {
    currentMode = mode === "register" ? "register" : "login";

    $("tab-login").classList.toggle("active", currentMode === "login");
    $("tab-register").classList.toggle("active", currentMode === "register");
    $("login-panel").classList.toggle("active", currentMode === "login");
    $("register-panel").classList.toggle("active", currentMode === "register");

    if (currentMode === "login") {
        $("mode-label").innerText = "Mobile CEF Login";
        $("title-text").innerText = "Masuk Akun";
        $("desc-text").innerText = "Gunakan password akun server kamu untuk melanjutkan.";
        setStatus("Masukkan password lalu tekan LOGIN.");
        setTimeout(function(){ $("login-password").focus(); }, 80);
    } else {
        $("mode-label").innerText = "Mobile CEF Register";
        $("title-text").innerText = "Buat Akun";
        $("desc-text").innerText = "Isi data akun baru. Referral boleh dikosongkan.";
        setStatus("Isi password, email, dan gender lalu tekan BUAT AKUN.");
        setTimeout(function(){ $("reg-password").focus(); }, 80);
    }

    sendInteractiveAreas();
}

function validatePassword(pass) {
    if (!pass || pass.length < 6 || pass.length > 15) return false;
    if (pass.indexOf(" ") !== -1 || pass.indexOf("%") !== -1) return false;
    return true;
}

function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email || "");
}

function submitLogin() {
    var pass = $("login-password").value || "";
    if (pass.length < 1 || pass.length > 16) {
        setStatus("Password login tidak valid.", "error");
        return;
    }

    setBusy(true, "Memproses login...");
    cefSend("auth:login", { password: pass });
}

function submitRegister() {
    var pass = $("reg-password").value || "";
    var email = $("reg-email").value || "";
    var refer = $("reg-refer").value || "";

    if (!validatePassword(pass)) {
        setStatus("Password harus 6-15 karakter, tanpa spasi dan tanpa persen.", "error");
        return;
    }

    if (!validateEmail(email)) {
        setStatus("Format email tidak valid.", "error");
        return;
    }

    setBusy(true, "Mendaftarkan akun...");
    cefSend("auth:register", {
        password: pass,
        email: email,
        refer: refer,
        sex: selectedSex
    });
}

function bindInputEnter(id, callback) {
    var input = $(id);
    if (!input) return;
    input.addEventListener("keyup", function(e) {
        if ((e.key && e.key === "Enter") || e.keyCode === 13) callback();
    });
}

window.addEventListener("DOMContentLoaded", function() {
    $("tab-login").addEventListener("click", function(){ setMode("login"); });
    $("tab-register").addEventListener("click", function(){ setMode("register"); });
    $("login-btn").addEventListener("click", submitLogin);
    $("register-btn").addEventListener("click", submitRegister);

    $("sex-male").addEventListener("click", function() {
        selectedSex = 0;
        $("sex-male").classList.add("active");
        $("sex-female").classList.remove("active");
    });

    $("sex-female").addEventListener("click", function() {
        selectedSex = 1;
        $("sex-female").classList.add("active");
        $("sex-male").classList.remove("active");
    });

    bindInputEnter("login-password", submitLogin);
    bindInputEnter("reg-password", submitRegister);
    bindInputEnter("reg-email", submitRegister);
    bindInputEnter("reg-refer", submitRegister);

    setMode(getModeFromUrl());
    sendInteractiveAreas();
});

window.Cef.on("auth:hide", function() {
    var el = $("main-window");
    if (el) el.style.display = "none";
    sendInteractiveAreas();
});

</script>
</body>
</html>
