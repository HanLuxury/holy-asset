<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PARADISE - FIVEM UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
            user-select: none;
        }

        body { 
            margin: 0; 
            width: 100vw; 
            height: 100vh; 
            /* BACKGROUND TRANSPARAN 100% - Game akan terlihat di belakangnya */
            background: transparent; 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
        }

        /* Base Window Style (Kaca Blur / Glassmorphism) */
        .window {
            position: absolute; 
            background: rgba(18, 20, 24, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        /* =========================================
           TAMPILAN JENDELA LOGIN (Kanan Layar)
           ========================================= */
        #login-window {
            top: 50%; right: 5%; /* Menempel di kanan layar ala FiveM */
            transform: translateY(-50%);
            width: 340px; 
            border-radius: 12px;
            border-left: 4px solid #ff3b3b;
            padding: 30px;
        }

        .logo-text {
            color: #FFF; 
            font-size: 26px;
            font-weight: 900; 
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .logo-text span { color: #ff3b3b; }

        .subtitle {
            color: #8892b0;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #a0aec0;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input {
            width: 100%; 
            padding: 14px 15px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; 
            color: #FFF; 
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #ff3b3b;
            background: rgba(0, 0, 0, 0.6);
        }

        button.btn-primary {
            width: 100%; 
            padding: 14px; 
            background: #ff3b3b; 
            border: none;
            border-radius: 6px; 
            color: #FFF; 
            font-weight: 700; 
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        button.btn-primary:hover {
            background: #e03131;
            transform: translateY(-2px);
        }

        .error-text {
            color: #ff5252;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 15px;
            min-height: 18px;
        }

        .switch-link {
            margin-top: 20px;
            font-size: 12px;
            color: #a0aec0;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: 0.3s;
        }

        .switch-link:hover { color: #FFF; }
        .switch-link span { color: #ff3b3b; font-weight: 700; }

        /* =========================================
           TAMPILAN HUD DARAH (Kanan Atas)
           ========================================= */
        #main-window {
            top: 20px; right: 20px;
            width: 250px;
            border-radius: 8px;
            padding: 15px;
            display: none; /* Sembunyikan sebelum login sukses */
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .hud-title {
            color: #a0aec0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-icon {
            color: #ff3b3b;
            font-size: 14px;
        }

        #hp-text {
            color: #FFF;
            font-weight: 700;
            font-size: 12px;
        }

        .hp-container {
            width: 100%; 
            height: 10px; /* Bar darah tipis dan modern */
            background: rgba(0, 0, 0, 0.5); 
            border-radius: 5px;
            position: relative; 
            overflow: hidden; 
            margin-bottom: 12px;
        }

        #hp-fill {
            height: 100%; 
            width: 100%; 
            background: linear-gradient(90deg, #ff3b3b, #ff6b6b);
            border-radius: 5px;
            transition: width 0.4s ease, background 0.4s ease; 
        }

        button.btn-secondary {
            width: 100%; 
            padding: 8px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; 
            color: #a0aec0; 
            font-weight: 600; 
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: #FFF;
        }
    </style>
</head>
<body>

<div class="window" id="login-window">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle" id="authTitle">Authentication Required</div>

    <div class="input-group">
        <label>SECURITY KEY</label>
        <input type="password" id="passInput" placeholder="Enter your password...">
    </div>

    <div class="error-text" id="errorMsg"></div>
    <button id="btnAction" class="btn-primary">CONNECT TO SERVER</button>
    <div class="switch-link" id="btnToggle">New to the city? <span>Register</span></div>
</div>

<div class="window" id="main-window">
    <div class="hud-header">
        <div class="hud-title"><span class="hud-icon">❤</span> HEALTH</div>
        <div id="hp-text">100 / 100</div>
    </div>
    <div class="hp-container">
        <div id="hp-fill"></div>
    </div>
    <button id="send-btn" class="btn-secondary">SEND DATA</button>
</div>

<script>
    // --- 1. CORE JS KOMUNIKASI KOTLIN ---
    function log(m) {
        console.log("[CEF_JS] " + m);
    }

    window.CefReady = false;
    window.Cef = {
        _events: {},
        _trigger(ev, data) {
            log("Trigger: " + ev);
            let p = data;
            if (typeof data === 'string') {
                try { p = JSON.parse(data); } catch(e) {}
            }

            // Menerima Darah dari PAWN
            if (ev === "updateHP" && p.hp !== undefined) {
                localStorage.setItem('last_hp', p.hp);
                renderHP();
            }

            // Menerima Gagal Login
            if (ev === "auth:error") {
                document.getElementById('errorMsg').innerText = p.msg;
                document.getElementById('btnAction').innerText = isRegistering ? "CREATE IDENTITY" : "CONNECT TO SERVER";
            }

            // Menerima Sukses Login
            if (ev === "auth:success") {
                document.getElementById('login-window').style.display = 'none'; // Sembunyikan form login
                document.getElementById('main-window').style.display = 'block'; // Tampilkan HUD darah
                sendInteractiveAreas(); // WAJIB: Sinkronisasi Hitbox ke Android agar game bisa diklik!
            }

            if (this._events[ev]) {
                this._events[ev].forEach(cb => cb(p));
            }
        },
        on(ev, cb) {
            if (!this._events[ev]) this._events[ev] = [];
            this._events[ev].push(cb);
        }
    };

    function sendInteractiveAreas() {
        if (window.CefBridge && window.CefBridge.updateInteractiveAreas) {
            const rects = [];
            
            const loginWin = document.getElementById('login-window');
            if (loginWin && window.getComputedStyle(loginWin).display !== 'none') {
                const r = loginWin.getBoundingClientRect();
                rects.push([r.left, r.top, r.width, r.height]);
            }
            
            const hudWin = document.getElementById('main-window');
            if (hudWin && window.getComputedStyle(hudWin).display !== 'none') {
                const r = hudWin.getBoundingClientRect();
                rects.push([r.left, r.top, r.width, r.height]);
            }
            
            window.CefBridge.updateInteractiveAreas(JSON.stringify(rects));
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        window.CefReady = true;
        if(window.CefBridge && window.CefBridge.cefReady) window.CefBridge.cefReady();
        sendInteractiveAreas();
    });
    window.onresize = sendInteractiveAreas;

    // --- 2. LOGIC LOGIN ---
    let isRegistering = false;
    document.getElementById('btnToggle').addEventListener('click', () => {
        isRegistering = !isRegistering;
        document.getElementById('authTitle').innerText = isRegistering ? "CITIZEN REGISTRATION" : "AUTHENTICATION REQUIRED";
        document.getElementById('btnAction').innerText = isRegistering ? "CREATE IDENTITY" : "CONNECT TO SERVER";
        document.getElementById('btnToggle').innerHTML = isRegistering ? "Already a citizen? <span>Login</span>" : "New to the city? <span>Register</span>";
        document.getElementById('errorMsg').innerText = "";
    });

    document.getElementById('btnAction').addEventListener('click', () => {
        let pass = document.getElementById('passInput').value;
        if(pass.length < 3) {
            document.getElementById('errorMsg').innerText = "Password must be at least 3 characters!";
            return;
        }
        document.getElementById('errorMsg').innerText = "";
        document.getElementById('btnAction').innerText = "LOADING...";
        
        let ev = isRegistering ? "auth:register" : "auth:login";
        let payload = JSON.stringify({ password: pass });
        
        if (window.CefBridge && window.CefBridge.sendClientEvent) {
            window.CefBridge.sendClientEvent(ev, payload);
        }
    });

    // --- 3. LOGIC HUD ---
    function renderHP() {
        const fill = document.getElementById("hp-fill");
        const text = document.getElementById("hp-text");
        if (!fill || !text) return;

        const hp = parseFloat(localStorage.getItem('last_hp') || 100);
        const percent = Math.min(Math.max(hp, 0), 100);

        fill.style.width = percent + "%";
        text.innerText = hp.toFixed(1) + " / 100";

        // Ubah warna bar tergantung HP (Modern Gradient)
        if (percent > 60) {
            fill.style.background = "linear-gradient(90deg, #2a9d8f, #4cd964)";
            document.querySelector('.hud-icon').style.color = "#4cd964";
        }
        else if (percent > 25) {
            fill.style.background = "linear-gradient(90deg, #f59f00, #ffd24d)";
            document.querySelector('.hud-icon').style.color = "#ffd24d";
        }
        else {
            fill.style.background = "linear-gradient(90deg, #c92a2a, #ff4b4b)";
            document.querySelector('.hud-icon').style.color = "#ff4b4b";
        }
    }

    document.getElementById("send-btn").addEventListener("click", () => {
        if (window.CefBridge && window.CefBridge.sendClientEvent) {
            window.CefBridge.sendClientEvent("buttonPressed", "{}");
        }
    });
    
    renderHP();
</script>
</body>
</html>
