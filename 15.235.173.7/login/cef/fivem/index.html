<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEF HUD & LOGIN</title>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
        }

        body { 
            margin: 0; 
            width: 100vw; 
            height: 100vh; 
            background: transparent; 
            font-family: sans-serif; 
            overflow: hidden; 
        }

        .window {
            position: absolute; 
            background: #1F2021; 
            border: 2px solid #373B3C;
            border-radius: 14px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            text-align: center;
            padding: 20px;
        }

        /* Tampilan Jendela Login (Di Tengah) */
        #login-window {
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 300px; 
        }

        /* Tampilan Jendela HUD (Di Kanan Atas) */
        #main-window {
            top: 20px; right: 20px;
            width: 280px;
            display: none; /* Disembunyikan sebelum login sukses */
        }

        .window-title {
            color: #FFF; 
            font-weight: bold; 
            margin-bottom: 10px;
        }

        .hp-container {
            width: 100%; 
            height: 30px; 
            background: #333; 
            border-radius: 6px;
            position: relative; 
            overflow: hidden; 
            margin: 15px 0; 
            border: 1px solid #444;
        }

        #hp-fill {
            height: 100%; 
            width: 0%; 
            background-color: #4cd964;
            transition: width 0.4s ease; 
            position: absolute; 
            top: 0; left: 0; 
            z-index: 1;
        }

        #hp-text {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; left: 0;
            text-align: center; 
            line-height: 30px; 
            color: white;
            font-weight: bold; 
            font-size: 14px; 
            text-shadow: 1px 1px 2px black; 
            z-index: 2;
        }

        input {
            width: 100%; 
            padding: 12px; 
            background: #2C2E2F; 
            border: 1px solid #373B3C;
            border-radius: 8px; 
            color: #FFF; 
            font-size: 14px;
            margin-bottom: 10px;
        }

        button {
            width: 100%; 
            padding: 12px; 
            background: #2C2E2F; 
            border: 1px solid #373B3C;
            border-radius: 8px; 
            color: #BFBFBF; 
            font-weight: bold; 
            cursor: pointer;
        }

        .error-text {
            color: #ff4b4b;
            font-size: 12px;
            margin-bottom: 10px;
            min-height: 15px;
        }

        .switch-link {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="window" id="login-window">
    <div class="window-title" id="authTitle">LOGIN TO SERVER</div>
    <input type="password" id="passInput" placeholder="Enter Password...">
    <div class="error-text" id="errorMsg"></div>
    <button id="btnAction" style="margin-bottom: 10px;">CONNECT</button>
    <div class="switch-link" id="btnToggle">Don't have an account? Register</div>
</div>

<div class="window" id="main-window">
    <div class="window-title">HUD STATUS</div>
    <div class="hp-container">
        <div id="hp-fill"></div>
        <div id="hp-text">100.0 / 100</div>
    </div>
    <button id="send-btn">SEND DATA</button>
</div>

<script>
    // --- 1. CORE JS KOMUNIKASI KOTLIN ---
    function log(m) {
        console.log("[CEF_JS] " + m);
    }

    window.CefReady = false;
    window.Cef = {
        _events: {},
        _trigger(ev, data) {
            log("Trigger: " + ev);
            let p = data;
            if (typeof data === 'string') {
                try { p = JSON.parse(data); } catch(e) {}
            }

            // Menerima Darah dari PAWN
            if (ev === "updateHP" && p.hp !== undefined) {
                localStorage.setItem('last_hp', p.hp);
                renderHP();
            }

            // Menerima Gagal Login
            if (ev === "auth:error") {
                document.getElementById('errorMsg').innerText = p.msg;
                document.getElementById('btnAction').innerText = isRegistering ? "REGISTER" : "CONNECT";
            }

            // Menerima Sukses Login
            if (ev === "auth:success") {
                document.getElementById('login-window').style.display = 'none'; // Sembunyikan form login
                document.getElementById('main-window').style.display = 'block'; // Tampilkan HUD darah
                sendInteractiveAreas(); // Sinkronisasi Hitbox ke Android!
            }

            if (this._events[ev]) {
                this._events[ev].forEach(cb => cb(p));
            }
        },
        on(ev, cb) {
            if (!this._events[ev]) this._events[ev] = [];
            this._events[ev].push(cb);
        }
    };

    function sendInteractiveAreas() {
        if (window.CefBridge && window.CefBridge.updateInteractiveAreas) {
            const rects = [];
            
            const loginWin = document.getElementById('login-window');
            if (loginWin && window.getComputedStyle(loginWin).display !== 'none') {
                const r = loginWin.getBoundingClientRect();
                rects.push([r.left, r.top, r.width, r.height]);
            }
            
            const hudWin = document.getElementById('main-window');
            if (hudWin && window.getComputedStyle(hudWin).display !== 'none') {
                const r = hudWin.getBoundingClientRect();
                rects.push([r.left, r.top, r.width, r.height]);
            }
            
            window.CefBridge.updateInteractiveAreas(JSON.stringify(rects));
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        window.CefReady = true;
        if(window.CefBridge && window.CefBridge.cefReady) window.CefBridge.cefReady();
        sendInteractiveAreas();
    });
    window.onresize = sendInteractiveAreas;

    // --- 2. LOGIC LOGIN ---
    let isRegistering = false;
    document.getElementById('btnToggle').addEventListener('click', () => {
        isRegistering = !isRegistering;
        document.getElementById('authTitle').innerText = isRegistering ? "REGISTER ACCOUNT" : "LOGIN TO SERVER";
        document.getElementById('btnAction').innerText = isRegistering ? "REGISTER" : "CONNECT";
        document.getElementById('btnToggle').innerText = isRegistering ? "Already have an account? Login" : "Don't have an account? Register";
        document.getElementById('errorMsg').innerText = "";
    });

    document.getElementById('btnAction').addEventListener('click', () => {
        let pass = document.getElementById('passInput').value;
        if(pass.length < 3) {
            document.getElementById('errorMsg').innerText = "Password too short!";
            return;
        }
        document.getElementById('errorMsg').innerText = "";
        document.getElementById('btnAction').innerText = "LOADING...";
        
        let ev = isRegistering ? "auth:register" : "auth:login";
        let payload = JSON.stringify({ password: pass });
        
        if (window.CefBridge && window.CefBridge.sendClientEvent) {
            window.CefBridge.sendClientEvent(ev, payload);
        }
    });

    // --- 3. LOGIC HUD ---
    function renderHP() {
        const fill = document.getElementById("hp-fill");
        const text = document.getElementById("hp-text");
        if (!fill || !text) return;

        const hp = parseFloat(localStorage.getItem('last_hp') || 100);
        const percent = Math.min(Math.max(hp, 0), 100);

        fill.style.width = percent + "%";
        text.innerText = hp.toFixed(1) + " / 100";

        if (percent > 60) fill.style.backgroundColor = "#4cd964";
        else if (percent > 25) fill.style.backgroundColor = "#ffd24d";
        else fill.style.backgroundColor = "#ff4b4b";
    }

    document.getElementById("send-btn").addEventListener("click", () => {
        if (window.CefBridge && window.CefBridge.sendClientEvent) {
            window.CefBridge.sendClientEvent("buttonPressed", "{}");
        }
    });
    
    renderHP();
</script>
</body>
</html>
