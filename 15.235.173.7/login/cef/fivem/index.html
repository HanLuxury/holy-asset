<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070a12" />
  <title>Holy Roleplay CEF Mobile</title>
  <link rel="stylesheet" href="style.css?v=login-ui-fix-20260503" />
</head>
<body class="ui-login">
  <div id="app" class="app">
    <div class="vignette"></div>

    <section id="bootScreen" class="boot-screen">
      <div class="brand-card">
        <div class="brand-mark">HR</div>
        <div class="brand-copy">
          <h1 id="serverName">Holy Roleplay</h1>
          <p id="serverVersion">Mobile CEF UI</p>
        </div>
      </div>
      <div class="login-card glass">
        <div class="eyebrow">Android CEF Connected</div>
        <h2>FiveM Style Interface</h2>
        <p>Login, register, menu, notifikasi, game text, dan HUD dikendalikan dari gamemode melalui event CEF.</p>
        <div class="login-grid">
          <label>
            <span>Player</span>
            <input id="fakePlayer" value="Loading..." autocomplete="off" />
          </label>
          <label>
            <span>Status</span>
            <input id="fakeStatus" value="Menunggu server" autocomplete="off" />
          </label>
        </div>
        <button id="readyButton" class="primary-btn">Refresh UI</button>
      </div>
    </section>

    <section class="top-hud glass hidden" id="topHud">
      <div class="server-pill"><span id="hudServer">HOLY RP</span><small id="hudVersion">CEF</small></div>
      <div class="money-box">
        <span>Cash</span><strong id="moneyValue">$0</strong>
      </div>
      <div class="money-box muted">
        <span>Bank</span><strong id="bankValue">$0</strong>
      </div>
    </section>

    <section class="status-panel glass hidden" id="statusPanel">
      <div class="stat-line"><span>HP</span><div class="bar"><i id="healthBar"></i></div><b id="healthValue">100</b></div>
      <div class="stat-line"><span>AR</span><div class="bar"><i id="armourBar"></i></div><b id="armourValue">0</b></div>
      <div class="stat-line"><span>Food</span><div class="bar"><i id="hungerBar"></i></div><b id="hungerValue">100</b></div>
      <div class="stat-line"><span>Drink</span><div class="bar"><i id="thirstBar"></i></div><b id="thirstValue">100</b></div>
      <div class="level-row"><span>LV <b id="levelValue">1</b></span><span>EXP <b id="expValue">0</b></span><span>WL <b id="wantedValue">0</b></span></div>
    </section>

    <section class="speedometer glass hidden" id="speedometer">
      <div class="speed-main"><strong id="speedValue">0</strong><span>KM/H</span></div>
      <div class="speed-meta"><span>Fuel <b id="fuelValue">0</b>%</span><span>KM <b id="mileageValue">0</b></span></div>
    </section>

    <section id="gameText" class="game-text hidden"></section>
    <section id="notifications" class="notifications"></section>

    <section id="dialogOverlay" class="dialog-overlay hidden">
      <div class="dialog-card glass">
        <div class="dialog-header">
          <div>
            <small>Roleplay Menu</small>
            <h3 id="dialogTitle">Dialog</h3>
          </div>
          <button id="dialogClose" class="icon-btn">×</button>
        </div>
        <div id="dialogBody" class="dialog-body"></div>
        <div id="dialogActions" class="dialog-actions"></div>
      </div>
    </section>
  </div>

  <script src="app.js?v=login-ui-fix-20260503"></script>
</body>
</html>
