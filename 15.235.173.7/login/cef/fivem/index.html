<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paradise - Final Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; touch-action: manipulation; }
        html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; font-family: 'Poppins', sans-serif; overflow: hidden; color: #fff; }

        .ui-window {
            position: absolute; top: 50%; right: 5%; transform: translateY(-50%);
            width: 270px; background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(10px);
            border-radius: 8px; border-left: 3px solid #ff3b3b; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: auto; display: none; 
        }

        #auth-window { display: block; } /* Pastikan selalu muncul */

        .logo-text { font-size: 20px; font-weight: 900; margin-bottom: 0px; letter-spacing: 1px;}
        .logo-text span { color: #ff3b3b; }
        .subtitle { color: #888; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: 600;}
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; color: #aaa; font-size: 8px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px;}

        input {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 5px;
            color: #fff; font-size: 11px; transition: 0.3s; user-select: text; -webkit-user-select: text;
        }
        input:focus { border-color: #ff3b3b; background: rgba(0,0,0,0.6);}
        
        .gender-selector { display: flex; gap: 5px; }
        .gender-btn {
            flex: 1; padding: 8px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
            color: #888; font-size: 9px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .gender-btn.active { background: #ff3b3b; color: #fff; border-color: #ff3b3b; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        button.btn-primary {
            width: 100%; padding: 12px; background: #ff3b3b; border: none;
            border-radius: 5px; color: #fff; font-weight: 800; font-size: 11px;
            cursor: pointer; margin-top: 5px; letter-spacing: 1px; text-transform: uppercase;
        }
        button.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
        .error-text { color: #ff5252; font-size: 10px; margin-bottom: 5px; text-align: center; min-height: 14px; font-weight: 600;}
        .switch-link { margin-top: 15px; font-size: 10px; color: #888; text-align: center; cursor: pointer; }
        .switch-link span { color: #ff3b3b; font-weight: 700; }

        .selector-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 12px; border-radius: 5px; margin-bottom: 10px;
        }
        .selector-row span.label { font-size: 9px; font-weight: 700; color: #aaa; }
        .selector-controls { display: flex; align-items: center; gap: 10px; }
        .selector-controls button { background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 3px; cursor: pointer; font-size: 10px; padding: 3px 8px; }
        .selector-controls button:hover { background: #ff3b3b; }
        .selector-controls span.val { font-size: 10px; font-weight: 800; width: 45px; text-align: center; }

        #hud-window {
            position: absolute; top: 20px; right: 20px; width: 200px;
            background: rgba(15, 17, 20, 0.7); backdrop-filter: blur(5px);
            border-radius: 6px; padding: 12px; display: none; 
            border: 1px solid rgba(255,255,255,0.05); pointer-events: none; 
        }
        .hud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .hud-title { color: #a0aec0; font-size: 9px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 4px; }
        .hud-icon { color: #ff3b3b; font-size: 11px; }
        #hp-text { color: #FFF; font-weight: 800; font-size: 10px; }
        .hp-container { width: 100%; height: 8px; background: rgba(0, 0, 0, 0.6); border-radius: 4px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b3b, #ff6b6b); border-radius: 4px; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="auth-window" class="ui-window">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle" id="authSubtitle">Identity Manager</div>

    <div id="login-section" style="display: block;">
        <div class="input-group"><label>SECURITY KEY</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"></div>
    </div>

    <div id="register-section" style="display: none;">
        <div class="form-grid">
            <div class="input-group"><label>FIRST NAME</label><input type="text" id="regFName" placeholder="John" autocomplete="off"></div>
            <div class="input-group"><label>LAST NAME</label><input type="text" id="regLName" placeholder="Doe" autocomplete="off"></div>
        </div>
        <div class="input-group"><label>DATE OF BIRTH</label><input type="date" id="regDOB" max="2010-12-31"></div>
        <div class="input-group">
            <label>GENDER</label>
            <div class="gender-selector">
                <div class="gender-btn active" data-gender="Male">MALE</div>
                <div class="gender-btn" data-gender="Female">FEMALE</div>
            </div>
        </div>
        <div class="input-group"><label>NATIONALITY</label><input type="text" id="regNation" placeholder="Indonesian" autocomplete="off"></div>
        <div class="input-group"><label>CREATE PASSWORD</label><input type="password" id="regPass" autocomplete="off"></div>
    </div>

    <div class="error-text" id="errorMsg"></div>
    <button id="btnSubmit" class="btn-primary" type="button">CONNECT TO SERVER</button>
    <div id="switchLink" class="switch-link" onclick="toggleAuth()">New to the city? <span>Register</span></div>
</div>

<div id="char-window" class="ui-window">
    <div class="logo-text">WARDROBE<span>RP</span></div>
    <div class="subtitle">Set your appearance</div>
    <div class="selector-row"><span class="label">OUTFIT</span><div class="selector-controls"><button onclick="changeAttr('skin', -1)">❮</button><span class="val" id="valSkin">1/5</span><button onclick="changeAttr('skin', 1)">❯</button></div></div>
    <div class="selector-row"><span class="label">HEADWEAR</span><div class="selector-controls"><button onclick="changeAttr('hat', -1)">❮</button><span class="val" id="valHat">None</span><button onclick="changeAttr('hat', 1)">❯</button></div></div>
    <div class="selector-row"><span class="label">EYEWEAR</span><div class="selector-controls"><button onclick="changeAttr('glass', -1)">❮</button><span class="val" id="valGlass">None</span><button onclick="changeAttr('glass', 1)">❯</button></div></div>
    <button id="btnFinishChar" class="btn-primary" type="button" onclick="finishChar()">FINISH & SPAWN</button>
</div>

<div id="hud-window">
    <div class="hud-header">
        <div class="hud-title"><span class="hud-icon">❤</span> HEALTH</div>
        <div id="hp-text">100 / 100</div>
    </div>
    <div class="hp-container"><div id="hp-fill"></div></div>
</div>

<script>
    let isRegistering = false;
    let selectedGender = "Male";
    let activeWindow = "auth-window";
    let modeReceived = false;
    let forceClearTimer = null;

    const skinsM = [26, 29, 187, 21, 97];
    const skinsF = [9, 12, 141, 65, 193];
    let currentSkins = skinsM;
    const hats = [0, 18961, 18948, 18967];
    const hatNames = ["None", "Trucker", "Fedora", "Cowboy"];
    const glasses = [0, 19011, 19020, 19021];
    const glassNames = ["None", "Aviator", "Reading", "Beach"];
    let charState = { skin: 0, hat: 0, glass: 0 };

    // SINKRONISASI AREA SENTUH AGAR GAME TIDAK BEKU
    function syncTouchAreas() {
        if (!window.CefBridge || !window.CefBridge.updateInteractiveAreas) return;
        if (!activeWindow) return window.CefBridge.updateInteractiveAreas("[]");
        
        let win = document.getElementById(activeWindow);
        if (win && window.getComputedStyle(win).display !== "none") {
            let r = win.getBoundingClientRect();
            window.CefBridge.updateInteractiveAreas(JSON.stringify([[r.left, r.top, r.width, r.height]]));
        } else {
            window.CefBridge.updateInteractiveAreas("[]");
        }
    }
    setInterval(syncTouchAreas, 150);

    // AUTO-PING KE PAWN
    let pingInterval = setInterval(() => {
        if (!modeReceived && window.CefBridge) window.CefBridge.sendClientEvent("cef:ready", "{}");
    }, 1000);

    // JIKA SERVER NGELAG 3 DETIK, PAKSA BUKA MENU AGAR USER BISA MENGGUNAKAN TOMBOL TOGGLE
    setTimeout(() => {
        if (!modeReceived) {
            clearInterval(pingInterval);
            forceSetMode("login");
        }
    }, 3000);

    function toggleAuth() {
        isRegistering = !isRegistering;
        forceSetMode(isRegistering ? "register" : "login");
    }

    function forceSetMode(mode) {
        modeReceived = true;
        document.getElementById("auth-window").style.display = "block";
        const btn = document.getElementById("btnSubmit");
        btn.disabled = false;
        
        if (mode === "login") {
            isRegistering = false;
            document.getElementById("login-section").style.display = "block";
            document.getElementById("register-section").style.display = "none";
            document.getElementById("authSubtitle").innerText = "Identity Login";
            btn.innerText = "CONNECT TO SERVER";
            document.getElementById("switchLink").innerHTML = "New to the city? <span>Register</span>";
        } else {
            isRegistering = true;
            document.getElementById("register-section").style.display = "block";
            document.getElementById("login-section").style.display = "none";
            document.getElementById("authSubtitle").innerText = "Citizen Registration";
            btn.innerText = "CREATE IDENTITY";
            document.getElementById("switchLink").innerHTML = "Already a citizen? <span>Login</span>";
        }
        syncTouchAreas();
    }

    function showWindow(winId) {
        document.getElementById("auth-window").style.display = "none";
        document.getElementById("char-window").style.display = "none";
        document.getElementById("hud-window").style.display = "none";
        
        if (winId) {
            document.getElementById(winId).style.display = "block";
            activeWindow = (winId === "hud-window") ? null : winId; 
        } else {
            activeWindow = null;
        }
        syncTouchAreas();
    }

    function setGender(val, el) {
        selectedGender = val;
        document.querySelectorAll(".gender-btn").forEach(btn => btn.classList.remove("active"));
        el.classList.add("active");
        currentSkins = (val === "Male") ? skinsM : skinsF;
    }

    function submitForm() {
        const btn = document.getElementById("btnSubmit");
        const err = document.getElementById("errorMsg");
        err.innerText = "";
        let payload = {};
        let eventName = isRegistering ? "auth:register" : "auth:login";

        if (isRegistering) {
            payload = {
                password: document.getElementById("regPass").value.trim(),
                firstname: document.getElementById("regFName").value.trim(),
                lastname: document.getElementById("regLName").value.trim(),
                dob: document.getElementById("regDOB").value.trim(),
                gender: selectedGender,
                nationality: document.getElementById("regNation").value.trim()
            };
            if (!payload.firstname || !payload.lastname || !payload.dob || !payload.password) {
                return err.innerText = "Lengkapi semua form!";
            }
        } else {
            payload = { password: document.getElementById("loginPass").value.trim() };
            if (!payload.password) return err.innerText = "Masukkan Security Key!";
        }

        btn.disabled = true;
        btn.innerText = "AUTHENTICATING...";
        if (window.CefBridge) window.CefBridge.sendClientEvent(eventName, JSON.stringify(payload));
    }

    function updateCharUI() {
        document.getElementById("valSkin").innerText = (charState.skin + 1) + "/" + currentSkins.length;
        document.getElementById("valHat").innerText = hatNames[charState.hat];
        document.getElementById("valGlass").innerText = glassNames[charState.glass];
        if (window.CefBridge) {
            let p = { skin: String(currentSkins[charState.skin]), hat: String(hats[charState.hat]), glasses: String(glasses[charState.glass]) };
            window.CefBridge.sendClientEvent("char:preview", JSON.stringify(p));
        }
    }

    function changeAttr(type, dir) {
        if (type === 'skin') { charState.skin += dir; if (charState.skin < 0) charState.skin = currentSkins.length - 1; if (charState.skin >= currentSkins.length) charState.skin = 0; } 
        else if (type === 'hat') { charState.hat += dir; if (charState.hat < 0) charState.hat = hats.length - 1; if (charState.hat >= hats.length) charState.hat = 0; } 
        else if (type === 'glass') { charState.glass += dir; if (charState.glass < 0) charState.glass = glasses.length - 1; if (charState.glass >= glasses.length) charState.glass = 0; }
        updateCharUI();
    }

    function finishChar() {
        document.getElementById("btnFinishChar").innerText = "SAVING...";
        document.getElementById("btnFinishChar").disabled = true;
        if (window.CefBridge) {
            let p = { skin: String(currentSkins[charState.skin]), hat: String(hats[charState.hat]), glasses: String(glasses[charState.glass]) };
            window.CefBridge.sendClientEvent("char:save", JSON.stringify(p));
        }
    }

    // PUSAT PENERIMAAN DATA DARI PAWN
    function handleServerEvent(ev, rawData) {
        let data = {};
        if (typeof rawData === "string") { try { data = JSON.parse(rawData || "{}"); } catch (e) {} } else { data = rawData; }

        if (ev === "auth:setMode") {
            clearInterval(pingInterval);
            forceSetMode(data.mode);
        }

        if (ev === "char:showUI") {
            charState = { skin: 0, hat: 0, glass: 0 };
            showWindow("char-window");
            updateCharUI();
        }

        if (ev === "auth:error") {
            document.getElementById('errorMsg').innerText = data.msg || "Error.";
            document.getElementById('btnSubmit').disabled = false;
            document.getElementById('btnSubmit').innerText = isRegistering ? "CREATE IDENTITY" : "CONNECT TO SERVER";
        }

        // DOUBLE-TAP AGGRESSIVE HIDE (Anti Stuck "Authenticating...")
        if (ev === "auth:success") { 
            showWindow("hud-window"); 
            activeWindow = null; 
            
            if(window.CefBridge) window.CefBridge.updateInteractiveAreas("[]");
            // Paksa pembersihan layar selama 2 detik agar tidak ada yang membeku
            if(forceClearTimer) clearInterval(forceClearTimer);
            forceClearTimer = setInterval(() => {
                if(window.CefBridge) window.CefBridge.updateInteractiveAreas("[]");
            }, 100);
            setTimeout(() => clearInterval(forceClearTimer), 2000);
        }

        if (ev === "updateHP" && data.hp !== undefined) { 
            localStorage.setItem('last_hp', data.hp); 
            renderHP(); 
        }
    }

    window.Cef = {
        _events: {},
        _trigger(ev, data) { handleServerEvent(ev, data); if (this._events[ev]) this._events[ev].forEach(cb => cb(data)); },
        on(ev, cb) { if (!this._events[ev]) this._events[ev] = []; this._events[ev].push(cb); }
    };
    window.onCefEvent = handleServerEvent;

    function renderHP() {
        const hp = parseFloat(localStorage.getItem('last_hp') || 100);
        const percent = Math.min(Math.max(hp, 0), 100);
        const fill = document.getElementById("hp-fill");
        fill.style.width = percent + "%";
        document.getElementById("hp-text").innerText = hp.toFixed(1) + " / 100";
        if (percent > 60) fill.style.background = "linear-gradient(90deg, #2a9d8f, #4cd964)";
        else if (percent > 25) fill.style.background = "linear-gradient(90deg, #f59f00, #ffd24d)";
        else fill.style.background = "linear-gradient(90deg, #c92a2a, #ff4b4b)";
    }

    window.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".gender-btn").forEach(btn => { btn.addEventListener("click", () => setGender(btn.getAttribute("data-gender"), btn)); });
        document.getElementById("btnSubmit").addEventListener("click", submitForm);
        if (window.CefBridge && window.CefBridge.cefReady) window.CefBridge.cefReady();
        renderHP(); syncTouchAreas();
    });
</script>
</body>
</html>
