<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paradise - Ultimate Failsafe UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; touch-action: manipulation; }
        html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; font-family: 'Poppins', sans-serif; overflow: hidden; color: #fff; }

        .ui-window {
            position: absolute; top: 50%; right: 5%; transform: translateY(-50%);
            width: 270px; background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(10px);
            border-radius: 8px; border-left: 3px solid #ff3b3b; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: auto; display: none; 
        }

        #loading-window { display: block; text-align: center; cursor: pointer; } 

        .logo-text { font-size: 20px; font-weight: 900; margin-bottom: 0px; letter-spacing: 1px;}
        .logo-text span { color: #ff3b3b; }
        .subtitle { color: #888; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: 600;}
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; color: #aaa; font-size: 8px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px;}

        input {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 5px; color: #fff; font-size: 11px; transition: 0.3s; user-select: text; -webkit-user-select: text;
        }
        input:focus { border-color: #ff3b3b; background: rgba(0,0,0,0.6);}
        
        .gender-selector { display: flex; gap: 5px; }
        .gender-btn {
            flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px; color: #888; font-size: 9px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .gender-btn.active { background: #ff3b3b; color: #fff; border-color: #ff3b3b; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        button.btn-primary {
            width: 100%; padding: 12px; background: #ff3b3b; border: none; border-radius: 5px;
            color: #fff; font-weight: 800; font-size: 11px; cursor: pointer; margin-top: 5px; letter-spacing: 1px; text-transform: uppercase;
        }
        button.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
        .error-text { color: #ff5252; font-size: 10px; margin-bottom: 5px; text-align: center; min-height: 14px; font-weight: 600;}
        .switch-link { margin-top: 15px; font-size: 10px; color: #888; text-align: center; cursor: pointer; padding: 5px; }
        .switch-link span { color: #ff3b3b; font-weight: 700; }

        .selector-row {
            display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 5px; margin-bottom: 10px;
        }
        .selector-row span.label { font-size: 9px; font-weight: 700; color: #aaa; }
        .selector-controls { display: flex; align-items: center; gap: 10px; }
        .selector-controls button { background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 3px; cursor: pointer; font-size: 10px; padding: 4px 10px; font-weight: bold;}
        .selector-controls button:hover { background: #ff3b3b; }
        .selector-controls span.val { font-size: 10px; font-weight: 800; width: 45px; text-align: center; }

        #hud-window {
            position: absolute; top: 20px; right: 20px; width: 200px; background: rgba(15, 17, 20, 0.7);
            backdrop-filter: blur(5px); border-radius: 6px; padding: 12px; display: none; 
            border: 1px solid rgba(255,255,255,0.05); pointer-events: none; 
        }
        .hud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .hud-title { color: #a0aec0; font-size: 9px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 4px; }
        .hud-icon { color: #ff3b3b; font-size: 11px; }
        #hp-text { color: #FFF; font-weight: 800; font-size: 10px; }
        .hp-container { width: 100%; height: 8px; background: rgba(0, 0, 0, 0.6); border-radius: 4px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b3b, #ff6b6b); border-radius: 4px; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="loading-window" class="ui-window" onclick="setDisplay('login-window')">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle" style="margin-top: 10px;">Mengaitkan ke Server...</div>
    <div style="font-size: 8px; color: #ff3b3b; margin-top: 5px; font-weight: bold;">(Ketuk layar ini jika nyangkut)</div>
</div>

<div id="login-window" class="ui-window">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle">Identity Login</div>
    <div class="input-group"><label>SECURITY KEY</label><input type="password" id="loginPass" placeholder="••••••••"></div>
    <div class="error-text" id="loginError"></div>
    <button id="btnLogin" class="btn-primary" onclick="cmdLogin()">CONNECT TO SERVER</button>
    <div class="switch-link" onclick="cmdSwitch()">New to the city? <span>Register</span></div>
</div>

<div id="register-window" class="ui-window">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle">Citizen Registration</div>
    <div class="form-grid">
        <div class="input-group"><label>FIRST NAME</label><input type="text" id="regFName" placeholder="John"></div>
        <div class="input-group"><label>LAST NAME</label><input type="text" id="regLName" placeholder="Doe"></div>
    </div>
    <div class="input-group"><label>DATE OF BIRTH</label><input type="date" id="regDOB"></div>
    <div class="input-group">
        <label>GENDER</label>
        <div class="gender-selector">
            <div class="gender-btn active" id="btnMale" onclick="cmdGender('Male')">MALE</div>
            <div class="gender-btn" id="btnFemale" onclick="cmdGender('Female')">FEMALE</div>
        </div>
        <input type="hidden" id="regGender" value="Male">
    </div>
    <div class="input-group"><label>NATIONALITY</label><input type="text" id="regNation" placeholder="Indonesian"></div>
    <div class="input-group"><label>CREATE PASSWORD</label><input type="password" id="regPass"></div>
    <div class="error-text" id="regError"></div>
    <button id="btnRegister" class="btn-primary" onclick="cmdRegister()">CREATE IDENTITY</button>
    <div class="switch-link" onclick="cmdSwitch()">Already a citizen? <span>Login</span></div>
</div>

<div id="wardrobe-window" class="ui-window">
    <div class="logo-text">WARDROBE<span>RP</span></div>
    <div class="subtitle">Set your appearance</div>
    <div class="selector-row"><span class="label">OUTFIT (SKIN)</span><div class="selector-controls"><button onclick="cmdAction('random_skin')" style="width: 100px;">RANDOMIZE</button></div></div>
    <div class="selector-row"><span class="label">HEADWEAR</span><div class="selector-controls"><button onclick="cmdAction('hat_prev')">❮</button><span class="val" id="valHat">None</span><button onclick="cmdAction('hat_next')">❯</button></div></div>
    <div class="selector-row"><span class="label">EYEWEAR</span><div class="selector-controls"><button onclick="cmdAction('glass_prev')">❮</button><span class="val" id="valGlass">None</span><button onclick="cmdAction('glass_next')">❯</button></div></div>
    <button id="btnWardrobe" class="btn-primary" onclick="cmdAction('save')">FINISH & SPAWN</button>
</div>

<div id="hud-window">
    <div class="hud-header">
        <div class="hud-title"><span class="hud-icon">❤</span> HEALTH</div>
        <div id="hp-text">100 / 100</div>
    </div>
    <div class="hp-container"><div id="hp-fill"></div></div>
</div>

<script>
    let activeDiv = "loading-window";
    let isHudActive = false;

    // SINKRONISASI SENTUHAN LAYAR OTOMATIS
    setInterval(() => {
        if (!window.CefBridge) return;
        if (isHudActive || activeDiv === "") {
            window.CefBridge.updateInteractiveAreas("[]");
        } else {
            let win = document.getElementById(activeDiv);
            if (win) {
                let r = win.getBoundingClientRect();
                window.CefBridge.updateInteractiveAreas(JSON.stringify([[r.left, r.top, r.width, r.height]]));
            }
        }
    }, 150);

    // PAKSA BYPASS LOADING JIKA SERVER NGELAG! (Max 3 Detik)
    let autoBypass = setTimeout(() => {
        if(activeDiv === "loading-window") {
            setDisplay("login-window");
        }
    }, 3000);

    let ping = setInterval(() => {
        if (window.CefBridge) window.CefBridge.sendClientEvent("server:ready", "{}");
    }, 1000);

    function setDisplay(divId) {
        document.getElementById("loading-window").style.display = "none";
        document.getElementById("login-window").style.display = "none";
        document.getElementById("register-window").style.display = "none";
        document.getElementById("wardrobe-window").style.display = "none";
        document.getElementById("hud-window").style.display = "none";
        
        document.getElementById("btnLogin").innerText = "CONNECT TO SERVER";
        document.getElementById("btnRegister").innerText = "CREATE IDENTITY";
        
        if(divId) {
            document.getElementById(divId).style.display = "block";
            activeDiv = divId;
            isHudActive = (divId === "hud-window");
        }
    }

    // PINDAH MENU INSTAN (Tidak Perlu Nunggu Server)
    function cmdSwitch() {
        document.getElementById("loginError").innerText = "";
        document.getElementById("regError").innerText = "";
        if (activeDiv === "login-window") {
            setDisplay("register-window");
        } else {
            setDisplay("login-window");
        }
    }

    function cmdGender(gen) {
        document.getElementById("regGender").value = gen;
        document.getElementById("btnMale").classList.remove("active");
        document.getElementById("btnFemale").classList.remove("active");
        document.getElementById("btn" + gen).classList.add("active");
    }

    function cmdLogin() {
        document.getElementById("btnLogin").innerText = "WAIT...";
        let payload = { pass: document.getElementById("loginPass").value };
        if(window.CefBridge) window.CefBridge.sendClientEvent("server:login", JSON.stringify(payload));
    }

    function cmdRegister() {
        document.getElementById("btnRegister").innerText = "WAIT...";
        let payload = {
            fname: document.getElementById("regFName").value,
            lname: document.getElementById("regLName").value,
            dob: document.getElementById("regDOB").value,
            gen: document.getElementById("regGender").value,
            nat: document.getElementById("regNation").value,
            pass: document.getElementById("regPass").value
        };
        if(window.CefBridge) window.CefBridge.sendClientEvent("server:register", JSON.stringify(payload));
    }

    function cmdAction(act) {
        if(act === 'save') document.getElementById("btnWardrobe").innerText = "SAVING...";
        if(window.CefBridge) window.CefBridge.sendClientEvent("server:wardrobe", JSON.stringify({action: act}));
    }

    function handleServerEvent(ev, rawData) {
        let data = {};
        if (typeof rawData === "string") { try { data = JSON.parse(rawData || "{}"); } catch (e) {} } else { data = rawData; }

        if (ev === "ui:login") { clearInterval(ping); clearTimeout(autoBypass); setDisplay("login-window"); }
        if (ev === "ui:register") { clearInterval(ping); clearTimeout(autoBypass); setDisplay("register-window"); }
        if (ev === "ui:wardrobe") { clearInterval(ping); setDisplay("wardrobe-window"); }
        if (ev === "ui:hud") { clearInterval(ping); setDisplay("hud-window"); }

        if (ev === "ui:error") {
            document.getElementById("loginError").innerText = data.msg || "";
            document.getElementById("regError").innerText = data.msg || "";
            document.getElementById("btnLogin").innerText = "CONNECT TO SERVER";
            document.getElementById("btnRegister").innerText = "CREATE IDENTITY";
        }

        if (ev === "ui:update_wardrobe") {
            if(data.hat) document.getElementById("valHat").innerText = data.hat;
            if(data.glass) document.getElementById("valGlass").innerText = data.glass;
        }

        if (ev === "updateHP" && data.hp !== undefined) {
            localStorage.setItem('last_hp', data.hp);
            const percent = Math.min(Math.max(parseFloat(data.hp), 0), 100);
            document.getElementById("hp-fill").style.width = percent + "%";
            document.getElementById("hp-text").innerText = parseFloat(data.hp).toFixed(1) + " / 100";
        }
    }

    window.Cef = { _events: {}, _trigger(ev, data) { handleServerEvent(ev, data); }, on() {} };
    window.onCefEvent = handleServerEvent;
</script>
</body>
</html>
