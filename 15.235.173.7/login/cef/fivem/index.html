<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paradise RP - Auth + HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: 'Poppins', Arial, sans-serif;
            color: #fff;
            pointer-events: none;
        }

        #hud-root {
            position: absolute;
            left: 18px;
            bottom: 32px;
            width: 230px;
            height: auto;
            display: none;
            pointer-events: none;
            z-index: 5;
        }

        .hud-card {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(10, 12, 16, 0.72), rgba(20, 22, 28, 0.42));
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
        }

        .hud-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .9px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
        }

        .hud-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #ff3b3b;
            box-shadow: 0 0 12px rgba(255, 59, 59, .9);
        }

        .hp-shell {
            position: relative;
            width: 100%;
            height: 17px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }

        #hp-fill {
            width: 100%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff3030, #ff6262);
            transition: width .18s linear;
        }

        #hp-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
        }

        #auth-window {
            position: absolute;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            width: 300px;
            background: rgba(15, 17, 20, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border-left: 3px solid #ff3b3b;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
            pointer-events: auto;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .logo-text span { color: #ff3b3b; }

        .subtitle {
            color: #888;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 12px; }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 9px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px;
            color: #fff;
            font-size: 11px;
            transition: 0.2s;
            user-select: text;
            pointer-events: auto;
        }

        input:focus { border-color: #ff3b3b; }

        .gender-selector {
            display: flex;
            gap: 8px;
        }

        .gender-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px;
            color: #888;
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            pointer-events: auto;
        }

        .gender-btn.active {
            background: #ff3b3b;
            color: #fff;
            border-color: #ff3b3b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        #register-section { display: none; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #ff3b3b;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            margin-top: 10px;
            pointer-events: auto;
        }

        .btn-primary:active { transform: scale(.985); }
        .btn-primary:disabled { opacity: .55; }

        .error-text {
            color: #ff5252;
            font-size: 10px;
            margin-bottom: 8px;
            text-align: center;
            min-height: 14px;
        }

        .switch-link {
            margin-top: 15px;
            font-size: 11px;
            color: #888;
            text-align: center;
            cursor: pointer;
            pointer-events: auto;
        }

        .switch-link span {
            color: #ff3b3b;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div id="hud-root">
    <div class="hud-card">
        <div class="hud-title">
            <span>Health</span>
            <span class="hud-dot"></span>
        </div>
        <div class="hp-shell">
            <div id="hp-fill"></div>
            <div id="hp-text">100 / 100</div>
        </div>
    </div>
</div>

<div id="auth-window" class="interactive">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle" id="authSubtitle">Identity Manager</div>

    <div id="login-section">
        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
        </div>
    </div>

    <div id="register-section">
        <div class="form-grid">
            <div class="input-group"><label>FIRST NAME</label><input type="text" id="regFName" placeholder="John"></div>
            <div class="input-group"><label>LAST NAME</label><input type="text" id="regLName" placeholder="Doe"></div>
        </div>
        <div class="input-group">
            <label>DATE OF BIRTH (MAX 2010)</label>
            <input type="date" id="regDOB" max="2010-12-31">
        </div>
        <div class="input-group">
            <label>GENDER</label>
            <div class="gender-selector">
                <div class="gender-btn active" data-gender="Male">MALE</div>
                <div class="gender-btn" data-gender="Female">FEMALE</div>
            </div>
        </div>
        <div class="input-group"><label>NATIONALITY</label><input type="text" id="regNation" placeholder="Indonesian"></div>
        <div class="input-group"><label>CREATE PASSWORD</label><input type="password" id="regPass" autocomplete="new-password"></div>
    </div>

    <div class="error-text" id="errorMsg"></div>
    <button id="btnSubmit" class="btn-primary" type="button">CONNECT</button>
    <div id="switchAuth" class="switch-link">New here? <span>Register</span></div>
</div>

<script>
(function () {
    "use strict";

    let isRegistering = false;
    let selectedGender = "Male";
    let submitted = false;

    const $ = (id) => document.getElementById(id);

    window.Cef = window.Cef || {
        _events: {},
        on: function (ev, cb) {
            if (!this._events[ev]) this._events[ev] = [];
            this._events[ev].push(cb);
        },
        _trigger: function (ev, data) {
            let payload = data;
            if (typeof payload === "string") {
                try { payload = JSON.parse(payload); } catch (e) { payload = {}; }
            }
            if (this._events[ev]) this._events[ev].forEach(fn => fn(payload || {}));
        }
    };

    function bridgeReady() {
        return !!(window.CefBridge);
    }

    function emit(eventName, payload) {
        const body = {
            event: eventName,
            data: payload || {}
        };

        if (bridgeReady() && window.CefBridge.sendClientEvent) {
            // Cocok untuk JsBridge Kotlin yang memakai Gson: event + JSON string.
            window.CefBridge.sendClientEvent(eventName, JSON.stringify(body));
        }
    }

    function clearInteractiveAreas() {
        if (bridgeReady() && window.CefBridge.updateInteractiveAreas) {
            window.CefBridge.updateInteractiveAreas("[]");
        }
    }

    function sendInteractiveAreas() {
        if (!bridgeReady() || !window.CefBridge.updateInteractiveAreas) return;

        const auth = $("auth-window");
        const rects = [];

        if (auth && auth.style.display !== "none" && getComputedStyle(auth).display !== "none") {
            const r = auth.getBoundingClientRect();
            rects.push([r.left, r.top, r.width, r.height]);
        }

        window.CefBridge.updateInteractiveAreas(JSON.stringify(rects));
    }

    function areasLoop() {
        sendInteractiveAreas();
        requestAnimationFrame(areasLoop);
    }

    function showError(msg) {
        submitted = false;
        $("btnSubmit").disabled = false;
        $("errorMsg").textContent = msg || "Terjadi kesalahan.";
        sendInteractiveAreas();
    }

    function closeAuthUI() {
        submitted = false;
        const auth = $("auth-window");
        if (auth) auth.style.display = "none";

        const hud = $("hud-root");
        if (hud) hud.style.display = "block";

        clearInteractiveAreas();
    }

    function setGender(val, el) {
        selectedGender = val;
        document.querySelectorAll(".gender-btn").forEach(btn => btn.classList.remove("active"));
        el.classList.add("active");
        sendInteractiveAreas();
    }

    function toggleAuth() {
        if (submitted) return;
        isRegistering = !isRegistering;
        $("login-section").style.display = isRegistering ? "none" : "block";
        $("register-section").style.display = isRegistering ? "block" : "none";
        $("authSubtitle").innerText = isRegistering ? "Registration" : "Identity Manager";
        $("switchAuth").innerHTML = isRegistering ? "Have an account? <span>Login</span>" : "New here? <span>Register</span>";
        $("errorMsg").textContent = "";
        sendInteractiveAreas();
    }

    function submitForm() {
        if (submitted) return;

        let payload;
        let eventName;

        if (isRegistering) {
            payload = {
                password: $("regPass").value.trim(),
                firstname: $("regFName").value.trim(),
                lastname: $("regLName").value.trim(),
                dob: $("regDOB").value.trim(),
                gender: selectedGender,
                nationality: $("regNation").value.trim() || "Indonesian"
            };
            eventName = "auth:register";

            if (!payload.firstname || !payload.lastname || !payload.dob || !payload.password) {
                showError("Lengkapi semua data registrasi.");
                return;
            }
        } else {
            payload = { password: $("loginPass").value.trim() };
            eventName = "auth:login";

            if (!payload.password) {
                showError("Masukkan password.");
                return;
            }
        }

        submitted = true;
        $("btnSubmit").disabled = true;
        $("errorMsg").textContent = "Menghubungkan...";
        emit(eventName, payload);
    }

    function updateHP(payload) {
        payload = payload || {};
        const hp = Math.max(0, Math.min(100, parseFloat(payload.hp || 0)));
        const fill = $("hp-fill");
        const text = $("hp-text");
        if (!fill || !text) return;

        fill.style.width = hp + "%";
        text.textContent = hp.toFixed(0) + " / 100";
    }

    function bindTouch(el, fn) {
        let locked = false;
        function run(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (locked) return;
            locked = true;
            fn(e);
            setTimeout(() => locked = false, 220);
        }
        el.addEventListener("touchend", run, { passive: false });
        el.addEventListener("click", run, false);
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".gender-btn").forEach(btn => {
            bindTouch(btn, () => setGender(btn.getAttribute("data-gender"), btn));
        });

        bindTouch($("switchAuth"), toggleAuth);
        bindTouch($("btnSubmit"), submitForm);

        window.Cef.on("auth:success", closeAuthUI);
        window.Cef.on("auth:error", (payload) => showError(payload.msg || payload.message || "Login gagal."));
        window.Cef.on("updateHP", updateHP);

        if (bridgeReady() && window.CefBridge.cefReady) {
            window.CefBridge.cefReady();
        }
        emit("cef:ready", { ready: true });

        sendInteractiveAreas();
        areasLoop();
    });

    window.addEventListener("resize", sendInteractiveAreas);

    window.closeAuthUI = closeAuthUI;
    window.clearInteractiveAreas = clearInteractiveAreas;
})();
</script>
</body>
</html>
