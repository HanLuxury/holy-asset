<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PARADISE - FIVEM UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
            user-select: none;
        }

        body { 
            margin: 0; 
            width: 100vw; 
            height: 100vh; 
            /* BACKGROUND TRANSPARAN 100% - Game akan terlihat di belakangnya */
            background: transparent; 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
        }

        /* Base Window Style (Kaca Blur / Glassmorphism) */
        .window {
            position: absolute; 
            background: rgba(18, 20, 24, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        /* =========================================
           TAMPILAN JENDELA LOGIN (Kanan Layar)
           ========================================= */
        #login-window {
            top: 50%; right: 5%; /* Menempel di kanan layar ala FiveM */
            transform: translateY(-50%);
            width: 340px; 
            border-radius: 12px;
            border-left: 4px solid #ff3b3b;
            padding: 30px;
        }

        .logo-text {
            color: #FFF; 
            font-size: 26px;
            font-weight: 900; 
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .logo-text span { color: #ff3b3b; }

        .subtitle {
            color: #8892b0;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #a0aec0;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input {
            width: 100%; 
            padding: 14px 15px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; 
            color: #FFF; 
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #ff3b3b;
            background: rgba(0, 0, 0, 0.6);
        }

        button.btn-primary {
            width: 100%; 
            padding: 14px; 
            background: #ff3b3b; 
            border: none;
            border-radius: 6px; 
            color: #FFF; 
            font-weight: 700; 
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        button.btn-primary:hover {
            background: #e03131;
            transform: translateY(-2px);
        }

        .error-text {
            color: #ff5252;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 15px;
            min-height: 18px;
        }

        .switch-link {
            margin-top: 20px;
            font-size: 12px;
            color: #a0aec0;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: 0.3s;
        }

        .switch-link:hover { color: #FFF; }
        .switch-link span { color: #ff3b3b; font-weight: 700; }

        /* =========================================
           TAMPILAN HUD DARAH (Kanan Atas)
           ========================================= */
        #main-window {
            top: 20px; right: 20px;
            width: 250px;
            border-radius: 8px;
            padding: 15px;
            display: none; /* Sembunyikan sebelum login sukses */
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .hud-title {
            color: #a0aec0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-icon {
            color: #ff3b3b;
            font-size: 14px;
        }

        #hp-text {
            color: #FFF;
            font-weight: 700;
            font-size: 12px;
        }

        .hp-container {
            width: 100%; 
            height: 10px; /* Bar darah tipis dan modern */
            background: rgba(0, 0, 0, 0.5); 
            border-radius: 5px;
            position: relative; 
            overflow: hidden; 
            margin-bottom: 12px;
        }

        #hp-fill {
            height: 100%; 
            width: 100%; 
            background: linear-gradient(90deg, #ff3b3b, #ff6b6b);
            border-radius: 5px;
            transition: width 0.4s ease, background 0.4s ease; 
        }

        button.btn-secondary {
            width: 100%; 
            padding: 8px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; 
            color: #a0aec0; 
            font-weight: 600; 
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: #FFF;
        }
    </style>
</head>
<body>

<div class="window" id="login-window">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle" id="authTitle">Authentication Required</div>

    <div class="input-group">
        <label>SECURITY KEY</label>
        <input type="password" id="passInput" placeholder="Enter your password...">
    </div>

    <div class="error-text" id="errorMsg"></div>
    <button id="btnAction" class="btn-primary">CONNECT TO SERVER</button>
    <div class="switch-link" id="btnToggle">New to the city? <span>Register</span></div>
</div>

<div class="window
