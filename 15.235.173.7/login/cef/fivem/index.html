<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paradise - Compact UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { margin: 0; width: 100vw; height: 100vh; background: transparent; font-family: 'Poppins', sans-serif; overflow: hidden; color: #fff; }

        #auth-window {
            position: absolute; top: 50%; right: 5%; transform: translateY(-50%);
            width: 300px; /* Ukuran lebih kecil */
            background: rgba(15, 17, 20, 0.9); backdrop-filter: blur(10px);
            border-radius: 10px; border-left: 3px solid #ff3b3b; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo-text { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
        .logo-text span { color: #ff3b3b; }
        .subtitle { color: #888; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; color: #aaa; font-size: 9px; font-weight: 700; margin-bottom: 5px; }

        input {
            width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
            color: #fff; font-size: 11px; transition: 0.3s;
        }
        input:focus { border-color: #ff3b3b; }

        /* Gender Modern Pills */
        .gender-selector { display: flex; gap: 8px; }
        .gender-btn {
            flex: 1; padding: 8px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
            color: #888; font-size: 10px; font-weight: 600; text-align: center; cursor: pointer;
        }
        .gender-btn.active { background: #ff3b3b; color: #fff; border-color: #ff3b3b; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #register-section { display: none; }

        button.btn-primary {
            width: 100%; padding: 12px; background: #ff3b3b; border: none;
            border-radius: 5px; color: #fff; font-weight: 700; font-size: 11px;
            cursor: pointer; margin-top: 10px;
        }

        .error-text { color: #ff5252; font-size: 10px; margin-bottom: 8px; text-align: center; min-height: 14px; }
        .switch-link { margin-top: 15px; font-size: 11px; color: #888; text-align: center; cursor: pointer; }
        .switch-link span { color: #ff3b3b; font-weight: 700; }
    </style>
</head>
<body>

<div id="auth-window" class="interactive">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle" id="authSubtitle">Identity Manager</div>

    <div id="login-section">
        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="loginPass" placeholder="••••••••">
        </div>
    </div>

    <div id="register-section">
        <div class="form-grid">
            <div class="input-group"><label>FIRST NAME</label><input type="text" id="regFName" placeholder="John"></div>
            <div class="input-group"><label>LAST NAME</label><input type="text" id="regLName" placeholder="Doe"></div>
        </div>
        <div class="input-group">
            <label>DATE OF BIRTH (MAX 2010)</label>
            <input type="date" id="regDOB" max="2010-12-31">
        </div>
        <div class="input-group">
            <label>GENDER</label>
            <div class="gender-selector">
                <div class="gender-btn active" onclick="setGender('Male', this)">MALE</div>
                <div class="gender-btn" onclick="setGender('Female', this)">FEMALE</div>
            </div>
        </div>
        <div class="input-group"><label>NATIONALITY</label><input type="text" id="regNation" placeholder="Indonesian"></div>
        <div class="input-group"><label>CREATE PASSWORD</label><input type="password" id="regPass"></div>
    </div>

    <div class="error-text" id="errorMsg"></div>
    <button id="btnSubmit" class="btn-primary" onclick="submitForm()">CONNECT</button>
    <div class="switch-link" onclick="toggleAuth()">New here? <span>Register</span></div>
</div>

<script>
    let isRegistering = false;
    let selectedGender = "Male";

    function setGender(val, el) {
        selectedGender = val;
        document.querySelectorAll('.gender-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }

    function toggleAuth() {
        isRegistering = !isRegistering;
        document.getElementById('login-section').style.display = isRegistering ? 'none' : 'block';
        document.getElementById('register-section').style.display = isRegistering ? 'block' : 'none';
        document.getElementById('authSubtitle').innerText = isRegistering ? "Registration" : "Identity Manager";
        document.querySelector('.switch-link').innerHTML = isRegistering ? "Have an account? <span>Login</span>" : "New here? <span>Register</span>";
        sendInteractiveAreas();
    }

    function submitForm() {
        let payload = {};
        let event = isRegistering ? "auth:register" : "auth:login";

        if(isRegistering) {
            payload = {
                password: document.getElementById('regPass').value,
                firstname: document.getElementById('regFName').value,
                lastname: document.getElementById('regLName').value,
                dob: document.getElementById('regDOB').value,
                gender: selectedGender,
                nationality: document.getElementById('regNation').value
            };
        } else {
            payload = { password: document.getElementById('loginPass').value };
        }

        if(window.CefBridge) window.CefBridge.sendClientEvent(event, JSON.stringify(payload));
    }

    function sendInteractiveAreas() {
        if (window.CefBridge) {
            const r = document.getElementById('auth-window').getBoundingClientRect();
            window.CefBridge.updateInteractiveAreas(JSON.stringify([[r.left, r.top, r.width, r.height]]));
        }
    }

    window.onload = () => { if(window.CefBridge) window.CefBridge.cefReady(); sendInteractiveAreas(); };
</script>
</body>
</html>
