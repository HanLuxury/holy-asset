<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paradise - Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #auth-window {
            position: absolute;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            width: 300px;
            background: rgba(15, 17, 20, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border-left: 3px solid #ff3b3b;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .logo-text { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
        .logo-text span { color: #ff3b3b; }
        .subtitle { color: #888; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; color: #aaa; font-size: 9px; font-weight: 700; margin-bottom: 5px; }

        input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px;
            color: #fff;
            font-size: 11px;
            transition: 0.3s;
            user-select: text;
            -webkit-user-select: text;
        }

        input:focus { border-color: #ff3b3b; }
        .gender-selector { display: flex; gap: 8px; }
        .gender-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px;
            color: #888;
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .gender-btn.active { background: #ff3b3b; color: #fff; border-color: #ff3b3b; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #register-section { display: none; }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: #ff3b3b;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            margin-top: 10px;
        }

        button.btn-primary:disabled {
            opacity: 0.55;
        }

        .error-text { color: #ff5252; font-size: 10px; margin-bottom: 8px; text-align: center; min-height: 14px; }
        .switch-link { margin-top: 15px; font-size: 11px; color: #888; text-align: center; cursor: pointer; }
        .switch-link span { color: #ff3b3b; font-weight: 700; }
    </style>
</head>
<body>
<div id="auth-window" class="interactive">
    <div class="logo-text">PARADISE<span>RP</span></div>
    <div class="subtitle" id="authSubtitle">Identity Manager</div>

    <div id="login-section">
        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="off">
        </div>
    </div>

    <div id="register-section">
        <div class="form-grid">
            <div class="input-group"><label>FIRST NAME</label><input type="text" id="regFName" placeholder="John" autocomplete="off"></div>
            <div class="input-group"><label>LAST NAME</label><input type="text" id="regLName" placeholder="Doe" autocomplete="off"></div>
        </div>
        <div class="input-group">
            <label>DATE OF BIRTH (MAX 2010)</label>
            <input type="date" id="regDOB" max="2010-12-31">
        </div>
        <div class="input-group">
            <label>GENDER</label>
            <div class="gender-selector">
                <div class="gender-btn active" data-gender="Male">MALE</div>
                <div class="gender-btn" data-gender="Female">FEMALE</div>
            </div>
        </div>
        <div class="input-group"><label>NATIONALITY</label><input type="text" id="regNation" placeholder="Indonesian" autocomplete="off"></div>
        <div class="input-group"><label>CREATE PASSWORD</label><input type="password" id="regPass" autocomplete="off"></div>
    </div>

    <div class="error-text" id="errorMsg"></div>
    <button id="btnSubmit" class="btn-primary" type="button">CONNECT</button>
    <div id="switchAuth" class="switch-link">New here? <span>Register</span></div>
</div>

<script>
    let isRegistering = false;
    let selectedGender = "Male";
    let authClosed = false;
    let areaLoopStarted = false;

    function bridgeLog(msg) {
        try {
            if (window.CefBridge && window.CefBridge.log) window.CefBridge.log(String(msg));
        } catch (e) {}
    }

    function clearInteractiveAreas() {
        try {
            if (window.CefBridge && window.CefBridge.updateInteractiveAreas) {
                window.CefBridge.updateInteractiveAreas("[]");
            }
        } catch (e) {}
    }

    function sendInteractiveAreas() {
        if (authClosed) {
            clearInteractiveAreas();
            return;
        }

        try {
            const win = document.getElementById("auth-window");
            if (!win || win.style.display === "none") {
                clearInteractiveAreas();
                return;
            }

            const r = win.getBoundingClientRect();
            const rects = [[r.left, r.top, r.width, r.height]];

            if (window.CefBridge && window.CefBridge.updateInteractiveAreas) {
                window.CefBridge.updateInteractiveAreas(JSON.stringify(rects));
            }
        } catch (e) {
            clearInteractiveAreas();
        }
    }

    function startInteractiveLoop() {
        if (areaLoopStarted) return;
        areaLoopStarted = true;

        const loop = () => {
            sendInteractiveAreas();
            if (!authClosed) requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    }

    function setGender(val, el) {
        selectedGender = val;
        document.querySelectorAll(".gender-btn").forEach(btn => btn.classList.remove("active"));
        el.classList.add("active");
        sendInteractiveAreas();
    }

    function toggleAuth() {
        if (authClosed) return;
        isRegistering = !isRegistering;
        document.getElementById("login-section").style.display = isRegistering ? "none" : "block";
        document.getElementById("register-section").style.display = isRegistering ? "block" : "none";
        document.getElementById("authSubtitle").innerText = isRegistering ? "Registration" : "Identity Manager";
        document.getElementById("switchAuth").innerHTML = isRegistering ? "Have an account? <span>Login</span>" : "New here? <span>Register</span>";
        document.getElementById("btnSubmit").innerText = isRegistering ? "CREATE ACCOUNT" : "CONNECT";
        document.getElementById("errorMsg").innerText = "";
        sendInteractiveAreas();
    }

    function sendClientEvent(eventName, payload) {
        const json = JSON.stringify(payload || {});

        if (window.CefBridge && window.CefBridge.sendClientEvent) {
            window.CefBridge.sendClientEvent(eventName, json);
            return true;
        }

        bridgeLog("CefBridge.sendClientEvent not found");
        return false;
    }

    function submitForm() {
        if (authClosed) return;

        const btn = document.getElementById("btnSubmit");
        const err = document.getElementById("errorMsg");
        err.innerText = "";

        let payload = {};
        let eventName = isRegistering ? "auth:register" : "auth:login";

        if (isRegistering) {
            payload = {
                password: document.getElementById("regPass").value.trim(),
                firstname: document.getElementById("regFName").value.trim(),
                lastname: document.getElementById("regLName").value.trim(),
                dob: document.getElementById("regDOB").value.trim(),
                gender: selectedGender,
                nationality: document.getElementById("regNation").value.trim()
            };

            if (!payload.firstname || !payload.lastname || !payload.dob || !payload.nationality || !payload.password) {
                err.innerText = "Lengkapi semua data register.";
                return;
            }
        } else {
            payload = { password: document.getElementById("loginPass").value.trim() };
            if (!payload.password) {
                err.innerText = "Masukkan password.";
                return;
            }
        }

        btn.disabled = true;
        btn.innerText = "PLEASE WAIT...";

        if (!sendClientEvent(eventName, payload)) {
            btn.disabled = false;
            btn.innerText = isRegistering ? "CREATE ACCOUNT" : "CONNECT";
            err.innerText = "CEF bridge belum siap.";
        }
    }

    function closeAuthUI() {
        authClosed = true;
        clearInteractiveAreas();

        const win = document.getElementById("auth-window");
        if (win) win.style.display = "none";

        clearInteractiveAreas();
        setTimeout(clearInteractiveAreas, 50);
        setTimeout(clearInteractiveAreas, 250);
    }

    function handleServerEvent(eventName, rawData) {
        let data = rawData;
        if (typeof rawData === "string") {
            try { data = JSON.parse(rawData || "{}"); } catch (e) { data = {}; }
        }

        if (eventName === "auth:success" || eventName === "cef:hide" || eventName === "auth:hide") {
            closeAuthUI();
            return;
        }

        if (eventName === "auth:error") {
            const btn = document.getElementById("btnSubmit");
            const err = document.getElementById("errorMsg");
            authClosed = false;
            if (btn) {
                btn.disabled = false;
                btn.innerText = isRegistering ? "CREATE ACCOUNT" : "CONNECT";
            }
            if (err) err.innerText = (data && data.msg) ? data.msg : "Login/Register gagal.";
            sendInteractiveAreas();
        }
    }

    function bindTap(el, fn) {
        if (!el) return;
        let lastTouch = 0;

        el.addEventListener("touchend", function(e) {
            e.preventDefault();
            lastTouch = Date.now();
            fn(e);
        }, { passive: false });

        el.addEventListener("click", function(e) {
            if (Date.now() - lastTouch < 500) return;
            fn(e);
        });
    }

    window.Cef = window.Cef || {};
    window.Cef._events = window.Cef._events || {};
    window.Cef.on = function(eventName, cb) {
        if (!window.Cef._events[eventName]) window.Cef._events[eventName] = [];
        window.Cef._events[eventName].push(cb);
    };
    window.Cef._trigger = function(eventName, data) {
        handleServerEvent(eventName, data);
        const list = window.Cef._events[eventName] || [];
        list.forEach(cb => {
            try { cb(data); } catch (e) {}
        });
    };

    window.onCefEvent = handleServerEvent;
    window.cefEvent = handleServerEvent;

    window.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".gender-btn").forEach(btn => {
            bindTap(btn, () => setGender(btn.getAttribute("data-gender") || "Male", btn));
        });

        bindTap(document.getElementById("btnSubmit"), submitForm);
        bindTap(document.getElementById("switchAuth"), toggleAuth);

        if (window.CefBridge && window.CefBridge.cefReady) {
            window.CefBridge.cefReady();
        }

        startInteractiveLoop();
        setTimeout(sendInteractiveAreas, 100);
        setTimeout(sendInteractiveAreas, 500);
    });

    window.addEventListener("resize", sendInteractiveAreas);
    window.addEventListener("pagehide", clearInteractiveAreas);
    window.addEventListener("beforeunload", clearInteractiveAreas);
</script>
</body>
</html>
